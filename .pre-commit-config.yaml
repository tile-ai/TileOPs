ci:
  autofix_prs: false
  autofix_commit_msg: "[Chore][Lint] pre-commit.ci auto fixes"
  autoupdate_commit_msg: "[CI] [pre-commit.ci] autoupdate"
  autoupdate_schedule: monthly
default_stages: [pre-commit, pre-push, manual]


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
        fail_fast: true
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: check-ast
        fail_fast: true
      - id: debug-statements
      - id: file-contents-sorter
        args: [--ignore-case]
        files: ^docs/spelling_wordlist\.txt$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix, --config, pyproject.toml]
      - id: ruff-format
        args: [--config, pyproject.toml]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: [".[toml]"]
        exclude: |
          (?x)(
            ^.+\.(cpp|hpp|cxx|cc|c|h|cu|cuh)$|
            ^.+\.svg$|
            ^.*\brequirements\b.*\.txt$
          )

  - repo: local
    hooks:
      - id: shipped-refs-lint
        name: shipped-source reference lint
        entry: python scripts/lint/shipped_refs_lint.py
        language: python
        files: ^(src/tileops|tests|benchmarks|scripts|workloads)/
        types: [text]
      - id: workload-names-lint
        name: benchmark case name lint
        entry: python scripts/lint/workload_names_lint.py
        language: python
        files: ^benchmarks/ops/.*\.py$

      - id: bench-baseline-lint
        name: benchmark baseline lint
        entry: python scripts/lint/bench_baseline_lint.py
        language: python
        files: ^benchmarks/.*\.py$

      - id: op-docstrings-lint
        name: op docstring lint
        entry: python scripts/lint/op_docstrings_lint.py
        language: python
        files: ^src/tileops/ops/.*\.py$

      - id: tilelang-idioms-lint
        name: TileLang idiom lint
        entry: python scripts/lint/tilelang_idioms_lint.py
        language: python
        files: ^(src/tileops|tests|benchmarks|workloads)/.*\.py$

      - id: device-literal-lint
        name: test and workload device lint
        entry: python scripts/lint/device_literal_lint.py
        language: python
        files: ^(tests|workloads)/.*\.py$

      - id: interface-names-lint
        name: kernel interface name lint
        entry: python scripts/lint/interface_names_lint.py
        language: python
        files: ^src/tileops/kernels/.*\.py$

      - id: module-constant-lint
        name: module constant name lint
        entry: python scripts/lint/module_constant_lint.py
        language: python
        pass_filenames: false
        files: ^src/tileops/.*\.py$

      - id: op-naming-lint
        name: manifest op name lint
        entry: python scripts/lint/op_naming_lint.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: false
        files: ^src/tileops/manifest/spec/.*\.yaml$

      - id: manifest-spec-layout
        name: manifest spec layout
        entry: "manifest YAML goes directly in src/tileops/manifest/spec/ as .yaml, the only place the loader reads"
        language: fail
        files: ^src/tileops/manifest/(?!spec/[^/]+\.yaml$)(?:.*\.ya?ml|spec/.*)$

      - id: native-sources-in-csrc
        name: C++/CUDA sources belong in src/tileops/csrc
        entry: C++/CUDA sources belong in src/tileops/csrc/; reference them through tileops._csrc.csrc_path.
        language: fail
        files: ^src/tileops/(?!csrc/).*\.(c|cc|cpp|cxx|cu|cuh|h|hpp|inl)$

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.1
    hooks:
      - id: clang-format
        files: ^src/tileops/csrc/.*\.(c|cc|cpp|cxx|cu|cuh|h|hpp|inl)$

  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.22
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm==0.4.1
          - mdformat-black==0.1.1
          - mdformat-myst==0.2.1
          - mdformat-tables==1.0.0
          - mdformat-toc==0.3.0
