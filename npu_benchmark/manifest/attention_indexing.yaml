TopkSelectorOp:
  ref_api: "torch.topk"
  family: attention_indexing
  status: implemented

  signature:
    inputs:
      index_score: {dtype: "float32", shape: "[batch, seq_len, seq_len_kv, kv_group]"}
      starts: {dtype: "int32", shape: "[batch, seq_len]"}
      ends: {dtype: "int32", shape: "[batch, seq_len]"}
    outputs:
      indexes: {dtype: "int32", shape: "[batch, seq_len, kv_group, topk]"}
    params:
      topk: {type: int}
    shape_rules:
    - "index_score.ndim == 4"
    - "starts.shape == (index_score.shape[0], index_score.shape[1])"
    - "ends.shape == (index_score.shape[0], index_score.shape[1])"
    - "0 < topk <= index_score.shape[2]"

  workloads:
  - {batch: 4, seq_len: 256, seq_len_kv: 1024, kv_group: 1, topk: 32, in_dtype: float32, out_dtype: int32, label: "smoke-topk32"}
  - {batch: 1, seq_len: 32768, seq_len_kv: 65536, kv_group: 1, topk: 1024, in_dtype: float32, out_dtype: int32, label: "topk1024-s32k-kv64k"}
  - {batch: 1, seq_len: 32768, seq_len_kv: 65536, kv_group: 1, topk: 2048, in_dtype: float32, out_dtype: int32, label: "topk2048-s32k-kv64k"}

  roofline:
    func: "perf.formulas.topk_selector_roofline"

  source:
    kernel: kernels/topk_selector.py
    kernel_map:
      topk_selector_kernel: TopkSelectorKernel
    op: ops/topk_selector.py
    test: tests/ops/test_topk_selector.py
    bench: benchmarks/ops/bench_topk_selector.py
