    - label: ropelongrope-4
      layout: 1d
      S: 8192
      D: 128
      dtype_cases:
      - T: bfloat16
        R: float32
      expect_fail: true
    - label: ropelongrope-5
      layout: 1d
      S: 8192
      D: 128
      some:
      - rescale_factors
      dtype_cases:
      - T: bfloat16
      expect_fail: true
