# Signatures the validator accepts, with workload rows; `expect_fail` rows must be rejected
# (docs/design/manifest.md § Signature, § Workloads).
adts:
  MGroupedLayout:
    sum:
      contiguous:
        python: tileops.ops.moe.contracts.ContiguousLayoutSpec
        fields:
          packing:
            type: '''tight'' | ''aligned'''
            python: tileops.ops.moe.contracts.ContiguousPacking
          metadata_kind:
            type: '''physical_psum'' | ''per_row'''
            python: tileops.ops.moe.contracts.ContiguousMetadata
          alignment: Dim
        invariant: (packing == 'tight') == (alignment == 1) and alignment >= 1
      masked:
        python: tileops.ops.moe.contracts.MaskedLayoutSpec
        fields:
          max_m: Dim
entries:
  GemmFwdOp:
    signature:
      types:
        Mat:
          params:
            t: Bool
            R: Dim
            C: Dim
          match: t
          cases:
          - when: false
            is: '[R, C]'
          - when: true
            is: '[C, R]'
      forall:
        M: Dim
        N: Dim
        K: Dim
        T: DType[float16 | bfloat16]
      params:
        trans_a:
          type: bool
        trans_b:
          type: bool
      inputs:
        a:
          dtype: T
          shape: Mat[trans_a, M, K]
        b:
          dtype: T
          shape: Mat[trans_b, K, N]
      outputs:
        d:
          dtype: T
          shape: '[M, N]'
    workloads:
    - label: gemm-0
      M: 1024
      N: 512
      K: 256
      trans_a: false
      trans_b: true
      dtype_cases:
      - T: float16
    - label: gemm-1
      M: 8
      N: 4
      K: 2
      trans_a: true
      trans_b: false
      dtype_cases:
      - T: bfloat16
  ClampFwdOp:
    signature:
      types:
        ClampOut:
          params:
            A: Shape
            L: Shape
            U: Shape
            pl: Bool
            pu: Bool
          match:
          - pl
          - pu
          cases:
          - when:
            - true
            - true
            is: '[*broadcast(A, L, U)]'
          - when:
            - true
            - false
            is: '[*broadcast(A, L)]'
          - when:
            - false
            - true
            is: '[*broadcast(A, U)]'
      forall:
        A: Shape
        L: Shape
        U: Shape
        T: DType[float16 | bfloat16 | float32]
      inputs:
        input:
          dtype: T
          shape: '[*A]'
        min:
          dtype: T
          optional: true
          shape: '[*L]'
        max:
          dtype: T
          optional: true
          shape: '[*U]'
      outputs:
        output:
          dtype: T
          shape: ClampOut[A, L, U, present(min), present(max)]
      shape_rules:
      - present(min) or present(max)
    workloads:
    - label: clamp-0
      A:
      - 4096
      - 4096
      L:
      - 4096
      - 4096
      U:
      - 4096
      - 4096
      some:
      - min
      - max
      dtype_cases:
      - T: float16
    - label: clamp-1
      A:
      - 8
      - 1
      - 16
      L:
      - 4
      - 16
      some:
      - min
      dtype_cases:
      - T: float32
    - label: clamp-2
      A:
      - 8
      - 16
      expect_fail: true
      dtype_cases:
      - T: float16
  MeanPoolingFwdOp:
    signature:
      types:
        PoolOut:
          params:
            p: Bool
            B: Dim
            NC: Dim
            S: Dim
            c: Dim
            H: Dim
            D: Dim
          match: p
          cases:
          - when: true
            is: '[B, NC, H, D]'
          - when: false
            is: '[B, ceil_div(S, c), H, D]'
      forall:
        B: Dim
        S: Dim
        H: Dim
        D: Dim
        NS: Dim
        NC: Dim
        T: DType[float16 | bfloat16 | float32]
        seq_lens: Seq[Int]
      params:
        chunk_size:
          type: int
        accum_dtype:
          type: torch.dtype
      inputs:
        x:
          dtype: T
          shape: '[B, S, H, D]'
        offsets:
          dtype: int32
          optional: true
          shape: '[NS + 1]'
          values: prefix_sum(seq_lens)
          requires:
          - prefix_offsets(S)
        indices:
          dtype: int32
          optional: present(offsets)
          shape: '[NC, 2]'
          values: chunk_indices(seq_lens, chunk_size)
      outputs:
        output:
          dtype: T
          shape: PoolOut[present(offsets), B, NC, S, chunk_size, H, D]
      shape_rules:
      - chunk_size > 0 and chunk_size % 32 == 0
    workloads:
    - label: meanpooling-0
      B: 1
      S: 8192
      H: 64
      D: 128
      chunk_size: 64
      accum_dtype: float32
      dtype_cases:
      - T: float16
    - label: meanpooling-1
      B: 1
      S: 8192
      H: 64
      D: 128
      seq_lens:
      - 4096
      - 4096
      chunk_size: 64
      accum_dtype: float32
      some:
      - offsets
      dtype_cases:
      - T: float16
    - label: meanpooling-2
      B: 1
      S: 8192
      H: 64
      D: 128
      NC: 128
      seq_lens:
      - 4096
      - 4096
      chunk_size: 64
      accum_dtype: float32
      some:
      - offsets
      expect_fail: true
      dtype_cases:
      - T: float16
    - label: meanpooling-3
      B: 1
      S: 8000
      H: 64
      D: 128
      seq_lens:
      - 4096
      - 4096
      chunk_size: 64
      accum_dtype: float32
      some:
      - offsets
      expect_fail: true
      dtype_cases:
      - T: float16
    - label: meanpooling-4
      B: 1
      S: 8192
      H: 64
      D: 128
      seq_lens:
      - 4096
      - 4096
      chunk_size: 64
      accum_dtype: float32
      expect_fail: true
      dtype_cases:
      - T: float16
  RMSNormFwdOp:
    signature:
      forall:
        B: Shape
        T: DType[float16 | bfloat16]
      params:
        normalized_shape:
          type: list[int] | tuple[int, ...]
      inputs:
        x:
          dtype: T
          shape: '[*B, *normalized_shape]'
        weight:
          dtype: T
          shape: '[*normalized_shape]'
      outputs:
        output:
          dtype: T
          shape: '[*B, *normalized_shape]'
      shape_rules:
      - len(normalized_shape) > 0
    workloads:
    - label: rmsnorm-0
      B:
      - 2048
      normalized_shape:
      - 4096
      dtype_cases:
      - T: float16
      - T: bfloat16
    - label: rmsnorm-1
      B:
      - 4
      - 128
      normalized_shape:
      - 16
      - 64
      dtype_cases:
      - T: bfloat16
  SumFwdOp:
    signature:
      forall:
        S: Shape
        T: DType[float16 | bfloat16 | float32]
      params:
        dim:
          type: int | list[int] | None
          default: null
        keepdim:
          type: bool
          default: false
      inputs:
        x:
          dtype: T
          shape: '[*S]'
      outputs:
        output:
          dtype: T
          shape: '[*reduced(S, dim, keepdim, ''full'')]'
      shape_rules:
      - valid_axes(dim, len(S)) and unique_axes(dim, len(S))
    workloads:
    - label: sum-0
      S:
      - 2048
      - 4096
      dim: -1
      dtype_cases:
      - T: float16
    - label: sum-1
      S:
      - 4
      - 8
      - 16
      dim:
      - 0
      - 2
      keepdim: true
      dtype_cases:
      - T: float32
    - label: sum-2
      S:
      - 4
      - 8
      dtype_cases:
      - T: float32
    - label: sum-3
      S:
      - 4
      - 8
      dim:
      - 0
      - 0
      expect_fail: true
      dtype_cases:
      - T: float32
    - label: sum-4
      S: []
      dim: -1
      dtype_cases:
      - T: float32
    - label: sum-5
      S: []
      dim: 1
      expect_fail: true
      dtype_cases:
      - T: float32
    - label: sum-6
      S: []
      dim:
      - 0
      dtype_cases:
      - T: float32
    - label: sum-7
      S: []
      dim:
      - -1
      dtype_cases:
      - T: float32
    - label: sum-8
      S: []
      dim:
      - 0
      - -1
      expect_fail: true
      dtype_cases:
      - T: float32
  InfNormFwdOp:
    signature:
      forall:
        S: Shape
        T: DType[float16 | bfloat16 | float32]
      params:
        ord:
          type: float
          default: .inf
        dim:
          type: int | list[int] | None
          default: null
        keepdim:
          type: bool
          default: false
      inputs:
        x:
          dtype: T
          shape: '[*S]'
      outputs:
        output:
          dtype: T
          shape: '[*reduced(S, dim, keepdim, ''full'')]'
      shape_rules:
      - ord == inf
      - valid_axes(dim, len(S)) and unique_axes(dim, len(S))
    workloads:
    - label: infnorm-0
      S:
      - 1024
      - 4096
      dim: -1
      dtype_cases:
      - T: bfloat16
    - label: infnorm-1
      S:
      - 1024
      - 4096
      dim: -1
      ord: 2.0
      expect_fail: true
      dtype_cases:
      - T: bfloat16
  MaxPool2dFwdOp:
    signature:
      forall:
        N: Dim
        C: Dim
        H_in: Dim
        W_in: Dim
        T: DType[float16 | bfloat16 | float32]
      params:
        kernel_size:
          type: int | tuple[int, int]
        stride:
          type: int | tuple[int, int] | None
          default: null
        padding:
          type: int | tuple[int, int]
          default: 0
        dilation:
          type: int | tuple[int, int]
          default: 1
        ceil_mode:
          type: bool
          default: false
      inputs:
        input:
          dtype: T
          shape: '[N, C, H_in, W_in]'
      outputs:
        output:
          dtype: T
          shape: '[N, C, H_out, W_out]'
      let:
        kH: per_axis(kernel_size, 0, 2)
        kW: per_axis(kernel_size, 1, 2)
        sH: per_axis(stride, 0, 2, fallback=kH)
        sW: per_axis(stride, 1, 2, fallback=kW)
        pH: per_axis(padding, 0, 2)
        pW: per_axis(padding, 1, 2)
        H_out: pool.out(H_in, kH, sH, pH, per_axis(dilation, 0, 2), ceil_mode)
        W_out: pool.out(W_in, kW, sW, pW, per_axis(dilation, 1, 2), ceil_mode)
      shape_rules:
      - kH > 0 and kW > 0 and sH > 0 and sW > 0
      - per_axis(dilation, 0, 2) > 0 and per_axis(dilation, 1, 2) > 0
      - 0 <= pH <= kH // 2 and 0 <= pW <= kW // 2
    workloads:
    - label: maxpool2d-0
      N: 32
      C: 64
      H_in: 112
      W_in: 112
      kernel_size:
      - 3
      - 3
      stride:
      - 2
      - 2
      padding:
      - 1
      - 1
      dtype_cases:
      - T: float16
    - label: maxpool2d-1
      N: 1
      C: 8
      H_in: 7
      W_in: 9
      kernel_size: 2
      dtype_cases:
      - T: float32
    - label: maxpool2d-2
      N: 1
      C: 8
      H_in: 7
      W_in: 7
      kernel_size: 3
      stride: 2
      ceil_mode: true
      dtype_cases:
      - T: float32
  GemmFp8FwdOp:
    signature:
      forall:
        M: Dim
        N: Dim
        K: Dim
        SA: Shape
        SB: Shape
      params:
        out_dtype:
          type: bfloat16 | float16
          default: bfloat16
      inputs:
        a:
          dtype: float8_e4m3fn
          shape: '[M, K]'
        b:
          dtype: float8_e4m3fn
          shape: '[N, K]'
        scale_a:
          dtype: float32
          shape: '[*SA]'
        scale_b:
          dtype: float32
          shape: '[*SB]'
        bias:
          dtype: out_dtype
          optional: true
          shape: '[N]'
      outputs:
        d:
          dtype: out_dtype
          shape: '[M, N]'
      shape_rules:
      - (SA == (1, 1) and SB == (1, 1)) or (SA == (M, ceil_div(K, 128)) and SB == (N, ceil_div(K, 128)))
    workloads:
    - label: gemmfp8-0
      M: 128
      N: 2112
      K: 7168
      SA:
      - 1
      - 1
      SB:
      - 1
      - 1
    - label: gemmfp8-1
      M: 128
      N: 2112
      K: 7168
      SA:
      - 128
      - 56
      SB:
      - 2112
      - 56
      some:
      - bias
      out_dtype: float16
    - label: gemmfp8-2
      M: 128
      N: 2112
      K: 7168
      SA:
      - 128
      - 55
      SB:
      - 2112
      - 56
      expect_fail: true
    - label: gemmfp8-3
      M: 128
      N: 2112
      K: 7168
      SA:
      - 1
      - 1
      SB:
      - 1
      - 1
      dtypes:
      - float8_e4m3fn
      expect_fail: true
    - label: gemmfp8-4
      M: 128
      N: 2112
      K: 7168
      SA:
      - 1
      - 1
      SB:
      - 1
      - 1
      out_dtype: float32
      expect_fail: true
  SiluAndMulFwdOp:
    signature:
      forall:
        M: Dim
        N: Dim
        T: DType[float16 | bfloat16]
      inputs:
        x:
          dtype: T
          shape: '[M, 2 * N]'
      outputs:
        output:
          dtype: T
          shape: '[M, N]'
    workloads:
    - label: siluandmul-0
      M: 4096
      N: 11008
      dtype_cases:
      - T: bfloat16
  DSADecodeFwdOp:
    signature:
      forall:
        B: Dim
        S: Dim
        H: Dim
        D: Dim
        T: DType[float16 | bfloat16]
      params:
        dim_tail:
          type: int
      inputs:
        q:
          dtype: T
          shape: '[B, S, H, D + dim_tail]'
      outputs:
        o:
          dtype: T
          shape: '[B, S, H, D]'
    workloads:
    - label: dsadecode-0
      B: 1
      S: 1024
      H: 128
      D: 512
      dim_tail: 64
      dtype_cases:
      - T: float16
  FusedMoeSharedExpertFwdOp:
    signature:
      forall:
        E: Dim
        T: DType[float16 | bfloat16]
      params:
        num_tokens:
          type: int
        hidden_size:
          type: int
        shared_ffn_size:
          type: int | None
          default: null
      inputs:
        hidden_states:
          dtype: T
          shape: '[num_tokens, hidden_size]'
        gating_output:
          dtype: float32
          shape: '[num_tokens, E]'
        shared_w_gate_up:
          dtype: T
          optional: present(shared_ffn_size)
          shape: '[2 * shared_ffn_size.value, hidden_size]'
        shared_w_down:
          dtype: T
          optional: present(shared_ffn_size)
          shape: '[hidden_size, shared_ffn_size.value]'
      outputs:
        shared_output:
          dtype: T
          nullable: present(shared_ffn_size)
          shape: '[num_tokens, hidden_size]'
        routed_output:
          dtype: T
          shape: '[num_tokens, hidden_size]'
    workloads:
    - label: fusedmoesharedexpert-0
      E: 384
      num_tokens: 1
      hidden_size: 7168
      shared_ffn_size: 18432
      dtype_cases:
      - T: bfloat16
    - label: fusedmoesharedexpert-1
      E: 128
      num_tokens: 32
      hidden_size: 4096
      dtype_cases:
      - T: bfloat16
  MoePrePermuteFwdOp:
    signature:
      types:
        ExpertRows:
          params:
            layout: MGroupedLayout
            E: Dim
            P: Dim
            H: Dim
          match: layout
          cases:
          - when:
              masked: _
            is: '[E, layout.max_m, H]'
          - when:
              contiguous: _
            is: '[P, H]'
        LayoutMetadata:
          params:
            layout: MGroupedLayout
            E: Dim
            P: Dim
          match: layout
          cases:
          - when:
              masked: _
            is: '[E]'
          - when:
              contiguous:
                metadata_kind: physical_psum
            is: '[E]'
          - when:
              contiguous:
                metadata_kind: per_row
            is: '[P]'
      forall:
        N_tok: Dim
        H: Dim
        K: Dim
        T: DType[float16 | bfloat16]
      params:
        layout:
          type: MGroupedLayout
        num_local_experts:
          type: int
      inputs:
        hidden_states:
          dtype: T
          shape: '[N_tok, H]'
        local_expert_ids:
          dtype: int32
          shape: '[N_tok, K]'
          values: topk_ids(N_tok, K, num_local_experts)
          requires:
          - in_range(0, num_local_experts)
      let:
        P: moe.capacity(layout, N_tok * K, num_local_experts)
      outputs:
        expert_input:
          dtype: T
          shape: ExpertRows[layout, num_local_experts, P, H]
        layout_metadata:
          dtype: int32
          shape: LayoutMetadata[layout, num_local_experts, P]
        inverse_indices:
          dtype: int32
          shape: '[N_tok * K]'
      shape_rules:
      - num_local_experts > 0
      - K > 0
    workloads:
    - label: moeprepermute-0
      N_tok: 32
      H: 128
      K: 2
      num_local_experts: 4
      layout:
        contiguous:
          packing: tight
          metadata_kind: physical_psum
          alignment: 1
      dtype_cases:
      - T: float16
    - label: moeprepermute-1
      N_tok: 32
      H: 128
      K: 2
      num_local_experts: 4
      layout:
        contiguous:
          packing: aligned
          metadata_kind: per_row
          alignment: 64
      dtype_cases:
      - T: bfloat16
    - label: moeprepermute-2
      N_tok: 32
      H: 128
      K: 2
      num_local_experts: 4
      layout:
        masked:
          max_m: 256
      dtype_cases:
      - T: bfloat16
    - label: moeprepermute-3
      N_tok: 32
      H: 128
      K: 2
      num_local_experts: 4
      layout:
        contiguous:
          packing: tight
          metadata_kind: per_row
          alignment: 4
      expect_fail: true
      dtype_cases:
      - T: bfloat16
    - label: moeprepermute-4
      N_tok: 32
      H: 128
      K: 5
      num_local_experts: 4
      layout:
        contiguous:
          packing: tight
          metadata_kind: physical_psum
          alignment: 1
      expect_fail: true
      dtype_cases:
      - T: float16
  GQAPrefillVarlenFwdOp:
