      B: 1
      S: 4096
      H: 32
      D: 128
      some:
      - rescale_factors
      dtype_cases:
      - T: float16
        R: float16
    - label: ropelongrope-3
      layout: 1d
      S: 8192
      D: 128
      some:
      - rescale_factors
      dtype_cases:
      - T: bfloat16
        R: float8_e4m3fn
