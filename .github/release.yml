# Categories for the generated release-notes draft. The labels are the ones
# auto-label.yml applies from a PR title's type prefix (scripts/ci/types.sh);
# `breaking change` is applied by a reviewer. Every label not named below, and a PR with
# no label at all, reaches "Other changes".
changelog:
  exclude:
    labels:
      - type:chore
      - type:ci
      - type:test
      - type:style
  categories:
    - title: Breaking changes
      labels:
        - breaking change
    - title: Features
      labels:
        - type:feat
    - title: Enhancements
      labels:
        - type:enhancement
    - title: Performance
      labels:
        - type:perf
    - title: Bug fixes
      labels:
        - type:fix
    - title: Refactoring
      labels:
        - type:refactor
    - title: Documentation
      labels:
        - type:docs
    - title: Other changes
      labels:
        - "*"
