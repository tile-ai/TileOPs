# Categories for the generated release-notes draft. The labels are the ones
# auto-label.yml applies from a PR title's type prefix (.claude/conventions/types.sh);
# `breaking change` is applied by a reviewer. Every label not named below, and a PR with
# no label at all, reaches "Other changes".
changelog:
  exclude:
    labels:
      - chore
      - ci
      - test
      - style
  categories:
    - title: Breaking changes
      labels:
        - breaking change
    - title: Features
      labels:
        - feature
    - title: Enhancements
      labels:
        - enhancement
    - title: Performance
      labels:
        - perf
    - title: Bug fixes
      labels:
        - fix
    - title: Refactoring
      labels:
        - refactor
    - title: Documentation
      labels:
        - docs
    - title: Other changes
      labels:
        - "*"
