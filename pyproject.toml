[project]
name = "tileops"
dynamic = ["version"]
description = "TileOPs kernels for efficient LLM inference."
readme = "README.md"
authors = [{ name="Tile-AI"}]
dependencies = [
    # The one combination .github/workflows/release.yml verifies on an SM90 device, from
    # official PyPI. Widening any of them means verifying that combination there first.
    "torch>=2.13.0,<2.14.0",
    "tilelang==0.1.12",
    "pyyaml>=6.0.1,<7",
]
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "inference", "gpu", "kernel", "tiling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/tile-ai/TileOPs"
Repository = "https://github.com/tile-ai/TileOPs"
Documentation = "https://tile-ai.github.io/TileOPs.github.io/"
Issues = "https://github.com/tile-ai/TileOPs/issues"

[project.optional-dependencies]
dev = [
    "ruff==0.14.13",
    "codespell==2.4.1",
    # workloads/attention/deepseek_attention.py, which tests and benchmarks import;
    # nothing under src/ does.
    "einops",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.0",
    "pyyaml>=6.0.1",
]
bench = [
    "flash-attn==2.8.3",
    "flash-attn-interface>=2.8.3",
    "flash-linear-attention==0.5.2",
    "flashinfer>=0.6.6",
    "vllm==0.27.1",
    "sgl-kernel==0.3.21",
    "nvmath-python==1.0.0",
]

[build-system]
# setuptools>=77 is the floor for SPDX `license = "MIT"` expressions.
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Used when there is no git metadata (sdist tarballs, vendored copies). It must
# not carry a `.devN` suffix: setuptools-scm derives the dev distance from the
# commit count, and errors out rather than accept a pre-set one.
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
# src layout: a new top-level directory cannot reach the wheel by being forgotten
# in an exclude list, and the repo root stays off sys.path, so tests import the
# installed package rather than the source tree.
where = ["src"]

[tool.setuptools.package-data]
# Kernel headers and YAML data are opened at run time by path relative to
# __file__, so all of them must ship. Stated by extension, not by name, so a new
# resource is covered on arrival. Enforced by scripts/ci/check_dist_contents.py.
tileops = ["**/*.h", "**/*.yaml"]

[tool.codespell]
ignore-words-list = "nd, te, ist, LOD, offen, NotIn, HSA"
skip = [
    "build",
    "dist",
    ".venv"
]

[tool.ruff]
line-length = 100
# Markdown belongs to mdformat; ruff reads a fenced fragment as a whole file and de-indents it.
extend-exclude = ["*.md"]

# NOTE: Please gradually tighten static code checks and other validations in the future.
# The current exemptions are in place to ensure normal project development.
[tool.ruff.lint]
# DOC102 is in preview; opt into that one rule, not preview behaviour at large.
preview = true
explicit-preview-rules = true
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    # "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # pydocstyle (Google Docstrings)
    # "D",
    # pep8-naming (naming conventions)
    "N",
    # pydoclint: a documented parameter the signature does not have
    "DOC102",
    # flake8-tidy-imports: banned APIs.
    "TID251",
    # Every import is absolute (`from tileops.x import y`); no relative imports.
    "TID252",
    # docs/design/layer-boundaries.md §Test: a test does not import from benchmarks/.
    "TID253",
    # A `noqa` that suppresses nothing, or names a rule this config does not select.
    "RUF100",
    # flake8-annotations (type hints) — enable when codebase has sufficient coverage
    # "ANN",
]
ignore = [
    # E741 (ambiguous variable name): single-letter tensor-dimension names
    # (l, I) mirror the math notation in kernel signatures.
    "E741",
    # E501 (line too long): line-length is already capped at 100 by the
    # formatter; long kernel launch expressions may exceed it deliberately.
    "E501",
    # SIM118 (key in dict.keys()): explicit .keys() is kept where it clarifies
    # that only names, not values, are consumed.
    "SIM118",
    # B019 (lru_cache on methods can leak memory): kernel builders are cached
    # by design — the cache holding compiled kernels alive is the point.
    "B019",
    # E902 (I/O error while linting a path): environment noise (broken
    # symlinks, transient files), not a property of the source.
    "E902",
    # N812 (lowercase imported as non-lowercase): the TileLang idiom is
    # `import tilelang.language as T`.
    "N812",
    # N801/N802/N803/N806 (PEP 8 naming): kernel code names classes, functions,
    # arguments, and locals after math symbols and hardware terms (Q, K, V,
    # block_M), which are case-significant.
    "N801",  # Class name should use CapWords convention
    "N802",  # Function name should be lowercase
    "N803",  # Argument name should be lowercase
    "N806",  # Variable in function should be lowercase
]

[tool.ruff.lint.isort]
known-first-party = ["tileops"]

[tool.ruff.lint.flake8-tidy-imports]
# Module level only: TID251 cannot be scoped to tests/ without lifting its bans elsewhere.
banned-module-level-imports = ["benchmarks"]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Resolved through the import graph, so an alias other than the usual `T` is
# caught too.
"tilelang.language.Buffer".msg = "deprecated; use T.Tensor(shape, dtype)"

[tool.ruff.lint.per-file-ignores]
"!tests/**" = ["TID253"]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks/tests"]
python_files = ["test_*.py", "bench_*.py"]
markers = [
    "smoke: fast PR critical-path tests",
    "full: standard correctness coverage",
    "nightly: exhaustive or long-running coverage",
    "packaging(family): wheel-install sanity check; one case per tileops._FAMILIES member, which `family` names",
    "sm90: needs compute capability 9.x; skipped elsewhere, never skipped on an SM90 device",
    "cuda_only: needs a CUDA device whatever the target; deselected when --tileops-device is not cuda",
    "in_tree_kernels: asserts on the in-tree kernels an op built; deselected when --tileops-target is not builtin",
]
