# GPU Profile: NVIDIA H200 (SXM, 141GB HBM3e)
# Source: NVIDIA H200 datasheet (dense, no sparsity)
# Calibration: benchmarks/hardware/ microbenchmarks
#
# Only store measured values here (theoretical, calibration,
# calibration_sustained, calibration_burst, calibration_mixes,
# calibration_operands).
# effective = theoretical × calibration is computed by load_profile().

gpu: NVIDIA H200
compute_capability: 9.0

# From benchmarks/hardware/memory/hbm_bandwidth.py: 2048 MB working set,
# 5 runs x 200 reps, memory clock at its 3201 MHz max. Envelope semantics:
# docs/design/roofline.md §5.1.
hbm:
  theoretical: 4800e9        # bytes/s, spec sheet
  calibration: 0.9380        # = max(calibration_mixes)
  calibration_mixes: {copy: 0.8183, triad: 0.8427, read: 0.9380, write: 0.8926}

cuda_core:
  fp32:
    theoretical: 67.0e12     # FLOPS, spec sheet (non-tensor FMA, 2 FLOP per FMA, 1.98 GHz boost)
    # From benchmarks/hardware/compute/fma_throughput.py, clocks locked
    # (-lgc 1830,1980; the board holds 1830 MHz under saturating FMA).
    # Splits into 0.9261 lane utilisation x 0.9242 clock headroom.
    calibration: 0.8548

# From benchmarks/hardware/compute/gemm_throughput.py (cuBLAS peak); each
# value is the median across repeated runs on one board (run band <= 1.5%).
# calibration_sustained holds the 700 W cap at ~1.2-1.4 GHz; calibration_burst
# is the pre-cap rate, both on random operands. calibration_operands holds each
# operand set's best rate: zero operands draw ~450-540 W and hold ~1.6-1.9 GHz.
# calibration (what `effective` is computed from) is the envelope over all of them.
tensor_core:
  fp16:
    theoretical: 989.5e12    # FLOPS, spec sheet (dense)
    calibration: 0.8024      # = max(calibration_operands)
    calibration_sustained: 0.6527
    calibration_burst: 0.7056
    calibration_operands: {random: 0.7056, zeros: 0.8024}
  bf16:
    theoretical: 989.5e12
    calibration: 0.8432
    calibration_sustained: 0.6775
    calibration_burst: 0.7346
    calibration_operands: {random: 0.7346, zeros: 0.8432}
  tf32:
    theoretical: 494.7e12
    calibration: 0.9260
    calibration_sustained: 0.6958
    calibration_burst: 0.7541
    calibration_operands: {random: 0.7541, zeros: 0.9260}
  fp8:
    theoretical: 1979.0e12
    calibration: 0.8075
    calibration_sustained: 0.6198
    calibration_burst: 0.6839
    calibration_operands: {random: 0.6839, zeros: 0.8075}
