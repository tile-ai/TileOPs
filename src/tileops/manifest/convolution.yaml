# convolution.yaml -- manifest entries for the 'convolution' family.
#
# padding takes a per-axis value or a mode; 'same' pads so the output keeps the input length,
# splitting an odd total the way torch does (the extra element on the right).

Conv1dFwdOp:
  ref_api: "torch.nn.functional.conv1d"
  family: convolution
  status: implemented

  signature:
    forall: {N: Dim, C_in: Dim, L_in: Dim, C_out: Dim, kW: Dim, T: "DType[float16 | bfloat16]"}
    params:
      stride: {type: "int | tuple[int]", default: 1}
      padding: {type: "int | tuple[int] | 'valid' | 'same'", default: 0}
      dilation: {type: "int | tuple[int]", default: 1}
      groups: {type: int, default: 1}
    inputs:
      input: {dtype: T, shape: "[N, C_in, L_in]"}
      weight: {dtype: T, shape: "[C_out, C_in_g, kW]"}
      bias: {dtype: T, shape: "[C_out]", optional: true}
    outputs:
      output: {dtype: T, shape: "[N, C_out, L_out]"}
    let:
      C_in_g: "C_in // groups"
      sW: "per_axis(stride, 0, 1)"
      dW: "per_axis(dilation, 0, 1)"
      pW: "0 if padding == 'valid' or padding == 'same' else per_axis(padding, 0, 1)"
      L_out: "L_in if padding == 'same' else conv.out(L_in, kW, sW, pW, dW)"
    shape_rules:
    - "groups > 0 and C_in % groups == 0 and C_out % groups == 0"
    - "sW > 0 and dW > 0 and pW >= 0 and kW > 0"
    - "padding != 'same' or sW == 1"
    - "L_out > 0"

  # Workloads selected from three dominant Conv1d model families:
  #   Whisper (OpenAI ASR)  — https://huggingface.co/openai/whisper-large-v3
  #     src: transformers/models/whisper/modeling_whisper.py WhisperEncoder (nn.Conv1d)
  #   Wav2Vec2 (Meta ASR)   — https://huggingface.co/facebook/wav2vec2-base
  #     src: transformers/models/wav2vec2/modeling_wav2vec2.py Wav2Vec2NoLayerNormConvLayer (nn.Conv1d)
  #   EnCodec (Meta codec)  — https://huggingface.co/facebook/encodec_24khz
  #     src: transformers/models/encodec/modeling_encodec.py EncodecEncoder (EncodecConv1d → nn.Conv1d)
  # Selection criteria: cover small/large kernel, narrow/wide channels,
  #   short/long sequences, and different pipeline stages (entry vs deep layer).
  workloads:
  # Whisper-large encoder conv1: mel spectrogram → hidden (most common ASR entry point)
  - {N: 1, C_in: 80, L_in: 3000, C_out: 1280, kW: 3, dtype_cases: [{T: float16}, {T: bfloat16}], label: whisper-large-conv1}
  # Wav2Vec2 feature extractor layer1: raw 1s waveform, large kernel + stride downsampling
  - {N: 1, C_in: 1, L_in: 16000, C_out: 512, kW: 10, stride: 5, dtype_cases: [{T: float16}, {T: bfloat16}], label: wav2vec2-layer1}
  # EnCodec SEANet encoder init: raw 1s audio @24kHz, narrow channels
  - {N: 1, C_in: 1, L_in: 24000, C_out: 32, kW: 7, dtype_cases: [{T: float16}, {T: bfloat16}], label: encodec-init}
  # EnCodec SEANet deep block: short sequence, wide channels, large kernel
  - {N: 1, C_in: 128, L_in: 600, C_out: 256, kW: 10, dtype_cases: [{T: float16}, {T: bfloat16}], label: encodec-deep}
  - {N: 1, C_in: 80, L_in: 3000, C_out: 1280, kW: 3, some: [bias], dtype_cases: [{T: float16}, {T: bfloat16}], label: whisper-large-conv1-bias}
  - {N: 1, C_in: 1, L_in: 16000, C_out: 512, kW: 10, stride: 5, some: [bias], dtype_cases: [{T: float16}, {T: bfloat16}], label: wav2vec2-layer1-bias}
  - {N: 1, C_in: 1, L_in: 24000, C_out: 32, kW: 7, some: [bias], dtype_cases: [{T: float16}, {T: bfloat16}], label: encodec-init-bias}
  - {N: 1, C_in: 128, L_in: 600, C_out: 256, kW: 10, some: [bias], dtype_cases: [{T: float16}, {T: bfloat16}], label: encodec-deep-bias}

  roofline:
    flops: "2 * N * C_out * L_out * C_in_g * kW + (N * C_out * L_out if present(bias) else 0)"

Conv2dFwdOp:
  ref_api: "torch.nn.functional.conv2d"
  family: convolution
  status: implemented

  signature:
    forall: {N: Dim, C_in: Dim, H: Dim, W: Dim, C_out: Dim, kH: Dim, kW: Dim, T: "DType[float32 | float16 | bfloat16]"}
    params:
      stride: {type: "int | tuple[int, int]", default: 1}
      padding: {type: "int | tuple[int, int] | 'valid' | 'same'", default: 0}
      dilation: {type: "int | tuple[int, int]", default: 1}
      groups: {type: int, default: 1}
    inputs:
      input: {dtype: T, shape: "[N, C_in, H, W]"}
      weight: {dtype: T, shape: "[C_out, C_in_g, kH, kW]"}
      bias: {dtype: T, shape: "[C_out]", optional: true}
    outputs:
      output: {dtype: T, shape: "[N, C_out, out_H, out_W]"}
    let:
      C_in_g: "C_in // groups"
      sH: "per_axis(stride, 0, 2)"
      sW: "per_axis(stride, 1, 2)"
      dH: "per_axis(dilation, 0, 2)"
      dW: "per_axis(dilation, 1, 2)"
      pH: "0 if padding == 'valid' or padding == 'same' else per_axis(padding, 0, 2)"
      pW: "0 if padding == 'valid' or padding == 'same' else per_axis(padding, 1, 2)"
      out_H: "H if padding == 'same' else conv.out(H, kH, sH, pH, dH)"
      out_W: "W if padding == 'same' else conv.out(W, kW, sW, pW, dW)"
    shape_rules:
    - "groups > 0 and C_in % groups == 0 and C_out % groups == 0"
    - "sH > 0 and sW > 0 and dH > 0 and dW > 0 and pH >= 0 and pW >= 0 and kH > 0 and kW > 0"
    - "padding != 'same' or (sH == 1 and sW == 1)"
    - "out_H > 0 and out_W > 0"

  workloads:
  - {N: 2, C_in: 64, H: 56, W: 56, C_out: 64, kH: 3, kW: 3, stride: [1, 1], padding: [1, 1], dtype_cases: [{T: float16}, {T: bfloat16}], label: resnet-3x3}
  - {N: 1, C_in: 3, H: 112, W: 112, C_out: 64, kH: 3, kW: 3, stride: [2, 2], padding: [1, 1], dtype_cases: [{T: float16}], label: stem-3x3-s2}
  - {N: 1, C_in: 128, H: 56, W: 56, C_out: 256, kH: 3, kW: 3, stride: [2, 2], padding: [1, 1], dtype_cases: [{T: float16}], label: stage-transition-3x3-s2}
  - {N: 1, C_in: 256, H: 112, W: 112, C_out: 512, kH: 3, kW: 3, stride: [1, 1], padding: [1, 1], dtype_cases: [{T: float16}], label: highres-3x3-s1}
  - {N: 1, C_in: 64, H: 56, W: 56, C_out: 128, kH: 5, kW: 5, stride: [1, 1], padding: [2, 2], dtype_cases: [{T: float16}], label: midres-5x5-s1}
  - {N: 1, C_in: 128, H: 56, W: 56, C_out: 256, kH: 5, kW: 5, stride: [2, 2], padding: [2, 2], dtype_cases: [{T: float16}], label: stage-transition-5x5-s2}
  - {N: 1, C_in: 128, H: 28, W: 28, C_out: 128, kH: 3, kW: 3, stride: [2, 2], padding: [1, 1], dtype_cases: [{T: bfloat16}], label: stride2}
  - {N: 2, C_in: 64, H: 56, W: 56, C_out: 256, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtype_cases: [{T: float16}, {T: bfloat16}], label: resnet-1x1}
  - {N: 2, C_in: 128, H: 28, W: 28, C_out: 512, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtype_cases: [{T: float16}], label: bottleneck-expand-1x1}
  - {N: 2, C_in: 512, H: 28, W: 28, C_out: 128, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtype_cases: [{T: float16}], label: bottleneck-reduce-1x1}
  - {N: 1, C_in: 256, H: 14, W: 14, C_out: 1024, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtype_cases: [{T: float16}], label: late-stage-1x1}
  - {N: 1, C_in: 512, H: 7, W: 7, C_out: 2048, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], dtype_cases: [{T: float16}], label: classifier-1x1}
  - {N: 1, C_in: 2048, H: 32, W: 32, C_out: 256, kH: 3, kW: 3, stride: [1, 1], padding: [12, 12], dilation: [12, 12], dtype_cases: [{T: float16}], label: deeplabv3-aspp-3x3-rate12}
  - {N: 1, C_in: 32, H: 56, W: 56, C_out: 32, kH: 3, kW: 3, stride: [1, 1], padding: [1, 1], groups: 32, dtype_cases: [{T: float16}], label: mobilenetv2-depthwise}
  - {N: 1, C_in: 128, H: 28, W: 28, C_out: 256, kH: 3, kW: 3, stride: [1, 1], padding: [1, 1], groups: 32, dtype_cases: [{T: float16}], label: resnext-grouped-3x3}
  - {N: 2, C_in: 64, H: 56, W: 56, C_out: 64, kH: 3, kW: 3, stride: [1, 1], padding: [1, 1], some: [bias], dtype_cases: [{T: float16}, {T: bfloat16}], label: resnet-3x3-bias}
  - {N: 1, C_in: 3, H: 112, W: 112, C_out: 64, kH: 3, kW: 3, stride: [2, 2], padding: [1, 1], some: [bias], dtype_cases: [{T: float16}], label: stem-3x3-s2-bias}
  - {N: 1, C_in: 128, H: 56, W: 56, C_out: 256, kH: 3, kW: 3, stride: [2, 2], padding: [1, 1], some: [bias], dtype_cases: [{T: float16}], label: stage-transition-3x3-s2-bias}
  - {N: 1, C_in: 256, H: 112, W: 112, C_out: 512, kH: 3, kW: 3, stride: [1, 1], padding: [1, 1], some: [bias], dtype_cases: [{T: float16}], label: highres-3x3-s1-bias}
  - {N: 1, C_in: 64, H: 56, W: 56, C_out: 128, kH: 5, kW: 5, stride: [1, 1], padding: [2, 2], some: [bias], dtype_cases: [{T: float16}], label: midres-5x5-s1-bias}
  - {N: 1, C_in: 128, H: 56, W: 56, C_out: 256, kH: 5, kW: 5, stride: [2, 2], padding: [2, 2], some: [bias], dtype_cases: [{T: float16}], label: stage-transition-5x5-s2-bias}
  - {N: 1, C_in: 128, H: 28, W: 28, C_out: 128, kH: 3, kW: 3, stride: [2, 2], padding: [1, 1], some: [bias], dtype_cases: [{T: bfloat16}], label: stride2-bias}
  - {N: 2, C_in: 64, H: 56, W: 56, C_out: 256, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], some: [bias], dtype_cases: [{T: float16}, {T: bfloat16}], label: resnet-1x1-bias}
  - {N: 2, C_in: 128, H: 28, W: 28, C_out: 512, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], some: [bias], dtype_cases: [{T: float16}], label: bottleneck-expand-1x1-bias}
  - {N: 2, C_in: 512, H: 28, W: 28, C_out: 128, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], some: [bias], dtype_cases: [{T: float16}], label: bottleneck-reduce-1x1-bias}
  - {N: 1, C_in: 256, H: 14, W: 14, C_out: 1024, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], some: [bias], dtype_cases: [{T: float16}], label: late-stage-1x1-bias}
  - {N: 1, C_in: 512, H: 7, W: 7, C_out: 2048, kH: 1, kW: 1, stride: [1, 1], padding: [0, 0], some: [bias], dtype_cases: [{T: float16}], label: classifier-1x1-bias}

  roofline:
    flops: "2 * N * C_out * out_H * out_W * C_in_g * kH * kW + (N * C_out * out_H * out_W if present(bias) else 0)"

Conv3dFwdOp:
  ref_api: "torch.nn.functional.conv3d"
  family: convolution
  status: implemented

  signature:
    forall: {N: Dim, C_in: Dim, D: Dim, H: Dim, W: Dim, C_out: Dim, kD: Dim, kH: Dim, kW: Dim, T: "DType[float32 | float16 | bfloat16]"}
    params:
      stride: {type: "int | tuple[int, int, int]", default: 1}
      padding: {type: "int | tuple[int, int, int] | 'valid' | 'same'", default: 0}
      dilation: {type: "int | tuple[int, int, int]", default: 1}
      groups: {type: int, default: 1}
    inputs:
      input: {dtype: T, shape: "[N, C_in, D, H, W]"}
      weight: {dtype: T, shape: "[C_out, C_in_g, kD, kH, kW]"}
      bias: {dtype: T, shape: "[C_out]", optional: true}
    outputs:
      output: {dtype: T, shape: "[N, C_out, out_D, out_H, out_W]"}
    let:
      C_in_g: "C_in // groups"
      sD: "per_axis(stride, 0, 3)"
      sH: "per_axis(stride, 1, 3)"
      sW: "per_axis(stride, 2, 3)"
      dD: "per_axis(dilation, 0, 3)"
      dH: "per_axis(dilation, 1, 3)"
      dW: "per_axis(dilation, 2, 3)"
      pD: "0 if padding == 'valid' or padding == 'same' else per_axis(padding, 0, 3)"
      pH: "0 if padding == 'valid' or padding == 'same' else per_axis(padding, 1, 3)"
      pW: "0 if padding == 'valid' or padding == 'same' else per_axis(padding, 2, 3)"
      out_D: "D if padding == 'same' else conv.out(D, kD, sD, pD, dD)"
      out_H: "H if padding == 'same' else conv.out(H, kH, sH, pH, dH)"
      out_W: "W if padding == 'same' else conv.out(W, kW, sW, pW, dW)"
    shape_rules:
    - "groups > 0 and C_in % groups == 0 and C_out % groups == 0"
    - "sD > 0 and sH > 0 and sW > 0 and dD > 0 and dH > 0 and dW > 0"
    - "pD >= 0 and pH >= 0 and pW >= 0 and kD > 0 and kH > 0 and kW > 0"
    - "padding != 'same' or (sD == 1 and sH == 1 and sW == 1)"
    - "out_D > 0 and out_H > 0 and out_W > 0"

  workloads:
  - {N: 1, C_in: 3, D: 16, H: 112, W: 112, C_out: 64, kD: 3, kH: 3, kW: 3, stride: [1, 1, 1], padding: [1, 1, 1], dtype_cases: [{T: float16}], label: r3d-stem-k3-s1}
  - {N: 1, C_in: 64, D: 8, H: 56, W: 56, C_out: 128, kD: 3, kH: 3, kW: 3, stride: [2, 2, 2], padding: [1, 1, 1], dtype_cases: [{T: float16}], label: video-stage-downsample-k3-s2}
  - {N: 1, C_in: 32, D: 32, H: 64, W: 64, C_out: 64, kD: 3, kH: 3, kW: 3, stride: [1, 1, 1], padding: [1, 1, 1], dtype_cases: [{T: bfloat16}], label: unet-encoder-k3-s1}
  - {N: 1, C_in: 256, D: 8, H: 16, W: 16, C_out: 256, kD: 3, kH: 3, kW: 3, stride: [1, 1, 1], padding: [6, 6, 6], dilation: [6, 6, 6], dtype_cases: [{T: float16}], label: 3d-unet-aspp-3x3x3-rate6}
  - {N: 1, C_in: 64, D: 8, H: 28, W: 28, C_out: 128, kD: 3, kH: 3, kW: 3, stride: [1, 1, 1], padding: [1, 1, 1], groups: 32, dtype_cases: [{T: float16}], label: 3d-resnext-grouped-k3}
  - {N: 1, C_in: 3, D: 16, H: 112, W: 112, C_out: 64, kD: 3, kH: 3, kW: 3, stride: [1, 1, 1], padding: [1, 1, 1], some: [bias], dtype_cases: [{T: float16}], label: r3d-stem-k3-s1-bias}
  - {N: 1, C_in: 64, D: 8, H: 56, W: 56, C_out: 128, kD: 3, kH: 3, kW: 3, stride: [2, 2, 2], padding: [1, 1, 1], some: [bias], dtype_cases: [{T: float16}], label: video-stage-downsample-k3-s2-bias}
  - {N: 1, C_in: 32, D: 32, H: 64, W: 64, C_out: 64, kD: 3, kH: 3, kW: 3, stride: [1, 1, 1], padding: [1, 1, 1], some: [bias], dtype_cases: [{T: bfloat16}], label: unet-encoder-k3-s1-bias}

  roofline:
    flops: "2 * N * C_out * out_D * out_H * out_W * C_in_g * kD * kH * kW + (N * C_out * out_D * out_H * out_W if present(bias) else 0)"
