# Narrow quantization helper operators.
#
# These entries describe existing helper surfaces only. They do not claim the
# full INT8/INT4/NF4/FP8 quantization family from the older release plan.

FP8QuantFwdOp:
  family: quantization
  status: implemented

  signature:
    forall: {batch: Dim, seq_len_kv: Dim, kv_group: Dim, index_dim: Dim, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      input_tensor: {dtype: T, shape: "[batch, seq_len_kv, kv_group, index_dim]"}
    outputs:
      scale_tensor: {dtype: float32, shape: "[batch, seq_len_kv, kv_group]"}
      output_tensor: {dtype: float8_e4m3fn, shape: "[batch, seq_len_kv, kv_group, index_dim]"}
    shape_rules:
    - "index_dim > 0"

  workloads:
  - {batch: 1, seq_len_kv: 8192, kv_group: 1, index_dim: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: kv-index-8k-d64}
  - {batch: 1, seq_len_kv: 4096, kv_group: 1, index_dim: 128, dtype_cases: [{T: float32}], label: kv-index-4k-d128}

  roofline:
    flops: "6 * batch * seq_len_kv * kv_group * index_dim + batch * seq_len_kv * kv_group"
