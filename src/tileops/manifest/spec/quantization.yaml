# Quantization and dequantization operators.
#
# INT8 is symmetric in [-127, 127]; scales are float32; rounding is half-to-even
# (torch.round); an all-zero group gets scale 1.0, so dequantization never divides
# by zero. A scale is the dequantization multiplier: x ~= q * scale.

FP8QuantPerTokenGroupFwdOp:
  # Each group of group_size adjacent columns of the last axis is scaled by its absolute
  # maximum, floored at eps, over the float8_e4m3fn maximum. With out_q the codes are written
  # there and q is out_q. dtype None is the platform's fp8, float8_e4m3fn on CUDA. use_ue8m0
  # None resolves, as vLLM resolves it where DeepGEMM's UE8M0 scales are not in use, to
  # float32 scales; tma_aligned_scales is read only with column_major_scales.
  family: quantization
  status: implemented
  ref_api: vllm.model_executor.layers.quantization.utils.fp8_utils.per_token_group_quant_fp8

  signature:
    forall: {S: Shape, K: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      group_size: {type: int}
      eps: {type: float, default: 1.0e-10}
      dtype: {type: "float8_e4m3fn | None", default: null}
      column_major_scales: {type: bool, default: false}
      tma_aligned_scales: {type: bool, default: false}
      use_ue8m0: {type: "bool | None", default: null}
    inputs:
      x: {dtype: T, shape: "[*S, K]"}
      out_q: {type: "Tensor | None", dtype: float8_e4m3fn, shape: "[*S, K]", contiguous: true, default: null, mutated: "present(out_q)"}
    outputs:
      q: {dtype: float8_e4m3fn, shape: "[*S, K]", alias: out_q}
      scale: {dtype: float32, shape: "[*S, K // group_size]"}
    shape_rules:
    - "group_size > 0 and K % group_size == 0"

  workloads:
  - {S: [8192], K: 64, group_size: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: kv-index-flat-8k}
  - {S: [4096], K: 128, group_size: 128, dtype_cases: [{T: float32}], label: kv-index-flat-4k}
  - {S: [3072], K: 128, group_size: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: kv-index-flat-ctx-chunk}
  # DeepSeek-V3 block-FP8 activations: 128-column groups of the 7168-wide hidden state.
  - {S: [4096], K: 7168, group_size: 128, dtype_cases: [{T: bfloat16}], label: dsv3-act-prefill}
  - {S: [2, 64], K: 7168, group_size: 128, some: [out_q], dtype_cases: [{T: bfloat16}], label: dsv3-act-decode-out}

  roofline:
    # Per element: abs, the group-max comparison, the scaling and the clamp; per group: the
    # amax floor and the scale.
    flops: "4 * prod(S) * K + 2 * prod(S) * (K // group_size)"

INT8QuantPerTensorFwdOp:
  family: quantization
  status: implemented
  ref_api: vllm._custom_ops.scaled_int8_quant
  signature:
    forall: {M: Dim, K: Dim, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      x: {dtype: T, shape: "[M, K]"}
    outputs:
      q: {dtype: int8, shape: "[M, K]"}
      # amax(|x|) / 127
      scale: {dtype: float32, shape: "[1]"}
    shape_rules:
    - "M > 0 and K > 0"
  workloads:
  - {M: 4096, K: 4096, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-prefill}
  - {M: 32, K: 4096, dtype_cases: [{T: bfloat16}], label: llama-8b-decode}
  - {M: 8192, K: 5120, dtype_cases: [{T: bfloat16}, {T: float32}], label: qwen3-32b-prefill}
  - {M: 17, K: 2880, dtype_cases: [{T: bfloat16}], label: gpt-oss-20b-decode}
  - {M: 3000, K: 2880, dtype_cases: [{T: bfloat16}], label: gpt-oss-20b-prefill}
  - {M: 1000, K: 4099, dtype_cases: [{T: float16}], label: odd-hidden-prefill}
  roofline:
    # Per element: abs, the max, the scaling, round and clamp; once: the scale and its zero guard.
    flops: "5 * M * K + 2"

INT8QuantPerChannelFwdOp:
  family: quantization
  status: implemented
  ref_api: vllm.model_executor.layers.quantization.utils.int8_utils.per_token_quant_int8
  signature:
    forall: {N: Dim, K: Dim, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      w: {dtype: T, shape: "[N, K]"}
    outputs:
      q: {dtype: int8, shape: "[N, K]"}
      # One per output channel (row): amax(|w[n, :]|) / 127.
      scale: {dtype: float32, shape: "[N]"}
    shape_rules:
    - "K > 0"
  workloads:
  - {N: 14336, K: 4096, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-mlp-up}
  - {N: 8192, K: 28672, dtype_cases: [{T: bfloat16}], label: llama-70b-mlp-down}
  - {N: 5120, K: 8192, dtype_cases: [{T: bfloat16}, {T: float32}], label: qwen3-32b-o-proj}
  - {N: 5760, K: 2880, dtype_cases: [{T: bfloat16}], label: gpt-oss-20b-mlp-up}
  - {N: 3000, K: 4099, dtype_cases: [{T: float16}], label: ragged-k}
  - {N: 17, K: 4099, dtype_cases: [{T: bfloat16}], label: ragged-k-few-rows}
  roofline:
    # Per element: abs, the max, the scaling, round and clamp; per row: the scale and its zero guard.
    flops: "5 * N * K + 2 * N"

INT8QuantPerTokenGroupFwdOp:
  family: quantization
  status: implemented
  ref_api: vllm.model_executor.layers.quantization.utils.int8_utils.per_token_group_quant_int8
  signature:
    forall: {M: Dim, K: Dim, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      x: {dtype: T, shape: "[M, K]"}
    outputs:
      q: {dtype: int8, shape: "[M, K]"}
      # One per 128 contiguous elements along K; the last block of a row may be partial.
      scale: {dtype: float32, shape: "[M, ceil_div(K, 128)]"}
  workloads:
  - {M: 4096, K: 7168, dtype_cases: [{T: float16}, {T: bfloat16}], label: ds-v3-prefill}
  - {M: 64, K: 7168, dtype_cases: [{T: bfloat16}], label: ds-v3-decode}
  - {M: 4096, K: 4096, dtype_cases: [{T: bfloat16}, {T: float32}], label: qwen3-235b-prefill}
  - {M: 17, K: 7168, dtype_cases: [{T: bfloat16}], label: ds-v3-decode-few-tokens}
  - {M: 3000, K: 2880, dtype_cases: [{T: bfloat16}], label: gpt-oss-20b-prefill}
  - {M: 1000, K: 4099, dtype_cases: [{T: float16}], label: ragged-k}
  roofline:
    # Per element: abs, the max, the scaling, round and clamp; per block: the scale and its zero guard.
    flops: "5 * M * K + 2 * M * ceil_div(K, 128)"

INT4QuantPerGroupFwdOp:
  # DeepSpeed QuantizerBuilder().load().quantize(w, N*K/group_size, 4, Asymmetric).
  # Codes are clamp(round((w - (hi+lo)/2) * multiplier), -8, 7), multiplier=16/(hi-lo).
  # Constant groups use multiplier 1; params stores [1/multiplier, (hi+lo)/2].
  family: quantization
  status: implemented
  ref_api: deepspeed.ops.quantizer.quantizer_op.quantize
  signature:
    forall: {N: Dim, K: Dim, T: "DType[float16]"}
    params:
      group_size: {type: int, default: 128}
    inputs:
      w: {dtype: T, shape: "[N, K]"}
    outputs:
      # First code in the high nibble; params rows follow flattened input groups.
      packed_weight: {dtype: int8, shape: "[N, K // 2]"}
      params: {dtype: float32, shape: "[N * K // group_size, 2]"}
    shape_rules:
    - "group_size > 0"
    - "K % 2 == 0 and K % group_size == 0"
  workloads:
  - {N: 14336, K: 4096, dtype_cases: [{T: float16}], label: llama-8b-mlp-up}
  - {N: 4096, K: 4096, group_size: 64, dtype_cases: [{T: float16}], label: llama-8b-q-proj}
  - {N: 8192, K: 28672, dtype_cases: [{T: float16}], label: llama-70b-mlp-down}
  - {N: 5120, K: 8192, dtype_cases: [{T: float16}], label: qwen3-32b-o-proj}
  - {N: 18944, K: 3584, dtype_cases: [{T: float16}], label: qwen2-7b-mlp-up}
  - {N: 3584, K: 18944, dtype_cases: [{T: float16}], label: qwen2-7b-mlp-down}
  - {N: 20480, K: 5120, group_size: 64, dtype_cases: [{T: float16}], label: opt-13b-mlp-up}
  - {N: 14336, K: 4096, group_size: 4096, dtype_cases: [{T: float16}], label: llama-8b-mlp-up-chan}
  roofline:
    flops: "7 * N * K + 6 * (N * K // group_size)"

SmoothQuantFwdOp:
  # q = quantize_per_row(x / smooth): per-channel smoothing, then symmetric INT8 per row.
  family: quantization
  status: implemented
  ref_api: workloads.quantization.quantize.smooth_quant
  signature:
    forall: {M: Dim, K: Dim, T: "DType[float16 | bfloat16]"}
    inputs:
      x: {dtype: T, shape: "[M, K]"}
      smooth: {dtype: float32, shape: "[K]"}
    outputs:
      q: {dtype: int8, shape: "[M, K]"}
      scale: {dtype: float32, shape: "[M]"}
    shape_rules:
    - "K > 0"
  workloads:
  - {M: 4096, K: 4096, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-prefill}
  - {M: 32, K: 4096, dtype_cases: [{T: bfloat16}], label: llama-8b-decode}
  - {M: 4096, K: 8192, dtype_cases: [{T: bfloat16}], label: llama-70b-prefill}
  - {M: 3000, K: 2880, dtype_cases: [{T: bfloat16}], label: gpt-oss-20b-prefill}
  - {M: 1000, K: 4099, dtype_cases: [{T: float16}], label: ragged-k}
  - {M: 17, K: 4099, dtype_cases: [{T: bfloat16}], label: ragged-k-decode}
  roofline:
    # Per element: the smoothing divide, abs, the max, the scaling, round and clamp; per row:
    # the scale and its zero guard.
    flops: "6 * M * K + 2 * M"

INT8DequantPerTensorFwdOp:
  family: quantization
  status: implemented
  ref_api: workloads.quantization.int8_dequant.int8_dequant_per_tensor
  signature:
    forall: {M: Dim, K: Dim}
    params:
      out_dtype: {type: "float16 | bfloat16 | float32"}
    inputs:
      q: {dtype: int8, shape: "[M, K]"}
      scale: {dtype: float32, shape: "[1]"}
    outputs:
      x: {dtype: out_dtype, shape: "[M, K]"}
  workloads:
  - {M: 4096, K: 4096, out_dtype: bfloat16, label: llama-8b-prefill}
  - {M: 32, K: 4096, out_dtype: bfloat16, label: llama-8b-decode}
  - {M: 8192, K: 5120, out_dtype: float16, label: qwen3-32b-prefill}
  - {M: 8192, K: 5120, out_dtype: float32, label: qwen3-32b-prefill}
  - {M: 3000, K: 2880, out_dtype: bfloat16, label: gpt-oss-prefill}
  - {M: 1000, K: 4099, out_dtype: float32, label: ragged-k}
  - {M: 17, K: 4099, out_dtype: float16, label: ragged-k-few-rows}
  roofline:
    # One multiply per element, in float32; the cast is not counted.
    flops: "M * K"

INT8DequantPerChannelFwdOp:
  family: quantization
  status: implemented
  ref_api: workloads.quantization.int8_dequant.int8_dequant_per_channel
  signature:
    forall: {M: Dim, K: Dim}
    params:
      out_dtype: {type: "float16 | bfloat16 | float32"}
    inputs:
      q: {dtype: int8, shape: "[M, K]"}
