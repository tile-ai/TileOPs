# Rotary position embedding (RoPE) operators, exported by the `rope` module.

RopeFwdOp:
  # `neox` rotates the two halves of a head against each other, `interleaved` rotates each
  # adjacent pair. The frequency table is the same, so only the pairing differs.
  family: rope
  status: implemented

  signature:
    types:
      RopeX:
        params: {input_layout: "'1d' | '2d'", B: Dim, S: Dim, H: Dim, D: Dim}
        match: input_layout
        cases:
        - {when: 1d, is: "[S, D]"}
        - {when: 2d, is: "[B, S, H, D]"}
    forall: {B: Dim, S: Dim, H: Dim, D: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      rope_layout: {type: "'neox' | 'interleaved'", default: neox}
      input_layout: {type: "'1d' | '2d'", default: 1d}
      base: {type: float, default: 10000.0}
    inputs:
      x: {dtype: T, shape: "RopeX[input_layout, B, S, H, D]"}
    outputs:
      output: {dtype: T, shape: "RopeX[input_layout, B, S, H, D]"}
    shape_rules:
    - "D > 0 and D % 2 == 0"
    - "base > 0"

  workloads:
  - {rope_layout: neox, input_layout: 1d, S: 2048, D: 64, dtype_cases: [{T: float16}, {T: float32}], label: neox-1d-2k}
  - {rope_layout: neox, input_layout: 1d, S: 4096, D: 128, dtype_cases: [{T: bfloat16}], label: neox-1d-4k}
  - {rope_layout: neox, input_layout: 2d, B: 2, S: 2048, H: 32, D: 128, dtype_cases: [{T: float16}], label: neox-2d-2k}
  - {rope_layout: interleaved, input_layout: 1d, S: 2048, D: 64, dtype_cases: [{T: float16}], label: interleaved-1d-2k}
  - {rope_layout: interleaved, input_layout: 2d, B: 2, S: 2048, H: 32, D: 128, dtype_cases: [{T: bfloat16}], label: interleaved-2d-2k}
  - {rope_layout: interleaved, input_layout: 1d, S: 5120, D: 128, dtype_cases: [{T: float32}], label: interleaved-1d-5k}

  roofline:
    # Two multiplies and one add per rotated element; the cached cos/sin tables are op state.
    flops: "3 * (B * S * H * D if input_layout == '2d' else S * D)"

RopeLlama31FwdOp:
  family: rope
  status: implemented

  signature:
    types:
      RopeX:
        params: {input_layout: "'1d' | '2d'", B: Dim, S: Dim, H: Dim, D: Dim}
        match: input_layout
        cases:
        - {when: 1d, is: "[S, D]"}
        - {when: 2d, is: "[B, S, H, D]"}
    forall: {B: Dim, S: Dim, H: Dim, D: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      input_layout: {type: "'1d' | '2d'", default: 1d}
      base: {type: float, default: 10000.0}
      scale_factor: {type: float, default: 8.0}
      low_freq_factor: {type: float, default: 1.0}
      high_freq_factor: {type: float, default: 4.0}
      original_max_position: {type: int, default: 8192}
    inputs:
      x: {dtype: T, shape: "RopeX[input_layout, B, S, H, D]"}
    outputs:
      output: {dtype: T, shape: "RopeX[input_layout, B, S, H, D]"}
    shape_rules:
    - "D > 0 and D % 2 == 0"
    - "base > 0"
    # The frequency table divides by each factor and, in the smoothing band, by their difference.
    - "all(-inf <= f <= inf and f != 0 for f in (scale_factor, low_freq_factor, high_freq_factor))"
    - "low_freq_factor != high_freq_factor"

  workloads:
  - {input_layout: 1d, S: 8192, D: 128, dtype_cases: [{T: bfloat16}], label: 1d-8k}
  - {input_layout: 2d, B: 1, S: 8192, H: 32, D: 128, dtype_cases: [{T: float16}], label: 2d-8k}
  - {input_layout: 1d, S: 5120, D: 128, dtype_cases: [{T: float32}], label: 1d-5k}

  roofline:
    # Two multiplies and one add per rotated element; the cached cos/sin tables are op state.
    flops: "3 * (B * S * H * D if input_layout == '2d' else S * D)"

RopeYarnFwdOp:
  family: rope
  status: implemented

  signature:
    types:
      RopeX:
        params: {input_layout: "'1d' | '2d'", B: Dim, S: Dim, H: Dim, D: Dim}
        match: input_layout
        cases:
        - {when: 1d, is: "[S, D]"}
        - {when: 2d, is: "[B, S, H, D]"}
    forall: {B: Dim, S: Dim, H: Dim, D: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      input_layout: {type: "'1d' | '2d'", default: 1d}
      base: {type: float, default: 10000.0}
      scale: {type: float, default: 16.0}
      original_max_position: {type: int, default: 4096}
      beta_fast: {type: float, default: 32.0}
      beta_slow: {type: float, default: 1.0}
      attn_factor: {type: float, default: 1.0}
    inputs:
      x: {dtype: T, shape: "RopeX[input_layout, B, S, H, D]"}
    outputs:
      output: {dtype: T, shape: "RopeX[input_layout, B, S, H, D]"}
    shape_rules:
    - "D > 0 and D % 2 == 0"
    # The correction range divides by log(base) and takes log(original_max_position / beta).
    - "base > 0 and base != 1 and scale > 0"
    - "original_max_position > 0 and 0 < beta_fast < inf and 0 < beta_slow < inf"

  workloads:
  - {input_layout: 1d, S: 8192, D: 128, dtype_cases: [{T: bfloat16}], label: 1d-8k}
  - {input_layout: 2d, B: 1, S: 8192, H: 32, D: 128, dtype_cases: [{T: float16}], label: 2d-8k}
  - {input_layout: 1d, S: 5120, D: 128, dtype_cases: [{T: float32}], label: 1d-5k}

  roofline:
    # Two multiplies and one add per rotated element; the cached cos/sin tables are op state.
    flops: "3 * (B * S * H * D if input_layout == '2d' else S * D)"

RopeLongRopeFwdOp:
  family: rope
  status: implemented

  signature:
    types:
      RopeX:
        params: {input_layout: "'1d' | '2d'", B: Dim, S: Dim, H: Dim, D: Dim}
        match: input_layout
        cases:
        - {when: 1d, is: "[S, D]"}
        - {when: 2d, is: "[B, S, H, D]"}
    forall: {B: Dim, S: Dim, H: Dim, D: Dim, T: "DType[float16 | bfloat16 | float32]", R: "DType[float32 | float16 | bfloat16]"}
    params:
      input_layout: {type: "'1d' | '2d'", default: 1d}
      base: {type: float, default: 10000.0}
      rescale_factors: {dtype: R, shape: "[D // 2]", optional: true}
      max_position_embeddings: {type: int, default: 4096}
      original_max_position_embeddings: {type: int, default: 4096}
    inputs:
      x: {dtype: T, shape: "RopeX[input_layout, B, S, H, D]"}
    outputs:
      output: {dtype: T, shape: "RopeX[input_layout, B, S, H, D]"}
    shape_rules:
    - "D > 0 and D % 2 == 0"
    - "base > 0"
    # An extended context scales the amplitude by log(scale) / log(original_max_position_embeddings).
    - "max_position_embeddings > 0 and original_max_position_embeddings > 0"
    - "max_position_embeddings <= original_max_position_embeddings or original_max_position_embeddings > 1"

  workloads:
  - {input_layout: 1d, S: 8192, D: 128, dtype_cases: [{T: bfloat16}], label: 1d-8k}
  - {input_layout: 2d, B: 1, S: 8192, H: 32, D: 128, dtype_cases: [{T: float16}], label: 2d-8k}
  - {input_layout: 1d, S: 5120, D: 128, dtype_cases: [{T: float32}], label: 1d-5k}
  - {input_layout: 1d, S: 8192, D: 128, some: [rescale_factors], dtype_cases: [{T: bfloat16, R: float32}, {T: bfloat16, R: float16}, {T: bfloat16, R: bfloat16}], label: 1d-8k-rescaled}

  roofline:
    # Two multiplies and one add per rotated element; the cached cos/sin tables are op state.
    flops: "3 * (B * S * H * D if input_layout == '2d' else S * D)"

RopeNeoxPositionIdsFwdOp:
  # Packed [tokens, heads, head_dim] input with one position per token; the first
  # `rotary_dim` columns rotate and the rest are copied.
  family: rope
  status: implemented

  signature:
    forall: {N: Dim, H: Dim, D: Dim, T: "DType[float16 | bfloat16 | float32]", P: "DType[int32 | int64]", seq_lens: "Seq[Int]"}
    params:
      max_position: {type: int}
      base: {type: float, default: 10000.0}
      rotary_dim: {type: "int | None", default: null}
    inputs:
      x: {dtype: T, shape: "[N, H, D]"}
      position_ids: {dtype: P, shape: "[N]", values: "packed_positions(seq_lens)", requires: ["in_range(0, max_position)"]}
    outputs:
      output: {dtype: T, shape: "[N, H, D]"}
    shape_rules:
    - "0 < max_position <= 2147483648"
    - "rotary_dim.value > 0 and rotary_dim.value % 2 == 0 and rotary_dim.value <= D if present(rotary_dim) else D > 0 and D % 2 == 0"
    - "base > 0"

  workloads:
  - {seq_lens: [2048], H: 32, D: 128, max_position: 4096, dtype_cases: [{T: float16, P: int32}], label: prefill-2k}
  - {seq_lens: [4096], H: 32, D: 128, max_position: 8192, dtype_cases: [{T: bfloat16, P: int32}], label: prefill-4k}
  - {seq_lens: [1000, 3000, 1120], H: 32, D: 128, max_position: 4096, dtype_cases: [{T: float32, P: int64}], label: prefill-varlen}

  roofline:
    # Two multiplies and one add per rotated element; the columns past rotary_dim are copied.
    flops: "3 * N * H * (rotary_dim.value if present(rotary_dim) else D)"
