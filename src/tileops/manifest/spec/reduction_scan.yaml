# scan.yaml -- the cumulative scans, which the `reduction` module exports.

CumsumFwdOp:
  ref_api: torch.cumsum
  family: reduction
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      dim: {type: int, default: -1}
    inputs:
      x: {dtype: T, shape: "[*S]"}
    outputs:
      y: {dtype: T, shape: "[*S]"}
    shape_rules:
    - "len(S) > 0 and valid_axes(dim, len(S))"

  workloads:
  # Hidden state cumulative sum (Llama-3.1-8B)
  - {S: [2048, 4096], dtype_cases: [{T: float16}, {T: bfloat16}], label: hidden-state-scan}
  # Long sequence cumulative sum
  - {S: [64, 32768], dtype_cases: [{T: bfloat16}], label: long-seq-scan}
  # Llama-2-13B hidden size, a scan length that is not a power of two
  - {S: [4096, 5120], dtype_cases: [{T: float32}], label: llama-13b-hidden-scan}

  roofline:
    flops: "prod(S)"

CumprodFwdOp:
  ref_api: torch.cumprod
  family: reduction
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      dim: {type: int, default: -1}
    inputs:
      x: {dtype: T, shape: "[*S]"}
    outputs:
      y: {dtype: T, shape: "[*S]"}
    shape_rules:
    - "len(S) > 0 and valid_axes(dim, len(S))"

  workloads:
  # Hidden state cumulative product (Llama-3.1-8B)
  - {S: [2048, 4096], dtype_cases: [{T: float16}, {T: bfloat16}], label: hidden-state-scan}
  # Long sequence cumulative product
  - {S: [64, 32768], dtype_cases: [{T: bfloat16}], label: long-seq-scan}
  # Llama-2-13B hidden size, a scan length that is not a power of two
  - {S: [4096, 5120], dtype_cases: [{T: float32}], label: llama-13b-hidden-scan}

  roofline:
    flops: "prod(S)"
