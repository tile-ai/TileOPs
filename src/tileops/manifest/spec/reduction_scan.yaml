# The cumulative scans, which the `reduction` module exports.

CumsumFwdOp:
  ref_api: flag_gems.ops.cumsum
  family: reduction
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      dim: {type: int}
      dtype: {type: "float16 | bfloat16 | float32 | None", default: null, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: "coalesce_dtype(dtype, T)", shape: "[*S]"}
    shape_rules:
    - "len(S) > 0 and valid_axes(dim, len(S))"

  workloads:
  # Hidden state cumulative sum (Llama-3.1-8B)
  - {S: [2048, 4096], dim: -1, dtype_cases: [{T: float16}, {T: bfloat16}], label: hidden-state}
  - {S: [2048, 4096], dim: -1, dtype: float32, dtype_cases: [{T: bfloat16}], label: hidden-state-f32}
  # Long sequence cumulative sum
  - {S: [64, 32768], dim: -1, dtype_cases: [{T: bfloat16}], label: long-seq}
  # Llama-2-13B hidden size, a scan length that is not a power of two
  - {S: [4096, 5120], dim: -1, dtype_cases: [{T: float32}], label: llama-13b-hidden}
  # A few 64K-token sequences, scanned along the sequence
  - {S: [8, 65536], dim: -1, dtype_cases: [{T: float32}], label: few-long-seq}

  roofline:
    flops: "prod(S)"

CumprodFwdOp:
  ref_api: torch.cumprod
  family: reduction
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      dim: {type: int}
      dtype: {type: "float16 | bfloat16 | float32 | None", default: null, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: "coalesce_dtype(dtype, T)", shape: "[*S]"}
    shape_rules:
    - "len(S) > 0 and valid_axes(dim, len(S))"

  workloads:
  # Hidden state cumulative product (Llama-3.1-8B)
  - {S: [2048, 4096], dim: -1, dtype_cases: [{T: float16}, {T: bfloat16}], label: hidden-state}
  - {S: [2048, 4096], dim: -1, dtype: float32, dtype_cases: [{T: bfloat16}], label: hidden-state-f32}
  # Long sequence cumulative product
  - {S: [64, 32768], dim: -1, dtype_cases: [{T: bfloat16}], label: long-seq}
  # Llama-2-13B hidden size, a scan length that is not a power of two
  - {S: [4096, 5120], dim: -1, dtype_cases: [{T: float32}], label: llama-13b-hidden}

  roofline:
    flops: "prod(S)"
