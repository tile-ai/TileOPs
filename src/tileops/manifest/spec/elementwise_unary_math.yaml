# elementwise_unary_math.yaml -- manifest entries for unary elementwise ops.
#
# Single-input single-output elementwise ops: arithmetic (abs, neg, reciprocal,
# sign), exponential/log (exp, log, sqrt, rsqrt, log1p, expm1), trigonometric
# (sin, cos), rounding (floor, ceil, round, trunc), error functions (erf),
# saturating activations whose primary character is a smooth math function
# (sigmoid, tanh), bitwise/logical not, predicate checks (isnan, isinf,
# isfinite), and stochastic masking (dropout). Source of truth for op
# interfaces in this family. Loaded and merged with other family files by
# tileops.manifest at runtime. See docs/design/manifest.md for the full schema.

ExpFwdOp:
  ref_api: "torch.exp"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: T, shape: "[*S]"}

  workloads:
  - {S: [4096, 4096], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "elementwise-16M"}
  - {S: [16384, 16384], dtype_cases: [{T: float16}, {T: bfloat16}], label: "elementwise-256M"}

  roofline:
    flops: "prod(S)"

