DropoutFwdOp:
  ref_api: "torch.nn.functional.dropout"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      p: {type: float, default: 0.5}
      training: {type: bool, default: true}
      inplace: {type: bool, default: false, kw_only: true}
      # Not torch's: None draws each call's mask from torch's default CUDA generator, an
      # integer fixes the mask.
      seed: {type: "int | None", default: null, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}
    shape_rules:
    - "0.0 <= p <= 1.0"
    - "not present(seed) or seed >= 0"

  workloads:
  # Only 0 < p < 1 in training runs the kernel; the other cases return early.
  - {S: [1024, 4096], p: 0.5, training: true, dtype_cases: [{T: float16}, {T: float32}], label: "hidden-4k"}
  - {S: [1024, 10240], p: 0.5, training: true, dtype_cases: [{T: bfloat16}], label: "hidden-10k"}

  roofline:
    # The keep mask and the 1 / (1 - p) scale.
    flops: "2 * prod(S) if training and 0.0 < p < 1.0 else 0"
    bytes: "bytes(output) if training and p == 1.0 else bytes(input) + bytes(output)"
