DropoutFwdOp:
  ref_api: "torch.nn.functional.dropout"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      p: {type: float, default: 0.5}
      seed: {type: int, default: 0}
      training: {type: bool, default: true}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: T, shape: "[*S]"}
    shape_rules:
    - "0.0 <= p <= 1.0"

  workloads:
  # Normal kernel path. p=0, p=1, and training=false are short-circuit paths
  # and should be tested separately from release-facing roofline workloads.
  - {S: [1024, 4096], p: 0.5, training: true, dtype_cases: [{T: float16}, {T: float32}], label: "tokens-1k-hidden-4k"}
  - {S: [1024, 10240], p: 0.5, training: true, dtype_cases: [{T: bfloat16}], label: "tokens-1k-hidden-10k"}

  roofline:
    flops: "prod(S) if training and 0.0 < p < 1.0 else 0"
    bytes: "bytes(output) if training and p == 1.0 else bytes(input) + bytes(output)"
