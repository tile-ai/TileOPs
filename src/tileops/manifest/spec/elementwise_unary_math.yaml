RoundFwdOp:
  ref_api: "torch.round"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[uint8 | int8 | int16 | int32 | int64 | float16 | bfloat16 | float32]"}
    params:
      decimals: {type: int, default: 0, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: T, shape: "[*S]"}
    shape_rules:
    # torch.round rounds an integral input only to zero decimals.
    - "decimals == 0 or category(T) == 'float'"

  workloads:
  - {S: [4096, 4096], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "elementwise-16M"}
