ReciprocalFwdOp:
  ref_api: "torch.reciprocal"
  family: elementwise
  status: implemented

  signature:
    # Integral inputs promote to float32 (matches torch.reciprocal); float
    # inputs preserve their dtype.
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32 | int8 | int16 | int32 | int64 | uint8]"}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: "promote_int_to_float(T)", shape: "[*S]"}

  workloads:
  - {S: [4096, 4096], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "elementwise-16M"}
  - {S: [16384, 16384], dtype_cases: [{T: float16}, {T: bfloat16}], label: "elementwise-256M"}

