    # The other scale granularities and output dtype: a static per-tensor activation scale with
    # per-channel weights, per-token activations with one weight scale, and a float16 output.
    - {M: 64, N: 6144, K: 4096, SA: [1, 1], SB: [1, 6144], label: llama3-8b-qkv-static-a}
    - {M: 64, N: 6144, K: 4096, SA: [64, 1], SB: [1, 1], label: llama3-8b-qkv-tensor-w}
    - {M: 64, N: 4096, K: 14336, SA: [64, 1], SB: [1, 4096], out_dtype: float16, label: llama3-8b-down-b64}

GemmW4A8FwdOp:
  # The weight (n, k) is q[n, k] * weight_group_scale[n, k // group_size], q its INT4 value,
  # rounded to float8_e4m3fn (nearest even) before the contraction with activation[m, k];
  # the contraction is then scaled by activation_scale[m] and weight_channel_scale[n].
  # The packing order is the implementation's, held between its `repack` and its GEMM,
  # so it is not in the signature.
  family: gemm
  status: implemented
  ref_api: workloads.gemm.gemm_w4a8_reference

  signature:
    forall: {M: Dim, N: Dim, K: Dim}
    params:
      group_size: {type: int, default: 128}
    inputs:
      activation: {dtype: float8_e4m3fn, shape: "[M, K]"}
      # Two INT4 weights per byte, each signed two's complement in [-8, 7] with no zero
      # point, in the order this op's `repack` produces.
      packed_weight: {dtype: uint8, shape: "[N, K // 2]"}
      weight_group_scale: {dtype: float8_e4m3fn, shape: "[N, K // group_size]"}
      weight_channel_scale: {dtype: float32, shape: "[N]"}
      activation_scale: {dtype: float32, shape: "[M]"}
    outputs:
      output: {dtype: bfloat16, shape: "[M, N]"}
    shape_rules:
    - "M > 0 and N > 0 and K > 0"
    - "group_size > 0"
    # The `repack` order covers K in whole 128-element blocks, and the groups tile K.
    - "K % 128 == 0 and K % group_size == 0"
    # The `repack` order covers N in whole 16-row units.
    - "N % 16 == 0"

  workloads:
  # DeepSeek-R1: hidden 7168, MLP intermediate 18432. Both directions, since the down
  # projection contracts over the intermediate axis and the up projection over the hidden.
  - {M: 1, N: 7168, K: 18432, label: ds-r1-down-b1}
  - {M: 64, N: 7168, K: 18432, label: ds-r1-down-b64}
  - {M: 4096, N: 7168, K: 18432, label: ds-r1-down-4k}
  - {M: 1, N: 18432, K: 7168, label: ds-r1-up-b1}
  - {M: 64, N: 18432, K: 7168, label: ds-r1-up-b64}
  - {M: 4096, N: 18432, K: 7168, label: ds-r1-up-4k}
  # Llama-3 70B: hidden 8192, MLP intermediate 28672.
  - {M: 1, N: 8192, K: 28672, label: llama-70b-down-b1}
  - {M: 64, N: 8192, K: 28672, label: llama-70b-down-b64}
  - {M: 4096, N: 8192, K: 28672, label: llama-70b-down-4k}
  - {M: 1, N: 28672, K: 8192, label: llama-70b-up-b1}
  - {M: 64, N: 28672, K: 8192, label: llama-70b-up-b64}
  - {M: 4096, N: 28672, K: 8192, label: llama-70b-up-4k}
  # The token axis at the DeepSeek-R1 down shape, from batched decode to prefill.
  - {M: 2, N: 7168, K: 18432, label: ds-r1-down-b2}
  - {M: 8, N: 7168, K: 18432, label: ds-r1-down-b8}
  - {M: 16, N: 7168, K: 18432, label: ds-r1-down-b16}
  - {M: 32, N: 7168, K: 18432, label: ds-r1-down-b32}
  - {M: 96, N: 7168, K: 18432, label: ds-r1-down-b96}
  - {M: 128, N: 7168, K: 18432, label: ds-r1-down-b128}
  - {M: 512, N: 7168, K: 18432, label: ds-r1-down-b512}
  - {M: 1024, N: 7168, K: 18432, label: ds-r1-down-b1024}
  # Eight-way tensor-parallel shards: an eighth of N shrinks the grid, an eighth of K the K loop.
  - {M: 1, N: 2304, K: 7168, label: ds-r1-up-tp8-b1}
  - {M: 4096, N: 2304, K: 7168, label: ds-r1-up-tp8-4k}
