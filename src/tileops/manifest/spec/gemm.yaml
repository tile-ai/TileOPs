  - {M: 1, N: 3584, K: 8192, label: llama-70b-up-tp8-b1}
  - {M: 1, N: 8192, K: 3584, label: llama-70b-down-tp8-b1}

  # Model up/down projection pairs at the decode/prefill boundary and batched TP8 decode.
  - {M: 33, N: 7168, K: 18432, label: ds-r1-down-b33}
  - {M: 48, N: 7168, K: 18432, label: ds-r1-down-b48}
  - {M: 32, N: 18432, K: 7168, label: ds-r1-up-b32}
