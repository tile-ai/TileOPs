# reduction.yaml -- manifest entries for the reduction family (docs/design/manifest.md).

SoftmaxFwdOp:
  ref_api: torch.nn.functional.softmax
  family: reduction
  status: implemented
  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      dim: {type: "int | None", default: null}
      dtype: {type: "float16 | bfloat16 | float32 | None", default: null, kw_only: true}
    inputs:
      x: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: "coalesce_dtype(dtype, T)", shape: "[*S]"}
    shape_rules:
    - "valid_axes(dim, len(S))"
  workloads:
  - {S: [32, 32, 4096], dim: -1, dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: attn-weights-4k}
  - {S: [32, 32, 32768], dim: -1, dtype_cases: [{T: bfloat16}], label: attn-weights-32k}
  - {S: [4, 102400], dim: -1, dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: lm-head-logits}
  - {S: [4, 128256], dim: -1, dtype: float32, dtype_cases: [{T: bfloat16}], label: llama3-lm-head-logits}
  roofline:
    flops: "5 * prod(S)"

