# ---------------------------------------------------------------------------
# attention — decode (single-query against KV cache)
# ---------------------------------------------------------------------------

MHADecodePagedWithKVCacheFwdOp:
  family: attention
  status: implemented
  ref_api: flash_attn_interface.flash_attn_with_kvcache
  signature:
    forall: {B: Dim, S_q: Dim, H: Dim, D: Dim, N_kv: Dim, W: Dim, T: "DType[float16 | bfloat16]", kv_lens: "Seq[Int]"}
    params:
      page_size: {type: int}
      is_causal: {type: bool, default: false}
    inputs:
      q: {dtype: T, shape: "[B, S_q, H, D]"}
      # One page pool shared by every request.
      k: {dtype: T, shape: "[N_kv, H, D]"}
      v: {dtype: T, shape: "[N_kv, H, D]"}
      real_seqlen_kv: {dtype: int32, shape: "[B]", values: "as_tensor(kv_lens)", requires: ["in_range(0, W * page_size + 1)"]}
      block_table: {dtype: int32, shape: "[B, W]", values: "paged_block_table(B, W, NP)", requires: ["in_range(0, NP)"]}
    outputs:
      o: {dtype: T, shape: "[B, S_q, H, D]"}
    let:
      NP: "N_kv // page_size"
    shape_rules:
    - "page_size > 0 and N_kv % page_size == 0"
    # A key tile never straddles a page; the narrowest tile is 16 rows.
    - "page_size % 16 == 0"
  workloads:
  - {S_q: 1, H: 16, D: 128, N_kv: 512, W: 4, kv_lens: [512], page_size: 128, dtype_cases: [{T: float16}], label: serving-p128}
