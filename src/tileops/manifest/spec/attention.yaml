  - {S_q: 1, H: 8, D: 64, N_kv: 512, W: 2, kv_lens: [512], page_size: 256, dtype_cases: [{T: float16}], label: serving-kv512}
  - {S_q: 4, H: 8, D: 64, N_kv: 1024, W: 4, kv_lens: "repeat(1000, 2)", page_size: 256, is_causal: true, dtype_cases: [{T: float16}], label: speculative-decode}
  - {S_q: 1, H: 32, D: 64, N_kv: 2048, W: 16, kv_lens: [2048], page_size: 128, dtype_cases: [{T: float16}], label: opt-1.3b-b1}
  - {S_q: 1, H: 32, D: 64, N_kv: 32768, W: 16, kv_lens: "repeat(2048, 16)", page_size: 128, dtype_cases: [{T: float16}], label: opt-1.3b-b16}
