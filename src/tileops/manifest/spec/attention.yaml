# attention.yaml -- manifest entries for the 'attention' family.
#
# Index names shared across this family:
#   B  batch         S, S_q, S_kv  sequence lengths    H, H_kv  query and KV heads
#   D  head dim      T_q, T_kv, T_k  packed token totals  N_kv  KV pool rows
#   W  pages per request            T  element dtype
# Causal attention over rectangular calls is bottom-right aligned: query i sits at
# position i + S_kv - S_q.

GQADenseFwdOp:
  family: attention
  status: implemented
  ref_api: flash_attn_interface.flash_attn_func
  signature:
    forall: {B: Dim, S_q: Dim, S_kv: Dim, H: Dim, H_kv: Dim, D: Dim, P_pad: Dim, T: "DType[float16 | bfloat16 | float8_e4m3fn]"}
    params:
      is_causal: {type: bool, default: true}
      window_size_left: {type: int, default: -1}
      window_size_right: {type: int, default: -1}
      sm_scale: {type: "float | None", default: null}
      softcap: {type: "float | None", default: null}
      pos_encoding_mode: {type: "'none' | 'rope'", default: none}
      rotary_dim: {type: "int | None", default: null}
      rope_layout: {type: "'neox' | 'interleaved'", default: neox}
      out_dtype: {type: "float16 | bfloat16 | None", default: null}
    inputs:
      q: {dtype: T, shape: "[B, S_q, H, D]"}
      k: {dtype: T, shape: "[B, S_kv, H_kv, D]"}
      v: {dtype: T, shape: "[B, S_kv, H_kv, D]"}
      # FP8 dequantization scales, one per batch entry and KV head.
      q_scale: {dtype: float32, shape: "[B, H_kv]", optional: true}
      k_scale: {dtype: float32, shape: "[B, H_kv]", optional: "present(q_scale)"}
      v_scale: {dtype: float32, shape: "[B, H_kv]", optional: "present(q_scale)"}
      # RoPE tables indexed by KV position and rotated pair.
      rope_cos: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[S_kv + P_pad, R // 2]", optional: "pos_encoding_mode == 'rope'"}
      rope_sin: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[S_kv + P_pad, R // 2]", optional: "pos_encoding_mode == 'rope'"}
    outputs:
      o: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[B, S_q, H, D]"}
    let:
      R: "rotary_dim.value if present(rotary_dim) else D"
    shape_rules:
    - "H_kv > 0 and H % H_kv == 0"
    - "window_size_left >= -1 and window_size_right >= -1"
    - "not is_causal or S_q <= S_kv"
    - "pos_encoding_mode != 'rope' or S_q <= S_kv"
    # FP8 input has no FP8 output: it names a 16-bit out_dtype and passes the scales.
    - "(T == 'float8_e4m3fn') == present(q_scale)"
    - "present(out_dtype) if T == 'float8_e4m3fn' else (not present(out_dtype) or out_dtype.value == T)"
    - "pos_encoding_mode == 'rope' or not present(rotary_dim)"
    - "not present(rotary_dim) or (rotary_dim.value > 0 and rotary_dim.value % 2 == 0 and rotary_dim.value <= D)"
    - "not present(sm_scale) or -inf < sm_scale.value < inf"
  workloads:
  - {B: 32, S_q: 1, S_kv: 4096, H: 32, H_kv: 8, D: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-4k}
  - {B: 8, S_q: 1, S_kv: 32768, H: 32, H_kv: 8, D: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-32k}
  - {B: 16, S_q: 1, S_kv: 4096, H: 64, H_kv: 8, D: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-4k}
  - {B: 4, S_q: 1, S_kv: 32768, H: 64, H_kv: 8, D: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-32k}
  - {B: 32, S_q: 1, S_kv: 4096, H: 32, H_kv: 8, D: 128, softcap: 50.0, dtype_cases: [{T: float16}], label: llama-8b-softcap}
  - {B: 1, S_q: 1, S_kv: 1024, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: qwen3-30b-1k}
  - {B: 1, S_q: 1, S_kv: 4096, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: qwen3-30b-4k}
  - {B: 1, S_q: 1, S_kv: 8192, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: qwen3-30b-8k}
  - {B: 1, S_q: 1, S_kv: 16384, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: qwen3-30b-16k}
  - {B: 1, S_q: 1, S_kv: 32768, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: qwen3-30b-32k}
  - {B: 1, S_q: 1, S_kv: 65536, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: qwen3-30b-64k}
  - {B: 1, S_q: 1, S_kv: 131072, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: qwen3-30b-128k}
  - {B: 1, S_q: 1, S_kv: 262144, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: qwen3-30b-256k}
  - {B: 32, S_q: 1, S_kv: 2048, H: 71, H_kv: 1, D: 64, dtype_cases: [{T: bfloat16}], label: falcon-7b-2k}
  - {B: 16, S_q: 1, S_kv: 8192, H: 48, H_kv: 1, D: 128, dtype_cases: [{T: float16}], label: starcoder-8k}
  - {B: 16, S_q: 1, S_kv: 8192, H: 22, H_kv: 1, D: 128, dtype_cases: [{T: bfloat16}], label: starcoderbase-3b-8k}
  - {B: 1, S_q: 256, S_kv: 1792, H: 8, H_kv: 2, D: 128, pos_encoding_mode: rope, rotary_dim: 64, P_pad: 0, dtype_cases: [{T: float16}, {T: bfloat16}], label: prefill-rope}
  - {B: 1, S_q: 256, S_kv: 1792, H: 8, H_kv: 2, D: 128, out_dtype: float16, some: [q_scale], dtype_cases: [{T: float8_e4m3fn}], label: prefill-scaled}
  - {B: 1, S_q: 128, S_kv: 2048, H: 32, H_kv: 8, D: 128, is_causal: true, dtype_cases: [{T: bfloat16}], label: qwen3-8b-chunked-prefill}
  - {B: 8, S_q: 128, S_kv: 2048, H: 32, H_kv: 8, D: 128, is_causal: true, dtype_cases: [{T: bfloat16}], label: qwen3-8b-chunked-b8}
  roofline:
    # The scores each query row sees under bottom-right alignment, the causal mask and both windows.
    func: "tileops.perf.formulas.gqa_dense_fwd_roofline"

GQAVarlenFwdOp:
  family: attention
  status: implemented
  ref_api: flash_attn_interface.flash_attn_varlen_func
  signature:
    forall: {B: Dim, T_q: Dim, T_kv: Dim, H: Dim, H_kv: Dim, D: Dim, P: Dim, T: "DType[float16 | bfloat16 | float8_e4m3fn]", q_lens: "Seq[Int]", kv_lens: "Seq[Int]"}
    params:
      is_causal: {type: bool, default: true}
      window_size_left: {type: int, default: -1}
      window_size_right: {type: int, default: -1}
      sm_scale: {type: "float | None", default: null}
      softcap: {type: "float | None", default: null}
      out_dtype: {type: "float16 | bfloat16 | None", default: null}
      pos_encoding_mode: {type: "'none' | 'rope'", default: none}
      rotary_dim: {type: "int | None", default: null}
      rope_layout: {type: "'neox' | 'interleaved'", default: neox}
      validate_inputs: {type: bool, default: false}
    inputs:
      q: {dtype: T, shape: "[T_q, H, D]"}
      k: {dtype: T, shape: "[T_kv, H_kv, D]"}
      v: {dtype: T, shape: "[T_kv, H_kv, D]"}
      cu_seqlens_q: {dtype: int32, shape: "[B + 1]", values: "prefix_sum(q_lens)", requires: ["prefix_offsets(T_q)"]}
      cu_seqlens_kv: {dtype: int32, shape: "[B + 1]", values: "prefix_sum(kv_lens)", requires: ["prefix_offsets(T_kv)"]}
      q_scale: {dtype: float32, shape: "[B, H_kv]", optional: true}
      k_scale: {dtype: float32, shape: "[B, H_kv]", optional: "present(q_scale)"}
      v_scale: {dtype: float32, shape: "[B, H_kv]", optional: "present(q_scale)"}
      rope_cos: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[P, R // 2]", optional: "pos_encoding_mode == 'rope'"}
      rope_sin: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[P, R // 2]", optional: "pos_encoding_mode == 'rope'"}
    outputs:
      o: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[T_q, H, D]"}
    let:
      R: "rotary_dim.value if present(rotary_dim) else D"
    shape_rules:
    - "H_kv > 0 and H % H_kv == 0"
    - "window_size_left >= -1 and window_size_right >= -1"
    - "(window_size_left == -1 and window_size_right == -1) or (not present(sm_scale) and (not present(softcap) or softcap.value == 0))"
    - "(T == 'float8_e4m3fn') == present(q_scale)"
    - "present(out_dtype) if T == 'float8_e4m3fn' else (not present(out_dtype) or out_dtype.value == T)"
    - "pos_encoding_mode == 'rope' or not present(rotary_dim)"
    - "not present(rotary_dim) or (rotary_dim.value > 0 and rotary_dim.value % 2 == 0 and rotary_dim.value <= D)"
    - "not present(sm_scale) or -inf < sm_scale.value < inf"
  workloads:
  - {T_q: 2048, T_kv: 2048, H: 32, H_kv: 8, D: 128, q_lens: "repeat(512, 4)", kv_lens: "repeat(512, 4)", is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-uniform}
  - {T_q: 1024, T_kv: 3072, H: 32, H_kv: 8, D: 128, q_lens: "repeat(512, 2)", kv_lens: [1024, 2048], is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-q-lt-kv}
  - {T_q: 1024, T_kv: 3072, H: 64, H_kv: 8, D: 128, q_lens: "repeat(512, 2)", kv_lens: [1024, 2048], is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-q-lt-kv}
  - {T_q: 2048, T_kv: 2048, H: 64, H_kv: 8, D: 64, q_lens: "repeat(512, 4)", kv_lens: "repeat(512, 4)", is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: gpt-oss-uniform}
  - {T_q: 1024, T_kv: 3072, H: 64, H_kv: 8, D: 64, q_lens: "repeat(512, 2)", kv_lens: [1024, 2048], is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: gpt-oss-q-lt-kv}
  - {T_q: 2048, T_kv: 2048, H: 32, H_kv: 8, D: 128, q_lens: "repeat(512, 4)", kv_lens: "repeat(512, 4)", is_causal: true, window_size_left: 256, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-short-w256}
  - {T_q: 8192, T_kv: 8192, H: 32, H_kv: 8, D: 128, q_lens: "repeat(2048, 4)", kv_lens: "repeat(2048, 4)", is_causal: true, window_size_left: 1024, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-long-w1024}
  - {T_q: 2048, T_kv: 2048, H: 64, H_kv: 8, D: 128, q_lens: "repeat(512, 4)", kv_lens: "repeat(512, 4)", is_causal: true, window_size_left: 256, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-short-w256}
  - {T_q: 8192, T_kv: 8192, H: 64, H_kv: 8, D: 128, q_lens: "repeat(2048, 4)", kv_lens: "repeat(2048, 4)", is_causal: true, window_size_left: 1024, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-long-w1024}
  - {T_q: 4096, T_kv: 4096, H: 32, H_kv: 4, D: 512, q_lens: "repeat(2048, 2)", kv_lens: "repeat(2048, 2)", is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: gemma4-31b-uniform}
  - {T_q: 1024, T_kv: 3072, H: 32, H_kv: 4, D: 512, q_lens: "repeat(512, 2)", kv_lens: [1024, 2048], is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: gemma4-31b-q-lt-kv}
  - {T_q: 6048, T_kv: 6048, H: 16, H_kv: 2, D: 512, q_lens: [1000, 2048, 3000], kv_lens: [1000, 2048, 3000], is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: gemma4-26b-a4b-ragged}
  - {T_q: 2048, T_kv: 2048, P: 512, H: 32, H_kv: 8, D: 128, q_lens: "repeat(512, 4)", kv_lens: "repeat(512, 4)", is_causal: true, pos_encoding_mode: rope, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-uniform-rope}
  - {T_q: 2048, T_kv: 2048, P: 512, H: 64, H_kv: 8, D: 64, q_lens: "repeat(512, 4)", kv_lens: "repeat(512, 4)", is_causal: true, pos_encoding_mode: rope, rope_layout: interleaved, dtype_cases: [{T: float16}, {T: bfloat16}], label: gpt-oss-rope-interleaved}
  - {T_q: 1018, T_kv: 2041, P: 1024, H: 32, H_kv: 8, D: 128, q_lens: [1, 0, 1000, 17], kv_lens: [1024, 0, 1000, 17], is_causal: true, pos_encoding_mode: rope, rotary_dim: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-rope-partial}
  - {T_q: 3018, T_kv: 4017, P: 3000, H: 16, H_kv: 2, D: 128, q_lens: [3000, 1, 17], kv_lens: [3000, 1000, 17], is_causal: true, pos_encoding_mode: rope, rope_layout: interleaved, dtype_cases: [{T: float16}, {T: bfloat16}], label: qwen-ragged-rope}
  # FP8 Q/K/V carry one dequantization scale per request and KV head, and name a 16-bit
  # out_dtype; bfloat16 is what the FP8 kernels of the comparison libraries return.
  - {T_q: 2048, T_kv: 2048, H: 32, H_kv: 8, D: 128, q_lens: "repeat(512, 4)", kv_lens: "repeat(512, 4)", is_causal: true, out_dtype: bfloat16, some: [q_scale], dtype_cases: [{T: float8_e4m3fn}], label: llama-8b-fp8}
  - {T_q: 1024, T_kv: 3072, H: 64, H_kv: 8, D: 128, q_lens: "repeat(512, 2)", kv_lens: [1024, 2048], is_causal: true, out_dtype: bfloat16, some: [q_scale], dtype_cases: [{T: float8_e4m3fn}], label: llama-70b-fp8-q-lt-kv}
  - {T_q: 3017, T_kv: 6146, H: 32, H_kv: 4, D: 128, q_lens: [1, 17, 1000, 0, 1999], kv_lens: [1, 17, 1000, 3000, 2128], is_causal: true, out_dtype: bfloat16, some: [q_scale], dtype_cases: [{T: float8_e4m3fn}], label: qwen3-fp8-ragged}
  - {T_q: 2048, T_kv: 2048, H: 32, H_kv: 8, D: 128, q_lens: "repeat(512, 4)", kv_lens: "repeat(512, 4)", is_causal: true, window_size_left: 256, out_dtype: bfloat16, some: [q_scale], dtype_cases: [{T: float8_e4m3fn}], label: llama-8b-fp8-w256}
  roofline:
    func: "tileops.perf.formulas.gqa_varlen_fwd_roofline"

GQAPagedFwdOp:
  family: attention
  status: spec-only
  ref_api: flash_attn_interface.flash_attn_with_kvcache
  signature:
    forall: {B: Dim, T_q: Dim, NP: Dim, PS: Dim, W: Dim, H: Dim, H_kv: Dim, D: Dim, P: Dim, SK: Shape, T: "DType[float16 | bfloat16 | float8_e4m3fn]", KV: "DType[float16 | bfloat16 | float8_e4m3fn]", q_lens: "Seq[Int]", cache_lens: "Seq[Int]"}
    params:
      is_causal: {type: bool, default: true}
      window_size_left: {type: int, default: -1}
      window_size_right: {type: int, default: -1}
      sm_scale: {type: "float | None", default: null}
      softcap: {type: "float | None", default: null}
      out_dtype: {type: "float16 | bfloat16 | None", default: null}
      pos_encoding_mode: {type: "'none' | 'rope'", default: none}
      rotary_dim: {type: "int | None", default: null}
      rope_layout: {type: "'neox' | 'interleaved'", default: neox}
    inputs:
      q: {dtype: T, shape: "[T_q, H, D]"}
      k_pages: {dtype: KV, shape: "[NP, PS, H_kv, D]"}
      v_pages: {dtype: KV, shape: "[NP, PS, H_kv, D]"}
      page_table: {dtype: int32, shape: "[B, W]", values: "paged_block_table(B, W, NP)", requires: ["in_range(0, NP)"]}
      # Cached length per request, its query tokens (the last q_len) included;
      # q_len <= cache_seqlens is the caller's obligation.
      cache_seqlens: {dtype: int32, shape: "[B]", values: "as_tensor(cache_lens)", requires: ["in_range(0, W * PS + 1)", "in_range(0, P + 1 if pos_encoding_mode == 'rope' else W * PS + 1)"]}
      cu_seqlens_q: {dtype: int32, shape: "[B + 1]", values: "prefix_sum(q_lens)", requires: ["prefix_offsets(T_q)"]}
      q_scale: {dtype: float32, shape: "[B, H_kv]", optional: true}
      # A per-tensor scale is [1]; a per-request, per-KV-head one is [B, H_kv].
      k_scale: {dtype: float32, shape: "[*SK]", optional: true}
      v_scale: {dtype: float32, shape: "[*SK]", optional: "present(k_scale)"}
      rope_cos: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[P, R // 2]", optional: "pos_encoding_mode == 'rope'"}
      rope_sin: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[P, R // 2]", optional: "pos_encoding_mode == 'rope'"}
      sinks: {dtype: float32, shape: "[H]", optional: true}
    outputs:
      o: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[T_q, H, D]"}
    let:
      R: "rotary_dim.value if present(rotary_dim) else D"
    dtype_combos:
    - {T: float16, KV: float16}
    - {T: bfloat16, KV: bfloat16}
    - {T: float16, KV: float8_e4m3fn}
    - {T: bfloat16, KV: float8_e4m3fn}
    - {T: float8_e4m3fn, KV: float8_e4m3fn}
    shape_rules:
    - "H_kv > 0 and H % H_kv == 0 and PS > 0"
    - "window_size_left >= -1 and window_size_right >= -1"
    - "(T == 'float8_e4m3fn') == present(q_scale)"
    - "(KV == 'float8_e4m3fn') == present(k_scale)"
    - "present(out_dtype) if T == 'float8_e4m3fn' else (not present(out_dtype) or out_dtype.value == T)"
    - "pos_encoding_mode == 'rope' or not present(rotary_dim)"
    - "not present(rotary_dim) or (rotary_dim.value > 0 and rotary_dim.value % 2 == 0 and rotary_dim.value <= D)"
    - "not present(sm_scale) or -inf < sm_scale.value < inf"
  workloads:
  - {T_q: 4096, NP: 576, PS: 64, W: 72, H: 32, H_kv: 8, D: 128, q_lens: "repeat(512, 8)", cache_lens: "repeat(4096, 8)", dtype_cases: [{T: float16, KV: float16}], label: llama-8b}
  - {T_q: 32, NP: 2048, PS: 64, W: 64, H: 32, H_kv: 8, D: 128, q_lens: "repeat(1, 32)", cache_lens: "repeat(4096, 32)", dtype_cases: [{T: float16, KV: float16}], label: llama-8b-p64}
  - {T_q: 8, NP: 4096, PS: 64, W: 512, H: 32, H_kv: 8, D: 128, q_lens: "repeat(1, 8)", cache_lens: "repeat(32768, 8)", dtype_cases: [{T: float16, KV: float16}], label: llama-8b-32k-p64}
  - {T_q: 64, NP: 2048, PS: 64, W: 32, H: 32, H_kv: 8, D: 128, q_lens: "repeat(1, 64)", cache_lens: "repeat(2048, 64)", dtype_cases: [{T: float16, KV: float16}], label: llama-8b-b64-p64}
  - {T_q: 8, NP: 512, PS: 64, W: 64, H: 64, H_kv: 8, D: 128, q_lens: "repeat(1, 8)", cache_lens: "repeat(4096, 8)", dtype_cases: [{T: float16, KV: float16}], label: llama-70b-p64}
  - {T_q: 32, NP: 512, PS: 256, W: 16, H: 32, H_kv: 8, D: 128, q_lens: "repeat(1, 32)", cache_lens: "repeat(4096, 32)", dtype_cases: [{T: float16, KV: float16}], label: llama-8b-p256}
  - {T_q: 8, NP: 128, PS: 256, W: 16, H: 64, H_kv: 8, D: 128, q_lens: "repeat(1, 8)", cache_lens: "repeat(4096, 8)", dtype_cases: [{T: float16, KV: float16}], label: llama-70b-p256}
  - {T_q: 4, NP: 64, PS: 256, W: 16, H: 128, H_kv: 8, D: 128, q_lens: "repeat(1, 4)", cache_lens: "repeat(4096, 4)", dtype_cases: [{T: float16, KV: float16}], label: llama-405b-p256}
  - {T_q: 32, NP: 2048, PS: 64, W: 64, H: 32, H_kv: 8, D: 128, q_lens: "repeat(1, 32)", cache_lens: "repeat(4096, 32)", softcap: 50.0, dtype_cases: [{T: float16, KV: float16}], label: llama-8b-p64-softcap}
  - {T_q: 32, NP: 8192, PS: 16, W: 256, H: 32, H_kv: 8, D: 128, q_lens: "repeat(1, 32)", cache_lens: "repeat(4096, 32)", dtype_cases: [{T: float16, KV: float16}], label: llama-8b-p16}
  - {T_q: 64, NP: 8192, PS: 16, W: 128, H: 32, H_kv: 8, D: 128, q_lens: "repeat(1, 64)", cache_lens: "repeat(2048, 64)", dtype_cases: [{T: float16, KV: float16}], label: llama-8b-b64-p16}
  - {T_q: 8, NP: 2048, PS: 16, W: 256, H: 64, H_kv: 8, D: 128, q_lens: "repeat(1, 8)", cache_lens: "repeat(4096, 8)", dtype_cases: [{T: float16, KV: float16}], label: llama-70b-p16}
  # The cache end falls inside a key tile; the rows of that tile past it are stale.
  - {T_q: 32, NP: 2048, PS: 64, W: 64, H: 32, H_kv: 8, D: 128, q_lens: "repeat(1, 32)", cache_lens: "repeat(4001, 32)", dtype_cases: [{T: float16, KV: float16}], label: llama-8b-p64-cut}
