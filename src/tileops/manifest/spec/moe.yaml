MoEPermuteAlignFwdOp:
  family: moe
  status: implemented
  signature:
    forall: {T: Dim, K: Dim}
    params:
      num_experts: {type: int}
      # GEMM tile height (M) each expert's token count is padded to.
      block_size: {type: int, default: 64}
    inputs:
      topk_ids: {dtype: int32, shape: "[T, K]", values: "topk_ids(T, K, num_experts)", requires: ["in_range(0, num_experts)"]}
    let:
      # Worst-case padded length: every expert, plus the invalid-id bucket, pads one partial block.
      P: "T * K + (num_experts + 1) * (block_size - 1)"
    outputs:
      sorted_token_ids: {dtype: int32, shape: "[P]"}
      expert_ids: {dtype: int32, shape: "[ceil_div(P, block_size)]"}
      num_tokens_post_pad: {dtype: int32, shape: "[1]"}
    shape_rules:
    - "num_experts > 0"
    - "block_size > 0"
  workloads:
    # Kimi K2: E=384, K=8, block_size=64
  - {T: 1, K: 8, num_experts: 384, block_size: 64, label: "kimi-k2-t1"}
  - {T: 32, K: 8, num_experts: 384, block_size: 64, label: "kimi-k2-t32"}
  - {T: 512, K: 8, num_experts: 384, block_size: 64, label: "kimi-k2-t512"}
  - {T: 4096, K: 8, num_experts: 384, block_size: 64, label: "kimi-k2-t4096"}
    # DeepSeek-V3: E=256, K=8, block_size=64
  - {T: 1, K: 8, num_experts: 256, block_size: 64, label: "ds-v3-t1"}
  - {T: 32, K: 8, num_experts: 256, block_size: 64, label: "ds-v3-t32"}
  - {T: 512, K: 8, num_experts: 256, block_size: 64, label: "ds-v3-t512"}
  - {T: 4096, K: 8, num_experts: 256, block_size: 64, label: "ds-v3-t4096"}
    # Qwen3: E=128, K=8, block_size=64
  - {T: 1, K: 8, num_experts: 128, block_size: 64, label: "qwen3-235b-t1"}
  - {T: 32, K: 8, num_experts: 128, block_size: 64, label: "qwen3-235b-t32"}
  - {T: 512, K: 8, num_experts: 128, block_size: 64, label: "qwen3-235b-t512"}
  - {T: 4096, K: 8, num_experts: 128, block_size: 64, label: "qwen3-235b-t4096"}
  roofline:
    # Integer index computation only.
    flops: "0"

FusedMoEExpertsFwdOp:
  family: moe
  status: implemented
  signature:
    forall: {T: Dim, H: Dim, F: Dim, E: Dim, K: Dim, D: "DType[float16 | bfloat16]"}
    params:
      routed_scaling_factor: {type: float, default: 1.0}
      activation: {type: "'silu_and_mul' | 'gelu_and_mul'", default: silu_and_mul, kw_only: true}
    inputs:
      output: {dtype: D, shape: "[T, H]", mutated: true, write_only: true, contiguous: true}
      hidden_states: {dtype: D, shape: "[T, H]", contiguous: true}
      w_gate_up: {dtype: D, shape: "[E, 2 * F, H]", contiguous: true}
      w_down: {dtype: D, shape: "[E, H, F]", contiguous: true}
      topk_weights: {dtype: float32, shape: "[T, K]", contiguous: true}
      topk_ids: {dtype: int32, shape: "[T, K]", contiguous: true, values: "topk_ids(T, K, E)", requires: ["in_range(0, E)"]}
    outputs: {}
    shape_rules:
    - "T > 0"
    - "K > 0"
    - "H > 0"
    - "F > 0"
    - "routed_scaling_factor > 0"
  workloads:
    # Qwen3-235B-A22B: H=4096, F=1536, E=128, K=8
  - {T: 512, E: 128, K: 8, H: 4096, F: 1536, dtype_cases: [{D: float16}, {D: bfloat16}], label: "qwen3-235b-decode"}
  - {T: 4096, E: 128, K: 8, H: 4096, F: 1536, dtype_cases: [{D: float16}, {D: bfloat16}], label: "qwen3-235b-prefill"}
    # DeepSeek-V3: H=7168, F=2048, E=256, K=8
  - {T: 512, E: 256, K: 8, H: 7168, F: 2048, dtype_cases: [{D: float16}, {D: bfloat16}], label: "ds-v3-decode"}
  - {T: 4096, E: 256, K: 8, H: 7168, F: 2048, dtype_cases: [{D: float16}, {D: bfloat16}], label: "ds-v3-prefill"}
  roofline:
    # Only the experts topk_ids selects are read.
    func: "tileops.perf.formulas.routed_expert_mlp_roofline"
  composition:
    kind: composite
    stages:
    # Built per expert count, on the calls the indexed path does not serve.
    - {name: pre_permute, op: MoEPrePermuteFwdOp, optional: true}
    - {name: expert_mlp, op: MoEExpertMLPFwdOp}
    - {name: post_permute, op: MoEPostPermuteFwdOp}
    # Held for silu_and_mul; serves a call with T * K <= 2 * E, H % 128 == 0 and F % 256 == 0.
    - {name: indexed_small_route, op: IndexedExpertMLPFwdOp, optional: true}

IndexedExpertMLPFwdOp:
  family: moe
  status: implemented
  signature:
    forall: {T: Dim, H: Dim, F: Dim, E: Dim, K: Dim, D: "DType[float16 | bfloat16]"}
    params:
      routed_scaling_factor: {type: float, default: 1.0}
    inputs:
      output: {dtype: D, shape: "[T, H]", mutated: true, write_only: true, contiguous: true}
      hidden_states: {dtype: D, shape: "[T, H]", contiguous: true}
      w_gate_up: {dtype: D, shape: "[E, 2 * F, H]", contiguous: true}
      w_down: {dtype: D, shape: "[E, H, F]", contiguous: true}
      topk_weights: {dtype: float32, shape: "[T, K]", contiguous: true}
      topk_ids: {dtype: int32, shape: "[T, K]", contiguous: true, values: "topk_ids(T, K, E)", requires: ["in_range(0, E)"]}
    outputs: {}
    shape_rules:
    - "T > 0"
    - "K > 0"
    - "H > 0"
    - "F > 0"
    - "routed_scaling_factor > 0"
  workloads:
    # DeepSeek-V3: H=7168, F=2048, E=256, K=8
  - {T: 1, E: 256, K: 8, H: 7168, F: 2048, dtype_cases: [{D: float16}, {D: bfloat16}], label: "ds-v3-t1"}
  - {T: 32, E: 256, K: 8, H: 7168, F: 2048, dtype_cases: [{D: float16}, {D: bfloat16}], label: "ds-v3-t32"}
  - {T: 64, E: 256, K: 8, H: 7168, F: 2048, dtype_cases: [{D: float16}, {D: bfloat16}], label: "ds-v3-t64"}
    # Qwen3-235B-A22B: H=4096, F=1536, E=128, K=8
  - {T: 32, E: 128, K: 8, H: 4096, F: 1536, dtype_cases: [{D: float16}, {D: bfloat16}], label: "qwen3-235b-t32"}
  roofline:
    # Only the experts topk_ids selects are read.
    func: "tileops.perf.formulas.routed_expert_mlp_roofline"

FusedTopKFwdOp:
  family: moe
  status: implemented
  signature:
    forall: {T: Dim, E: Dim, G: "DType[float16 | bfloat16 | float32]"}
    params:
      top_k: {type: int}
      scoring_func: {type: "'softmax' | 'sigmoid'", default: softmax}
      renormalize: {type: bool, default: false}
    inputs:
      gating_output: {dtype: G, shape: "[T, E]", contiguous: true}
      # Added to the sigmoid scores for the selection only; the returned weights stay the
      # unbiased scores (Kimi K2 routing).
      correction_bias: {dtype: float32, shape: "[E]", optional: true, contiguous: true}
    outputs:
      topk_weights: {dtype: float32, shape: "[T, top_k]", contiguous: true}
      topk_ids: {dtype: int32, shape: "[T, top_k]", contiguous: true}
    shape_rules:
    - "0 < top_k"
    - "top_k <= E"
    - "not present(correction_bias) or scoring_func == 'sigmoid'"
  workloads:
    # Kimi K2 routing, then Qwen3-235B-A22B, over the decode-to-prefill token range.
  - {T: 32, E: 384, top_k: 8, scoring_func: sigmoid, renormalize: true, dtype_cases: [{G: bfloat16}], label: "kimi-k2-t32"}
  - {T: 512, E: 384, top_k: 8, scoring_func: sigmoid, renormalize: true, dtype_cases: [{G: bfloat16}], label: "kimi-k2-t512"}
  - {T: 4096, E: 384, top_k: 8, scoring_func: sigmoid, renormalize: true, dtype_cases: [{G: bfloat16}], label: "kimi-k2-t4096"}
    # Kimi K2 also routes with a per-expert bias, which is a second kernel build.
  - {T: 512, E: 384, top_k: 8, scoring_func: sigmoid, renormalize: true, some: [correction_bias], dtype_cases: [{G: bfloat16}, {G: float16}, {G: float32}], label: "kimi-k2-t512-bias"}
  - {T: 32, E: 128, top_k: 8, scoring_func: softmax, renormalize: true, dtype_cases: [{G: bfloat16}], label: "qwen3-235b-t32"}
  - {T: 512, E: 128, top_k: 8, scoring_func: softmax, renormalize: true, dtype_cases: [{G: bfloat16}, {G: float16}, {G: float32}], label: "qwen3-235b-t512"}
  - {T: 4096, E: 128, top_k: 8, scoring_func: softmax, renormalize: true, dtype_cases: [{G: bfloat16}], label: "qwen3-235b-t4096"}
  roofline:
    # Per token: scoring (sigmoid 4 per logit; softmax 3, plus the row sum and a divide per
    # kept weight unless renormalizing), top_k compare-and-selects per logit, the bias add,
    # and 2 * top_k to renormalize.
    flops: "T * (top_k * E + (4 * E if scoring_func == 'sigmoid' else 3 * E + (0 if renormalize else E + top_k)) + (E if present(correction_bias) else 0) + (2 * top_k if renormalize else 0))"

FusedMoEFwdOp:
  family: moe
  status: implemented
  signature:
    forall: {T: Dim, H: Dim, F: Dim, E: Dim, D: "DType[float16 | bfloat16]"}
    params:
      top_k: {type: int}
      scoring_func: {type: "'softmax' | 'sigmoid'", default: softmax}
      renormalize: {type: bool, default: false}
      routed_scaling_factor: {type: float, default: 1.0}
      activation: {type: "'silu_and_mul' | 'gelu_and_mul'", default: silu_and_mul, kw_only: true}
    inputs:
      hidden_states: {dtype: D, shape: "[T, H]", contiguous: true}
      gating_output: {dtype: float32, shape: "[T, E]", contiguous: true}
      w_gate_up: {dtype: D, shape: "[E, 2 * F, H]", contiguous: true}
      w_down: {dtype: D, shape: "[E, H, F]", contiguous: true}
      # Added to the sigmoid scores for the selection only (Kimi K2 routing).
      correction_bias: {dtype: float32, shape: "[E]", optional: true, contiguous: true}
    outputs:
      output: {dtype: D, shape: "[T, H]"}
    shape_rules:
    - "0 < top_k"
    - "top_k <= E"
    - "not present(correction_bias) or scoring_func == 'sigmoid'"
    - "T > 0"
    - "H > 0"
    - "F > 0"
    - "routed_scaling_factor > 0"
  workloads:
  - {T: 512, E: 128, H: 4096, F: 1536, top_k: 8, scoring_func: softmax, renormalize: true, dtype_cases: [{D: bfloat16}, {D: float16}], label: "qwen3-235b-decode"}
  - {T: 4096, E: 128, H: 4096, F: 1536, top_k: 8, scoring_func: softmax, renormalize: true, dtype_cases: [{D: bfloat16}], label: "qwen3-235b-prefill"}
  - {T: 512, E: 256, H: 7168, F: 2048, top_k: 8, scoring_func: sigmoid, renormalize: false, dtype_cases: [{D: bfloat16}], label: "ds-v3-decode"}
  - {T: 4096, E: 256, H: 7168, F: 2048, top_k: 8, scoring_func: sigmoid, renormalize: false, dtype_cases: [{D: bfloat16}], label: "ds-v3-prefill"}
  - {T: 512, E: 256, H: 7168, F: 2048, top_k: 8, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, some: [correction_bias], dtype_cases: [{D: bfloat16}], label: "kimi-k2-decode"}
  - {T: 4096, E: 256, H: 7168, F: 2048, top_k: 8, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, some: [correction_bias], dtype_cases: [{D: bfloat16}], label: "kimi-k2-prefill"}
  roofline:
    # The routed weights follow the routing the experts stage receives.
    func: "tileops.perf.formulas.fused_moe_fwd_roofline"
  composition:
    kind: composite
    stages:
    - {name: route_select, op: FusedTopKFwdOp}
    - {name: routed_experts, op: FusedMoEExpertsFwdOp}

MoEPrePermuteFwdOp:
  family: moe
  status: implemented
  signature:
    types:
      LayoutMetadata:
        params: {layout: MGroupedLayout, E: Dim, P: Dim}
        match: layout
        cases:
        - {when: {contiguous: {metadata_kind: physical_psum}}, is: "[E]"}
        - {when: {contiguous: {metadata_kind: per_row}}, is: "[P]"}
    forall: {T: Dim, H: Dim, K: Dim, D: "DType[float16 | bfloat16]"}
    params:
      layout: {type: MGroupedLayout}
      num_local_experts: {type: int}
    inputs:
      hidden_states: {dtype: D, shape: "[T, H]", contiguous: true}
      local_expert_ids: {dtype: int32, shape: "[T, K]", contiguous: true, values: "topk_ids(T, K, num_local_experts)", requires: ["in_range(0, num_local_experts)"]}
    let:
      P: "moe.capacity(layout, T * K, num_local_experts)"
    outputs:
      expert_input: {dtype: D, shape: "[P, H]", contiguous: true}
      layout_metadata: {dtype: int32, shape: "LayoutMetadata[layout, num_local_experts, P]", contiguous: true}
      inverse_indices: {dtype: int32, shape: "[T * K]", contiguous: true}
    shape_rules:
    # A masked slab holds at most max_m routes per expert, which the ids do not promise.
    - "layout.kind == 'contiguous'"
    - "num_local_experts > 0"
    - "T > 0"
    - "K > 0"
  workloads:
  - {T: 32, H: 128, K: 2, num_local_experts: 4, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "decode-t32"}
  - {T: 512, H: 128, K: 2, num_local_experts: 4, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "prefill-t512"}
    # DeepSeek-V3 under EP=8: 32 local experts, H=7168, K=8.
  - {T: 100, H: 7168, K: 8, num_local_experts: 32, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "ds-v3-ep8-t100"}
  roofline:
    # A gather: no arithmetic.
    flops: "0"

MoEGroupedGemmFwdOp:
  family: moe
  status: implemented
  signature:
    types:
      Rows:
        params: {layout: MGroupedLayout, E: Dim, P: Dim, C: Dim}
        match: layout
        cases:
        - {when: {masked: _}, is: "[E, layout.max_m, C]"}
        - {when: {contiguous: _}, is: "[P, C]"}
      LayoutMetadata:
        params: {layout: MGroupedLayout, E: Dim, P: Dim}
        match: layout
        cases:
        - {when: {masked: _}, is: "[E]"}
        - {when: {contiguous: {metadata_kind: physical_psum}}, is: "[E]"}
        - {when: {contiguous: {metadata_kind: per_row}}, is: "[P]"}
    forall: {P: Dim, K: Dim, N: Dim, E: Dim, D: "DType[float16 | bfloat16]"}
    params:
      layout: {type: MGroupedLayout}
      # A gated activation fused into the epilogue: b stacks gate and up along its second
      # axis, and the output keeps act(gate) * up, N columns.
      activation: {type: "'silu_and_mul' | 'gelu_and_mul' | None", default: null, kw_only: true}
      out_dtype: {type: "float32 | None", default: null, kw_only: true}
    inputs:
      a: {dtype: D, shape: "Rows[layout, E, P, K]", contiguous: true}
      b: {dtype: D, shape: "[E, 2 * N if present(activation) else N, K]", contiguous: true}
      layout_metadata: {dtype: int32, shape: "LayoutMetadata[layout, E, P]", contiguous: true, values: "moe.layout_metadata(layout, R, E)", requires: ["moe.layout_valid(layout, R, E)"]}
    let:
      # Materialized rows of `a`.
      R: "E * layout.max_m if layout.kind == 'masked' else P"
    outputs:
      output: {dtype: "coalesce_dtype(out_dtype, D)", shape: "Rows[layout, E, P, N]", buffer: out, contiguous: true}
    shape_rules:
    - "E > 0"
    - "K > 0"
    # An aligned layout materializes whole tiles.
    - "layout.kind == 'masked' or layout.packing == 'tight' or P % layout.alignment == 0"
  workloads:
    # DeepSeek-V3: 256 experts, H=7168, F=2048; gate_up is [E, 2F, H], down is [E, H, F].
  - {P: 4096, K: 7168, E: 256, N: 4096, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}, {D: float16}], label: "ds-v3-decode-mlp-up"}
  - {P: 32768, K: 7168, E: 256, N: 4096, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}], label: "ds-v3-prefill-mlp-up"}
  - {P: 4096, K: 2048, E: 256, N: 7168, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}], label: "ds-v3-decode-down"}
  - {P: 4096, K: 2048, E: 256, N: 7168, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, out_dtype: float32, dtype_cases: [{D: bfloat16}], label: "ds-v3-decode-down"}
  - {P: 32768, K: 2048, E: 256, N: 7168, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}], label: "ds-v3-prefill-down"}
  - {P: 4096, K: 7168, E: 256, N: 2048, activation: silu_and_mul, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}], label: "ds-v3-decode-swiglu"}
  - {P: 32768, K: 7168, E: 256, N: 2048, activation: silu_and_mul, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}], label: "ds-v3-prefill-swiglu"}
    # DeepSeek-V3 under EP=8 with a masked dispatch: 32 local experts, 128 slots each.
  - {K: 7168, E: 32, N: 4096, layout: {masked: {max_m: 128}}, dtype_cases: [{D: bfloat16}], label: "ds-v3-ep8-masked"}
  roofline:
    func: tileops.perf.formulas.moe_grouped_gemm_roofline

MoEExpertMLPFwdOp:
  family: moe
  status: implemented
  signature:
    types:
      Rows:
        params: {layout: MGroupedLayout, E: Dim, P: Dim, C: Dim}
        match: layout
        cases:
        - {when: {masked: _}, is: "[E, layout.max_m, C]"}
        - {when: {contiguous: _}, is: "[P, C]"}
      LayoutMetadata:
        params: {layout: MGroupedLayout, E: Dim, P: Dim}
        match: layout
        cases:
        - {when: {masked: _}, is: "[E]"}
        - {when: {contiguous: {metadata_kind: physical_psum}}, is: "[E]"}
        - {when: {contiguous: {metadata_kind: per_row}}, is: "[P]"}
    forall: {P: Dim, H: Dim, F: Dim, E: Dim, D: "DType[float16 | bfloat16]"}
    params:
      layout: {type: MGroupedLayout}
      activation: {type: "'silu_and_mul' | 'gelu_and_mul'", default: silu_and_mul}
    inputs:
      expert_input: {dtype: D, shape: "Rows[layout, E, P, H]", contiguous: true}
      w_gate_up: {dtype: D, shape: "[E, 2 * F, H]", contiguous: true}
      w_down: {dtype: D, shape: "[E, H, F]", contiguous: true}
      layout_metadata: {dtype: int32, shape: "LayoutMetadata[layout, E, P]", contiguous: true, values: "moe.layout_metadata(layout, R, E)", requires: ["moe.layout_valid(layout, R, E)"]}
    let:
      # Materialized rows of `expert_input`.
      R: "E * layout.max_m if layout.kind == 'masked' else P"
    outputs:
      output: {dtype: D, shape: "Rows[layout, E, P, H]", buffer: out, contiguous: true}
    shape_rules:
    - "E > 0"
    - "H > 0"
    - "F > 0"
    # An aligned layout materializes whole tiles.
    - "layout.kind == 'masked' or layout.packing == 'tight' or P % layout.alignment == 0"
  workloads:
    # Qwen3-235B-A22B: H=4096, F=1536, E=128; DeepSeek-V3: H=7168, F=2048, E=256.
  - {P: 4096, H: 4096, E: 128, F: 1536, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "qwen3-235b-decode"}
  - {P: 32768, H: 4096, E: 128, F: 1536, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "qwen3-235b-prefill"}
  - {P: 4096, H: 7168, E: 256, F: 2048, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "ds-v3-decode"}
  - {P: 32768, H: 7168, E: 256, F: 2048, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "ds-v3-prefill"}
  roofline:
    func: tileops.perf.formulas.moe_expert_mlp_roofline
  composition:
    kind: composite
    stages:
    - {name: gate_up, op: MoEGroupedGemmFwdOp}
    - {name: down, op: MoEGroupedGemmFwdOp}

MoEPostPermuteFwdOp:
  family: moe
  status: implemented
  signature:
    types:
      Rows:
        params: {layout: MGroupedLayout, E: Dim, P: Dim, C: Dim}
        match: layout
        cases:
        - {when: {masked: _}, is: "[E, layout.max_m, C]"}
        - {when: {contiguous: _}, is: "[P, C]"}
    forall: {T: Dim, K: Dim, E: Dim, P: Dim, H: Dim, D: "DType[float16 | bfloat16]"}
    params:
      layout: {type: MGroupedLayout}
      epilogue: {type: "RoutingEpilogueSpec | None", default: null}
      # The dtype the reduced result is written in; None keeps the expert output's.
      out_dtype: {type: "float16 | bfloat16 | None", default: null}
    inputs:
      expert_output: {dtype: D, shape: "Rows[layout, E, P, H]", contiguous: true}
      topk_weights: {dtype: float32, shape: "[T, K]", contiguous: true}
      # The materialized row each route's result sits in.
      inverse_indices: {dtype: int32, shape: "[T * K]", contiguous: true, values: "sample_indices(T * K, R)", requires: ["in_range(0, R)"]}
    let:
      # Materialized rows of `expert_output`.
      R: "E * layout.max_m if layout.kind == 'masked' else P"
    outputs:
      output: {dtype: "coalesce_dtype(out_dtype, D)", shape: "[T, H]", buffer: out, contiguous: true}
    shape_rules:
    - "H > 0"
  workloads:
  - {T: 32, K: 2, P: 64, H: 128, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "decode-t32"}
    # The output dtype stated explicitly, equal to the expert output's.
  - {T: 32, K: 2, P: 64, H: 128, out_dtype: float16, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}], label: "decode-t32"}
  - {T: 32, K: 2, P: 64, H: 128, out_dtype: bfloat16, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}], label: "decode-t32"}
  - {T: 512, K: 2, P: 1024, H: 128, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "prefill-t512"}
    # DeepSeek-V3 under EP=8: H=7168, K=8.
  - {T: 100, K: 8, P: 800, H: 7168, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "ds-v3-ep8-t100"}
  roofline:
    # The epilogue's scale is a float field of an object the language does not read.
    func: "tileops.perf.formulas.moe_post_permute_roofline"

SharedExpertMLPFwdOp:
  # The dense gated MLP of an MoE layer's shared expert: down(silu(gate) * up) over one
  # stacked gate/up weight.
  family: moe
  status: implemented
  signature:
    forall: {T: Dim, H: Dim, S: Dim, D: "DType[float16 | bfloat16]"}
    inputs:
      hidden_states: {dtype: D, shape: "[T, H]", contiguous: true}
      # The gate rows, then the up rows.
      w_gate_up: {dtype: D, shape: "[2 * S, H]", contiguous: true}
      w_down: {dtype: D, shape: "[H, S]", contiguous: true}
    outputs:
      output: {dtype: D, shape: "[T, H]"}
    shape_rules:
    - "H > 0"
    - "S > 0"
  workloads:
  # The shared experts of Kimi K2 (S=18432), DeepSeek-V3 (S=2048) and GLM-4.5 (S=1536) at
  # decode and prefill token counts.
  - {T: 1, H: 7168, S: 18432, dtype_cases: [{D: bfloat16}], label: "kimi-k2-t1"}
  - {T: 512, H: 7168, S: 18432, dtype_cases: [{D: bfloat16}], label: "kimi-k2-t512"}
  - {T: 32, H: 7168, S: 2048, dtype_cases: [{D: bfloat16}, {D: float16}], label: "ds-v3-t32"}
  - {T: 4096, H: 7168, S: 2048, dtype_cases: [{D: bfloat16}], label: "ds-v3-t4096"}
  - {T: 32, H: 5120, S: 1536, dtype_cases: [{D: bfloat16}], label: "glm45-t32"}
  roofline:
    # The gate/up and down GEMMs (2 * T * 3 * S * H), then 6 FLOPs per gated element.
    flops: "6 * T * S * H + 6 * T * S"

FusedMoESharedExpertFwdOp:
  family: moe
  status: implemented
  signature:
    forall: {T: Dim, H: Dim, F: Dim, E: Dim, S: Dim, D: "DType[float16 | bfloat16]"}
    params:
      top_k: {type: int}
      scoring_func: {type: "'softmax' | 'sigmoid'", default: softmax}
      renormalize: {type: bool, default: false}
      routed_scaling_factor: {type: float, default: 1.0}
      tp_size: {type: int, default: 1}
      tp_rank: {type: int, default: 0}
      activation: {type: "'silu_and_mul' | 'gelu_and_mul'", default: silu_and_mul, kw_only: true}
    inputs:
      hidden_states: {dtype: D, shape: "[T, H]", contiguous: true}
      gating_output: {dtype: float32, shape: "[T, E]", contiguous: true}
      w_gate_up: {dtype: D, shape: "[E, 2 * F, H]", contiguous: true}
      w_down: {dtype: D, shape: "[E, H, F]", contiguous: true}
      correction_bias: {dtype: float32, shape: "[E]", optional: true, contiguous: true}
      # The shared expert's complete weights; passing them enables it, and the op
      # shards them per tp_rank.
      shared_w_gate_up: {dtype: D, shape: "[2 * S, H]", optional: true, contiguous: true}
      shared_w_down: {dtype: D, shape: "[H, S]", optional: "present(shared_w_gate_up)", contiguous: true}
    outputs:
      # A partial sum when tp_size > 1; the caller all-reduces it.
      shared_output: {dtype: D, shape: "[T, H]", nullable: "present(shared_w_gate_up)"}
      routed_output: {dtype: D, shape: "[T, H]"}
    shape_rules:
    - "0 < top_k"
    - "top_k <= E"
    - "not present(correction_bias) or scoring_func == 'sigmoid'"
    - "T > 0"
    - "H > 0"
    - "F > 0"
    - "routed_scaling_factor > 0"
    - "1 <= tp_size"
    - "0 <= tp_rank"
    - "tp_rank < tp_size"
    # The shared expert applies silu_and_mul, on a whole shard per rank.
    - "not present(shared_w_gate_up) or activation == 'silu_and_mul'"
    - "not present(shared_w_gate_up) or (S % tp_size == 0 and S > 0)"
  workloads:
  - {T: 1, E: 384, H: 7168, F: 2048, top_k: 8, S: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "kimi-k2-t1"}
  - {T: 32, E: 384, H: 7168, F: 2048, top_k: 8, S: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "kimi-k2-t32"}
  - {T: 64, E: 384, H: 7168, F: 2048, top_k: 8, S: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "kimi-k2-t64"}
  - {T: 128, E: 384, H: 7168, F: 2048, top_k: 8, S: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "kimi-k2-t128"}
  - {T: 512, E: 384, H: 7168, F: 2048, top_k: 8, S: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "kimi-k2-t512"}
  - {T: 2048, E: 384, H: 7168, F: 2048, top_k: 8, S: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "kimi-k2-t2048"}
  - {T: 4096, E: 384, H: 7168, F: 2048, top_k: 8, S: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "kimi-k2-t4096"}
  - {T: 1, E: 256, H: 7168, F: 2048, top_k: 8, S: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "ds-v3-t1"}
  - {T: 32, E: 256, H: 7168, F: 2048, top_k: 8, S: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}, {D: float16}], label: "ds-v3-t32"}
  - {T: 64, E: 256, H: 7168, F: 2048, top_k: 8, S: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "ds-v3-t64"}
  - {T: 128, E: 256, H: 7168, F: 2048, top_k: 8, S: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "ds-v3-t128"}
  - {T: 512, E: 256, H: 7168, F: 2048, top_k: 8, S: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "ds-v3-t512"}
  - {T: 2048, E: 256, H: 7168, F: 2048, top_k: 8, S: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "ds-v3-t2048"}
  - {T: 4096, E: 256, H: 7168, F: 2048, top_k: 8, S: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "ds-v3-t4096"}
  - {T: 1, E: 160, H: 5120, F: 1536, top_k: 8, S: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "glm45-t1"}
  - {T: 32, E: 160, H: 5120, F: 1536, top_k: 8, S: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "glm45-t32"}
  - {T: 64, E: 160, H: 5120, F: 1536, top_k: 8, S: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "glm45-t64"}
  - {T: 128, E: 160, H: 5120, F: 1536, top_k: 8, S: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "glm45-t128"}
  - {T: 512, E: 160, H: 5120, F: 1536, top_k: 8, S: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "glm45-t512"}
  - {T: 2048, E: 160, H: 5120, F: 1536, top_k: 8, S: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "glm45-t2048"}
  - {T: 4096, E: 160, H: 5120, F: 1536, top_k: 8, S: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, some: [correction_bias, shared_w_gate_up], dtype_cases: [{D: bfloat16}], label: "glm45-t4096"}
  - {T: 512, E: 128, H: 4096, F: 1536, top_k: 8, scoring_func: softmax, renormalize: true, dtype_cases: [{D: bfloat16}], label: "qwen3-235b-t512"}
  roofline:
    # The routed half as FusedMoEFwdOp, plus the shared expert's two GEMMs on this rank's shard.
    func: "tileops.perf.formulas.fused_moe_shared_expert_fwd_roofline"
  composition:
    kind: composite
    stages:
    - {name: route_select, op: FusedTopKFwdOp}
    - {name: routed_experts, op: FusedMoEExpertsFwdOp}
    - {name: shared_expert, op: SharedExpertMLPFwdOp, optional: true}
MoEGroupedGemmFP8FwdOp:
  family: moe
  status: spec-only
  signature:
    types:
      Rows:
        params: {layout: MGroupedLayout, E: Dim, P: Dim, C: Dim}
        match: layout
        cases:
          - {when: {masked: "_"}, is: "[E, layout.max_m, C]"}
          - {when: {contiguous: "_"}, is: "[P, C]"}
      LayoutMetadata:
        params: {layout: MGroupedLayout, E: Dim, P: Dim}
        match: layout
        cases:
          - {when: {masked: "_"}, is: "[E]"}
          - {when: {contiguous: {metadata_kind: physical_psum}}, is: "[E]"}
          - {when: {contiguous: {metadata_kind: per_row}}, is: "[P]"}
    forall:
      P: Dim
      K: Dim
      N: Dim
      E: Dim
    params:
      layout: {type: MGroupedLayout}
    inputs:
      a: {dtype: float8_e4m3fn, shape: "Rows[layout, E, P, K]", contiguous: true}
      a_scale: {dtype: float32, shape: "Rows[layout, E, P, ceil_div(K, 128)]"}
      b: {dtype: float8_e4m3fn, shape: "[E, N, K]", contiguous: true}
      b_scale: {dtype: float32, shape: "[E, ceil_div(N, 128), ceil_div(K, 128)]"}
      layout_metadata:
        dtype: int32
        shape: "LayoutMetadata[layout, E, P]"
        contiguous: true
        values: "moe.layout_metadata(layout, R, E)"
        requires: ["moe.layout_valid(layout, R, E)"]
    let:
      R: "E * layout.max_m if layout.kind == 'masked' else P"
    shape_rules:
      - "E > 0"
      # The scales tile the operands in exact 128-element blocks; a ragged final block has
      # no representation on either side.
      - "K % 128 == 0"
      - "N % 128 == 0"
    outputs:
      output: {dtype: bfloat16, shape: "Rows[layout, E, P, N]"}
  roofline:
    func: tileops.perf.formulas.moe_grouped_gemm_fp8_roofline
  workloads:
    - {P: 1024, N: 4096, K: 7168, E: 8, layout: {contiguous: {packing: aligned, metadata_kind: per_row, alignment: 128}}, label: ds-v3-prefill-up}
    - {P: 1024, N: 7168, K: 2048, E: 8, layout: {contiguous: {packing: aligned, metadata_kind: per_row, alignment: 128}}, label: ds-v3-prefill-down}
    - {N: 4096, K: 7168, E: 8, layout: {masked: {max_m: 128}}, label: ds-v3-decode-up-masked}
    - {N: 7168, K: 2048, E: 8, layout: {masked: {max_m: 128}}, label: ds-v3-decode-down-masked}
