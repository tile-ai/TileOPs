# elementwise_unary_activation.yaml -- manifest entries for unary activation ops.
#
# Single-input single-output elementwise activation and range-transform ops:
# ReLU family (relu, gelu, silu, hardswish, hardsigmoid, mish, selu,
# leaky_relu, elu, hardtanh, softplus), and value-range transforms (clamp,
# nan_to_num). Source of truth for op interfaces in this family. Loaded
# and merged with other family files by tileops.manifest at runtime.
# See docs/design/manifest.md for the full schema.

ReluFwdOp:
  ref_api: "torch.nn.functional.relu"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # Hidden-state activation (Llama-3.1-8B prefill)
  - {S: [2048, 4096], dtype_cases: [{T: float16}, {T: bfloat16}], label: "hidden-state-prefill"}
  # Decode (single token)
  - {S: [1, 4096], dtype_cases: [{T: bfloat16}], label: "hidden-state-decode"}

  roofline:
    # FLOPs: relu(x) = max(0, x). Per roofline.md §1.3 convention,
    # one compare-and-select = 1 per elem.
    flops: "prod(S)"

GeluFwdOp:
  ref_api: "torch.nn.functional.gelu"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      approximate: {type: "'none' | 'tanh'", default: "none", kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: T, shape: "[*S]"}

  workloads:
  # Llama-3.1-8B FFN intermediate (hidden_dim=14336)
  - {S: [2048, 14336], dtype_cases: [{T: float16}, {T: bfloat16}], label: "llama-8b-ffn-prefill"}
  - {S: [1, 14336], dtype_cases: [{T: bfloat16}], label: "llama-8b-ffn-decode"}

  roofline:
    # FLOPs: gelu(x) = x * 0.5 * (1 + erf(x / sqrt(2))).
    # div(1) + erf(1) + add(1) + mul-by-half(1) + mul(1) = 5 per elem.
    flops: "5 * prod(S)"

SiluFwdOp:
  ref_api: "torch.nn.functional.silu"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # Llama-3.1-8B SwiGLU FFN intermediate
  - {S: [2048, 14336], dtype_cases: [{T: float16}, {T: bfloat16}], label: "llama-8b-ffn-prefill"}
  - {S: [1, 14336], dtype_cases: [{T: bfloat16}], label: "llama-8b-ffn-decode"}

  roofline:
    # FLOPs: silu(x) = x * sigmoid(x); sigmoid = neg + exp + add + recip = 4.
    # silu adds one mul = 5 per elem.
    flops: "5 * prod(S)"

HardswishFwdOp:
  ref_api: "torch.nn.functional.hardswish"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # Mobile-style activation map (NHW C, e.g. MobileNetV3 stage)
  - {S: [32, 96, 56, 56], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mbv3-stage2"}
  - {S: [32, 240, 28, 28], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mbv3-stage3"}

  roofline:
    # FLOPs: hardswish(x) = x * relu6(x + 3) / 6.
    # add(1) + two-sided-clamp(1, per convention) + mul(1) + div(1) = 4 per elem.
    flops: "4 * prod(S)"

HardsigmoidFwdOp:
  ref_api: "torch.nn.functional.hardsigmoid"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # SE-block gating (B, C, 1, 1)
  - {S: [32, 240, 1, 1], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mbv3-se-gate"}
  - {S: [32, 960, 1, 1], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mbv3-se-gate-deep"}

  roofline:
    # FLOPs: hardsigmoid(x) = relu6(x + 3) / 6.
    # add(1) + two-sided-clamp(1, per convention) + div(1) = 3 per elem.
    flops: "3 * prod(S)"

MishFwdOp:
  ref_api: "torch.nn.functional.mish"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # YOLO-style feature map activation
  - {S: [16, 256, 80, 80], dtype_cases: [{T: float16}, {T: bfloat16}], label: "yolo-p3"}
  - {S: [16, 512, 40, 40], dtype_cases: [{T: float16}, {T: bfloat16}], label: "yolo-p4"}

  roofline:
    # FLOPs: mish(x) = x * tanh(softplus(x)); softplus = exp + log1p = 2,
    # tanh(1, transcendental) + final mul(1) = 4 per elem.
    flops: "4 * prod(S)"

SeluFwdOp:
  ref_api: "torch.nn.functional.selu"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # SNN-style fully connected activation
  - {S: [2048, 4096], dtype_cases: [{T: float16}, {T: bfloat16}], label: "snn-fc"}
  - {S: [2048, 8192], dtype_cases: [{T: float16}, {T: bfloat16}], label: "snn-fc-wide"}

  roofline:
    # FLOPs: selu(x) = lambda * (x if x>0 else alpha*(exp(x)-1)).
    # compare-and-select(1) + exp(1) + sub(1) + mul-alpha(1) + mul-lambda(1) = 5 per elem.
    flops: "5 * prod(S)"

LeakyReluFwdOp:
  ref_api: "torch.nn.functional.leaky_relu"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      negative_slope: {type: float, default: 0.01, kw_only: true}
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # GAN feature map activation
  - {S: [16, 256, 64, 64], dtype_cases: [{T: float16}, {T: bfloat16}], label: "gan-feat"}
  - {S: [16, 512, 32, 32], dtype_cases: [{T: float16}, {T: bfloat16}], label: "gan-feat-deep"}

  roofline:
    # FLOPs: leaky_relu(x) = x if x>0 else negative_slope*x. Per
    # roofline.md §1.3, compare-and-select(1) + mul(1) = 2 per elem.
    flops: "2 * prod(S)"

EluFwdOp:
  ref_api: "torch.nn.functional.elu"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      alpha: {type: float, default: 1.0, kw_only: true}
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # MLP hidden activation
  - {S: [2048, 4096], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mlp-hidden"}
  - {S: [2048, 8192], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mlp-hidden-wide"}

  roofline:
    # FLOPs: elu(x) = x if x>0 else alpha*(exp(x)-1).
    # compare-and-select(1) + exp(1) + sub(1) + mul(1) = 4 per elem.
    flops: "4 * prod(S)"

HardtanhFwdOp:
  ref_api: "torch.nn.functional.hardtanh"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      min_val: {type: float, default: -1.0, kw_only: true}
      max_val: {type: float, default: 1.0, kw_only: true}
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}
    shape_rules:
    - "min_val <= max_val"
    - "representable(min_val, T)"
    - "representable(max_val, T)"

  workloads:
  # Quantization-friendly bounded activation
  - {S: [2048, 4096], dtype_cases: [{T: float16}, {T: bfloat16}], label: "bounded-hidden"}
  - {S: [16, 256, 56, 56], dtype_cases: [{T: float16}, {T: bfloat16}], label: "bounded-conv-feat"}

  roofline:
    # FLOPs: hardtanh = clamp(x, min_val, max_val).
    # Two-sided clamp = 1 compare-and-select per output element under the
    # roofline.md §1.3 convention. = 1 per elem.
    flops: "prod(S)"

SoftplusFwdOp:
  ref_api: "torch.nn.functional.softplus"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      beta: {type: float, default: 1.0, kw_only: true}
      threshold: {type: float, default: 20.0, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: T, shape: "[*S]"}

  workloads:
  # Distribution-modeling MLP activation
  - {S: [2048, 4096], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mlp-hidden"}
  - {S: [2048, 8192], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mlp-hidden-wide"}

  roofline:
    # FLOPs: softplus(x) = (1/beta) * log(1 + exp(beta*x)) with threshold guard.
    # mul-beta(1) + threshold compare-and-select(1) + exp(1) + log1p(1) + div-by-beta(1) = 5 per elem.
    flops: "5 * prod(S)"

ClampFwdOp:
  # PyTorch's torch.clamp(input, min=None, max=None) where each bound is a
  # Tensor or absent, broadcast with input. At least one bound must be passed;
  # min-only is torch.clamp_min and max-only is torch.clamp_max. The scalar
  # (Number) form is its own entry, ClampScalarFwdOp.
  ref_api: "torch.clamp"
  family: elementwise
  status: implemented

  signature:
    forall: {A: Shape, L: Shape, U: Shape, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      input: {dtype: T, shape: "[*A]"}
      min: {dtype: T, shape: "[*L]", optional: true}
      max: {dtype: T, shape: "[*U]", optional: true}
    outputs:
      output: {dtype: T, shape: "ClampOut[A, L, U, present(min), present(max)]"}
    types:
      ClampOut:
        params: {A: Shape, L: Shape, U: Shape, pl: Bool, pu: Bool}
        match: [pl, pu]
        cases:
        - {when: [true, true], is: "[*broadcast(A, L, U)]"}
        - {when: [true, false], is: "[*broadcast(A, L)]"}
        - {when: [false, true], is: "[*broadcast(A, U)]"}
    shape_rules:
    - "present(min) or present(max)"

  workloads:
  - {A: [4096, 4096], L: [4096, 4096], U: [4096, 4096], some: [min, max], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "elementwise-16M"}
  - {A: [16384, 16384], L: [16384, 16384], U: [16384, 16384], some: [min, max], dtype_cases: [{T: float16}, {T: bfloat16}], label: "elementwise-256M"}
  - {A: [4096, 4096], L: [4096, 4096], some: [min], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "elementwise-16M-min-only"}
  - {A: [16384, 16384], L: [16384, 16384], some: [min], dtype_cases: [{T: float16}, {T: bfloat16}], label: "elementwise-256M-min-only"}
  - {A: [4096, 4096], U: [4096, 4096], some: [max], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "elementwise-16M-max-only"}
  - {A: [16384, 16384], U: [16384, 16384], some: [max], dtype_cases: [{T: float16}, {T: bfloat16}], label: "elementwise-256M-max-only"}

  roofline:
    flops: "prod(broadcast(A, L, U)) if present(min) and present(max) else prod(broadcast(A, L)) if present(min) else prod(broadcast(A, U))"

ClampScalarFwdOp:
  # PyTorch's torch.clamp(input, min=None, max=None) with Number (or None)
  # bounds. The bounds are params here and tensor inputs in ClampFwdOp above:
  # two signatures, so two entries.
  ref_api: "torch.clamp"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      min: {type: "Number | None", default: null, kw_only: true}
      max: {type: "Number | None", default: null, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: T, shape: "[*S]"}
    shape_rules:
    - "present(min) or present(max)"
    - "not present(min) or representable(min.value, T)"
    - "not present(max) or representable(max.value, T)"

  workloads:
  - {S: [4096, 4096], min: -0.5, max: 0.5, dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "elementwise-16M"}
  - {S: [16384, 16384], min: -0.5, max: 0.5, dtype_cases: [{T: float16}, {T: bfloat16}], label: "elementwise-256M"}

  roofline:
    # FLOPs: clamp = compare-and-select. Per roofline.md §1.3 convention,
    # the clamp / min-max family collapses to 1 FLOP per output element
    # regardless of one or two bounds. = 1 per elem.
    flops: "prod(S)"

NanToNumFwdOp:
  ref_api: "torch.nan_to_num"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      nan: {type: float, default: 0.0, kw_only: true}
      posinf: {type: "float | None", default: null, kw_only: true}
      neginf: {type: "float | None", default: null, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: T, shape: "[*S]"}

  workloads:
  - {S: [4096, 4096], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "elementwise-16M"}
  - {S: [16384, 16384], dtype_cases: [{T: float16}, {T: bfloat16}], label: "elementwise-256M"}

  roofline:
    # isnan + isposinf + isneginf + 3 conditional selects per element
    flops: "6 * prod(S)"
