# Unary activations and value-range transforms (clamp, nan_to_num).

ReLUFwdOp:
  ref_api: "torch.nn.functional.relu"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # Hidden-state activation (Llama-3.1-8B prefill)
  - {S: [2048, 4096], dtype_cases: [{T: float16}, {T: bfloat16}], label: "hidden-state-prefill"}
  - {S: [1, 4096], dtype_cases: [{T: bfloat16}], label: "hidden-state-decode"}

  roofline:
    # One compare-and-select per element.
    flops: "prod(S)"

GELUFwdOp:
  ref_api: "torch.nn.functional.gelu"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      approximate: {type: "'none' | 'tanh'", default: "none", kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: T, shape: "[*S]"}

  workloads:
  # Llama-3.1-8B FFN intermediate (hidden_dim=14336)
  - {S: [2048, 14336], dtype_cases: [{T: float16}, {T: bfloat16}], label: "llama-8b-ffn-prefill"}
  - {S: [1, 14336], dtype_cases: [{T: bfloat16}], label: "llama-8b-ffn-decode"}

  roofline:
    # Exact form 0.5 * x * (1 + erf(x / sqrt(2))): 5 per element; tanh form: 9.
    flops: "(9 if approximate == 'tanh' else 5) * prod(S)"

SiLUFwdOp:
  ref_api: "torch.nn.functional.silu"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # Llama-3.1-8B SwiGLU FFN intermediate
  - {S: [2048, 14336], dtype_cases: [{T: float16}, {T: bfloat16}], label: "llama-8b-ffn-prefill"}
  - {S: [1, 14336], dtype_cases: [{T: bfloat16}], label: "llama-8b-ffn-decode"}

  roofline:
    # sigmoid (neg, exp, add, recip) and one mul per element.
    flops: "5 * prod(S)"

HardswishFwdOp:
  ref_api: "torch.nn.functional.hardswish"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # MobileNetV3 stage activation map.
  - {S: [32, 96, 56, 56], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mbv3-stage2"}
  - {S: [32, 240, 28, 28], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mbv3-stage3"}

  roofline:
    # x * relu6(x + 3) / 6: add, clamp, mul, div per element.
    flops: "4 * prod(S)"

HardsigmoidFwdOp:
  ref_api: "torch.nn.functional.hardsigmoid"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # SE-block gating (B, C, 1, 1)
  - {S: [32, 240, 1, 1], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mbv3-se-gate"}
  - {S: [32, 960, 1, 1], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mbv3-se-gate-deep"}

  roofline:
    # relu6(x + 3) / 6: add, clamp, div per element.
    flops: "3 * prod(S)"

MishFwdOp:
  ref_api: "torch.nn.functional.mish"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # YOLO-style feature map activation
  - {S: [16, 256, 80, 80], dtype_cases: [{T: float16}, {T: bfloat16}], label: "yolo-p3"}
  - {S: [16, 512, 40, 40], dtype_cases: [{T: float16}, {T: bfloat16}], label: "yolo-p4"}

  roofline:
    # x * tanh(softplus(x)): exp, log1p, tanh, mul per element.
    flops: "4 * prod(S)"

SELUFwdOp:
  ref_api: "torch.nn.functional.selu"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # SNN-style fully connected activation
  - {S: [2048, 4096], dtype_cases: [{T: float16}, {T: bfloat16}], label: "snn-fc"}
  - {S: [2048, 8192], dtype_cases: [{T: float16}, {T: bfloat16}], label: "snn-fc-wide"}

  roofline:
    # Select, exp, sub, mul by alpha, mul by lambda per element.
    flops: "5 * prod(S)"

LeakyReLUFwdOp:
  ref_api: "torch.nn.functional.leaky_relu"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      negative_slope: {type: float, default: 0.01, kw_only: true}
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # GAN feature map activation
  - {S: [16, 256, 64, 64], dtype_cases: [{T: float16}, {T: bfloat16}], label: "gan-feat"}
  - {S: [16, 512, 32, 32], dtype_cases: [{T: float16}, {T: bfloat16}], label: "gan-feat-deep"}

  roofline:
    # Compare-and-select and mul per element.
    flops: "2 * prod(S)"

ELUFwdOp:
  ref_api: "torch.nn.functional.elu"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      alpha: {type: float, default: 1.0, kw_only: true}
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}

  workloads:
  # MLP hidden activation
  - {S: [2048, 4096], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mlp-hidden"}
  - {S: [2048, 8192], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mlp-hidden-wide"}

  roofline:
    # Select, exp, sub, mul per element.
    flops: "4 * prod(S)"

HardtanhFwdOp:
  ref_api: "torch.nn.functional.hardtanh"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      min_val: {type: float, default: -1.0, kw_only: true}
      max_val: {type: float, default: 1.0, kw_only: true}
      inplace: {type: bool, default: false, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]", mutated: inplace}
    outputs:
      output: {dtype: T, shape: "[*S]", alias: input}
    shape_rules:
    - "min_val <= max_val"
    - "representable(min_val, T)"
    - "representable(max_val, T)"

  workloads:
  # Quantization-friendly bounded activation
  - {S: [2048, 4096], dtype_cases: [{T: float16}, {T: bfloat16}], label: "bounded-hidden"}
  - {S: [16, 256, 56, 56], dtype_cases: [{T: float16}, {T: bfloat16}], label: "bounded-conv-feat"}

  roofline:
    # A two-sided clamp counts as one compare-and-select per element.
    flops: "prod(S)"

SoftplusFwdOp:
  ref_api: "torch.nn.functional.softplus"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      beta: {type: float, default: 1.0, kw_only: true}
      threshold: {type: float, default: 20.0, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: T, shape: "[*S]"}

  workloads:
  # Distribution-modeling MLP activation
  - {S: [2048, 4096], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mlp-hidden"}
  - {S: [2048, 8192], dtype_cases: [{T: float16}, {T: bfloat16}], label: "mlp-hidden-wide"}

  roofline:
    # mul by beta, threshold select, exp, log1p, div by beta per element.
    flops: "5 * prod(S)"

ClampFwdOp:
  # Each bound is a Number, a Tensor broadcast with input, or absent. At least one is passed,
  # and a Number bound never pairs with a Tensor one, as in torch.clamp's two overloads.
  ref_api: "torch.clamp"
  family: elementwise
  status: implemented

  signature:
    forall: {A: Shape, L: Shape, U: Shape, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      input: {dtype: T, shape: "[*A]"}
      min: {type: "Number | Tensor | None", dtype: T, shape: "[*L]", default: null}
      max: {type: "Number | Tensor | None", dtype: T, shape: "[*U]", default: null}
    outputs:
      output: {dtype: T, shape: "ClampOut[A, L, U, member(min) == 'Tensor', member(max) == 'Tensor']"}
    types:
      ClampOut:
        params: {A: Shape, L: Shape, U: Shape, tl: Bool, tu: Bool}
        match: [tl, tu]
        cases:
        - {when: [true, true], is: "[*broadcast(A, L, U)]"}
        - {when: [true, false], is: "[*broadcast(A, L)]"}
        - {when: [false, true], is: "[*broadcast(A, U)]"}
        - {when: [false, false], is: "[*A]"}
    shape_rules:
    - "present(min) or present(max)"
    - "member(min) != 'Number' or member(max) != 'Tensor'"
    - "member(min) != 'Tensor' or member(max) != 'Number'"
    - "member(min) != 'Number' or representable(min, T)"
    - "member(max) != 'Number' or representable(max, T)"

  workloads:
  - {A: [4096, 4096], L: [4096, 4096], U: [4096, 4096], some: [min, max], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "16M"}
  - {A: [16384, 16384], L: [16384, 16384], U: [16384, 16384], some: [min, max], dtype_cases: [{T: float16}, {T: bfloat16}], label: "256M"}
  - {A: [4096, 4096], L: [4096, 4096], some: [min], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "16M-min-only"}
  - {A: [16384, 16384], L: [16384, 16384], some: [min], dtype_cases: [{T: float16}, {T: bfloat16}], label: "256M-min-only"}
  - {A: [4096, 4096], U: [4096, 4096], some: [max], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "16M-max-only"}
  - {A: [16384, 16384], U: [16384, 16384], some: [max], dtype_cases: [{T: float16}, {T: bfloat16}], label: "256M-max-only"}
  - {A: [16, 256, 56, 56], L: [256, 1, 1], U: [256, 1, 1], some: [min, max], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "cnn-feat-channel-bounds"}
  - {A: [4096, 4096], min: -0.5, max: 0.5, dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "16M-number"}
  - {A: [16384, 16384], min: -0.5, max: 0.5, dtype_cases: [{T: float16}, {T: bfloat16}], label: "256M-number"}
  - {A: [4096, 4096], min: -0.5, dtype_cases: [{T: float16}], label: "16M-number-min-only"}
  - {A: [4096, 4096], max: 0.5, dtype_cases: [{T: float16}], label: "16M-number-max-only"}

  roofline:
    # One compare-and-select per output element, whichever bounds apply.
    flops: "prod(broadcast(A, L, U)) if member(min) == 'Tensor' and member(max) == 'Tensor' else prod(broadcast(A, L)) if member(min) == 'Tensor' else prod(broadcast(A, U)) if member(max) == 'Tensor' else prod(A)"

NanToNumFwdOp:
  ref_api: "torch.nan_to_num"
  family: elementwise
  status: implemented

  signature:
    forall: {S: Shape, T: "DType[float16 | bfloat16 | float32]"}
    params:
      nan: {type: float, default: 0.0, kw_only: true}
      posinf: {type: "float | None", default: null, kw_only: true}
      neginf: {type: "float | None", default: null, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*S]"}
    outputs:
      output: {dtype: T, shape: "[*S]"}

  workloads:
  - {S: [4096, 4096], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "16M"}
  - {S: [16384, 16384], dtype_cases: [{T: float16}, {T: bfloat16}], label: "256M"}

  roofline:
    # One compare-and-select per replaced class; the default infinities are one two-bound clamp.
    flops: "(2 if not present(posinf) and not present(neginf) else 3) * prod(S)"
