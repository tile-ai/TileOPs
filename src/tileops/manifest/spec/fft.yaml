# The complex-to-complex FFT.

FFTC2CFwdOp:
  # A power of two from 1 through 2**28 is exactly a positive divisor of 2**28.
  ref_api: torch.fft.fft
  family: fft
  status: implemented

  signature:
    forall: {B: Shape, n: Dim, T: "DType[complex64 | complex128]"}
    inputs:
      input: {dtype: T, shape: "[*B, n]"}
    outputs:
      output: {dtype: T, shape: "[*B, n]"}
    shape_rules:
    - "n > 0 and 268435456 % n == 0"

  workloads:
  # A representative three-pass single-CTA length; the unbatched row is its
  # latency tier and the two batch-64 rows cover both dtypes.
  - {B: [], n: 4096, dtype_cases: [{T: complex64}], label: 4k-unbatched}
  - {B: [64], n: 4096, dtype_cases: [{T: complex64}], label: 4k-b64}
  - {B: [64], n: 4096, dtype_cases: [{T: complex128}], label: 4k-b64}
  # FlashFFTConv / Hyena long convolution, where the transform length is 2*L:
  # 16384 is a sequence of 8192, run in one CTA; 65536 is a sequence of 32768, decomposed.
  - {B: [64], n: 16384, dtype_cases: [{T: complex64}], label: longconv-16k}
  - {B: [8], n: 65536, dtype_cases: [{T: complex64}], label: longconv-64k}
  # Audio spectrogram: 256 frames of an n_fft = 1024 window.
  - {B: [256], n: 1024, dtype_cases: [{T: complex64}], label: spectrogram-b256}
  # FNet token mixing along a 512-token sequence, batch x hidden flattened into
  # the 4096 rows.
  - {B: [4096], n: 512, dtype_cases: [{T: complex64}], label: fnet}
  # Per-channel short convolution. Also the row whose batch axis is past CUDA's
  # 65535 grid.y limit, which the kernels avoid by putting the batch on grid.x.
  - {B: [65536], n: 64, dtype_cases: [{T: complex64}], label: shortconv}
  # Double-precision scientific transform: 2**20 at complex128, decomposed 1024*1024.
  - {B: [4], n: 1048576, dtype_cases: [{T: complex128}], label: 1m}
  # The same window over 300 frames: a batch that is not a power of two.
  - {B: [300], n: 1024, dtype_cases: [{T: complex64}], label: spectrogram-b300}

  roofline:
    func: tileops.perf.formulas.fft_c2c_roofline
