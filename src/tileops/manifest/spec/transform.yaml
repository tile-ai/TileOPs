# transform.yaml -- manifest entries for the 'transform' family.
#
# Orthogonal transforms along one axis. The quantization that follows one lives in
# `quantization.yaml`.

HadamardTransformFwdOp:
  # Fast Walsh-Hadamard transform along the last axis, scaled by 1 / sqrt(n). `n` is
  # `base_order` times a power of two.
  family: transform
  status: spec-only
  signature:
    forall: {B: Shape, n: Dim, T: "DType[float16 | bfloat16]"}
    params:
      base_order: {type: int, default: 1}
    inputs:
      x: {dtype: T, shape: "[*B, n]"}
    outputs:
      output: {dtype: T, shape: "[*B, n]"}
    shape_rules:
    # The orders below 64 at which a Hadamard matrix is known and small enough to hold
    # in registers; `base_order == 1` is the plain radix-2 transform.
    - "base_order == 1 or base_order == 12 or base_order == 20 or base_order == 28 or base_order == 40"
    - "n > 0 and n % base_order == 0"
    # 2 ** 28, so the quotient is a power of two no larger than the largest row served.
    - "268435456 % (n // base_order) == 0"
  workloads:
  - {B: [4096], n: 4096, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-prefill}
  - {B: [64], n: 4096, dtype_cases: [{T: bfloat16}], label: llama-8b-decode}
  - {B: [4096], n: 8192, dtype_cases: [{T: bfloat16}], label: llama-70b-prefill}
  - {B: [64], n: 8192, dtype_cases: [{T: bfloat16}], label: llama-70b-decode}
  - {B: [262144], n: 128, dtype_cases: [{T: bfloat16}], label: llama3-head-dim}
  - {B: [2048], n: 2560, base_order: 20, dtype_cases: [{T: bfloat16}], label: non-pow2-order20}
  roofline:
    func: tileops.perf.formulas.hadamard_roofline
