# elementwise_multi_input.yaml -- manifest entries for elementwise ops with
# 3+ input tensors.
#
# Source of truth for op interfaces in this family. Loaded and merged with
# other family files by tileops.manifest at runtime. See docs/design/manifest.md
# for the full schema.

WhereFwdOp:
  ref_api: "torch.where"
  family: elementwise
  status: implemented

  signature:
    # PyTorch's torch.where broadcasts condition/input/other together;
    # the output shape is the broadcast of all three.
    forall: {C: Shape, A: Shape, B: Shape, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      condition: {dtype: bool, shape: "[*C]"}
      input: {dtype: T, shape: "[*A]"}
      other: {dtype: T, shape: "[*B]"}
    outputs:
      output: {dtype: T, shape: "[*broadcast(C, A, B)]"}

  workloads:
  - {C: [4096, 4096], A: [4096, 4096], B: [4096, 4096], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "16M"}
  - {C: [16384, 16384], A: [16384, 16384], B: [16384, 16384], dtype_cases: [{T: float16}, {T: bfloat16}], label: "256M"}
  - {C: [512, 512], A: [8, 16, 512, 512], B: [], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "attn-causal-mask"}

  roofline:
    flops: "prod(broadcast(C, A, B))"

LerpTensorFwdOp:
  # Tensor-weight variant: weight is a tensor that broadcasts together
  # with input and end (PyTorch's torch.lerp(input, end, weight: Tensor)
  # overload). Implements the 3-way tensor broadcast variant; an operand
  # that broadcasts is read where it lies, at stride 0, not expanded first.
  ref_api: "torch.lerp"
  family: elementwise
  status: implemented

  signature:
    forall: {A: Shape, E: Shape, W: Shape, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      input: {dtype: T, shape: "[*A]"}
      end: {dtype: T, shape: "[*E]"}
      weight: {dtype: T, shape: "[*W]"}
    outputs:
      output: {dtype: T, shape: "[*broadcast(A, E, W)]"}

  workloads:
  - {A: [4096, 4096], E: [4096, 4096], W: [4096, 4096], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "16M"}
  - {A: [16384, 16384], E: [16384, 16384], W: [16384, 16384], dtype_cases: [{T: float16}, {T: bfloat16}], label: "256M"}
  - {A: [16, 256, 56, 56], E: [16, 256, 56, 56], W: [256, 1, 1], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "cnn-feat-channel-weight"}
  - {A: [4096, 4096], E: [4096, 4096], W: [], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "16M-scalar-weight"}

  roofline:
    flops: "3 * prod(broadcast(A, E, W))"
