# Fused gated activations y = activation(gate) * value, with gate and value the two halves of
# one (M, 2*N) input.

SiLUAndMulFwdOp:
  # A positive swiglu_limit first clamps gate to <= limit and value to [-limit, limit], as vLLM
  # SiluAndMulWithClamp does; scale multiplies each row before the one rounding to T, as
  # DeepSeek-V4-Flash Expert.forward applies its routing weights.
  family: elementwise
  status: implemented
  ref_api: flashinfer.activation.silu_and_mul

  signature:
    forall: {M: Dim, N: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      swiglu_limit: {type: float, default: 0.0}
    inputs:
      input: {dtype: T, shape: "[M, 2 * N]"}
      scale: {dtype: float32, shape: "[M]", type: "Tensor | None", default: null, kw_only: true}
    outputs:
      output: {dtype: T, shape: "[M, N]"}

  workloads:
  # SwiGLU FFN intermediate (Llama-3.1-8B, hidden_dim=14336)
  - {M: 2048, N: 14336, dtype_cases: [{T: float16}, {T: bfloat16}], label: "llama-8b-ffn-prefill"}
  - {M: 1, N: 14336, dtype_cases: [{T: bfloat16}], label: "llama-8b-ffn-decode"}
  - {M: 32, N: 12288, dtype_cases: [{T: bfloat16}], label: qwen3-8b-swiglu-b32}
  # DeepSeek-V4-Flash experts, intermediate 2048, limit 10: the routed rows of 1, 4096 and
  # 32768 tokens at top 6, scaled by their routing weights, and the shared expert's 4096 tokens.
  - {M: 6, N: 2048, swiglu_limit: 10.0, some: [scale], dtype_cases: [{T: bfloat16}], label: dsv4-flash-routed-t1}
  - {M: 24576, N: 2048, swiglu_limit: 10.0, some: [scale], dtype_cases: [{T: bfloat16}], label: dsv4-flash-routed-4k}
  - {M: 196608, N: 2048, swiglu_limit: 10.0, some: [scale], dtype_cases: [{T: bfloat16}], label: dsv4-flash-routed-32k}
  - {M: 4096, N: 2048, swiglu_limit: 10.0, dtype_cases: [{T: bfloat16}], label: dsv4-flash-shared-4k}

  roofline:
    # Per element: sigmoid (4) and two muls (2), plus the two clamps under a limit and the row scale.
    flops: "(6 + (2 if swiglu_limit > 0 else 0) + (1 if present(scale) else 0)) * M * N"

GELUAndMulFwdOp:
  family: elementwise
  status: implemented
  ref_api: vllm.model_executor.layers.activation.GeluAndMul

  signature:
    forall: {M: Dim, N: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      approximate: {type: "'none' | 'tanh'", default: "none", kw_only: true}
    inputs:
      input: {dtype: T, shape: "[M, 2 * N]"}
    outputs:
      output: {dtype: T, shape: "[M, N]"}

  workloads:
  - {M: 2048, N: 14336, dtype_cases: [{T: float16}, {T: bfloat16}], label: "llama-8b-ffn-prefill"}
  - {M: 1, N: 14336, dtype_cases: [{T: bfloat16}], label: "llama-8b-ffn-decode"}
  - {M: 2048, N: 14336, approximate: tanh, dtype_cases: [{T: float16}, {T: bfloat16}], label: "llama-8b-prefill-tanh"}
  - {M: 1, N: 14336, approximate: tanh, dtype_cases: [{T: bfloat16}], label: "llama-8b-decode-tanh"}

  roofline:
    # Per element, the mul by value included: the erf form costs 6, the tanh form 10.
    flops: "(10 if approximate == 'tanh' else 6) * M * N"
