# elementwise_fused_gated.yaml -- manifest entries for fused gated activation
# ops: y = activation(gate) * value, with gate/value packed as the two halves
# of a single (M, 2*N) input tensor.

SiLUAndMulFwdOp:
  # Composite expression: F.silu(gate) * value where input = [gate, value]
  # along the last dim, input.shape == (M, 2*N). No single torch.* symbol.
  family: elementwise
  status: implemented
  ref_api: flashinfer.activation.silu_and_mul

  signature:
    forall: {M: Dim, N: Dim, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      input: {dtype: T, shape: "[M, 2 * N]"}
    outputs:
      output: {dtype: T, shape: "[M, N]"}

  workloads:
  # SwiGLU FFN intermediate (Llama-3.1-8B, hidden_dim=14336)
  - {M: 2048, N: 14336, dtype_cases: [{T: float16}, {T: bfloat16}], label: "llama-8b-ffn-prefill"}
  - {M: 1, N: 14336, dtype_cases: [{T: bfloat16}], label: "llama-8b-ffn-decode"}
  - {M: 32, N: 12288, dtype_cases: [{T: bfloat16}], label: qwen3-8b-swiglu-b32}

  roofline:
    # FLOPs: silu(gate) = gate * sigmoid(gate); sigmoid = neg + exp + add +
    # recip = 4. silu adds one mul (= 5). Final mul-by-value = 1. Total 6
    # per output element. N output elements per row, M rows.
    flops: "6 * M * N"

GELUAndMulFwdOp:
  # Composite expression: F.gelu(gate, approximate=approximate) * value where
  # input = [gate, value] along the last dim, input.shape == (M, 2*N).
  # No single torch.* symbol.
  family: elementwise
  status: implemented
  ref_api: vllm.model_executor.layers.activation.GeluAndMul

  signature:
    forall: {M: Dim, N: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      approximate: {type: "'none' | 'tanh'", default: "none", kw_only: true}
    inputs:
      input: {dtype: T, shape: "[M, 2 * N]"}
    outputs:
      output: {dtype: T, shape: "[M, N]"}

  workloads:
  - {M: 2048, N: 14336, dtype_cases: [{T: float16}, {T: bfloat16}], label: "llama-8b-ffn-prefill"}
  - {M: 1, N: 14336, dtype_cases: [{T: bfloat16}], label: "llama-8b-ffn-decode"}
  - {M: 2048, N: 14336, approximate: tanh, dtype_cases: [{T: float16}, {T: bfloat16}], label: "llama-8b-prefill-tanh"}
  - {M: 1, N: 14336, approximate: tanh, dtype_cases: [{T: bfloat16}], label: "llama-8b-decode-tanh"}

  roofline:
    # FLOPs per output element, the final mul-by-value (1) included. Exact form
    # gate * 0.5 * (1 + erf(gate / sqrt(2))): div, erf, add, mul-by-half, mul-by-gate
    # (5), total 6. Tanh form 0.5 * g * (1 + tanh(sqrt(2/pi) * (g + 0.044715 * g^3))):
    # cube (2), mul-coeff, add, mul-sqrt, tanh, add, mul-half, mul-by-gate (9), total 10.
    flops: "(10 if approximate == 'tanh' else 6) * M * N"
