# mamba.yaml -- manifest entries for the 'mamba' (Mamba-2 / SSD) family.
#
# Reference: Dao & Gu, "Transformers are SSMs: Generalized Models and
# Efficient Algorithms Through Structured State Space Duality" (Mamba-2),
# arXiv:2405.21060. Signatures follow the staged decomposition of
# mamba_ssm.ops.triton.ssd_combined.mamba_chunk_scan_combined; no single public
# API covers these stages, so no entry names a `ref_api`.
#
# Index names shared across this family:
#   B  batch       S  seq_len     H  n_heads     P  d_head
#   N  d_state     G  n_groups    NC num_chunks  Q  chunk_len
# Workload shapes follow the public Mamba-2 model sizes
# (780M: H=48, 1.3B: H=64, 2.7B: H=80; P=64, N=128, Q=256, G=1).

SSDChunkCumsumFwdOp:
  # dt preprocessing (optional per-head bias, optional softplus, clamp) and the
  # chunk-local inclusive prefix sum of dA = dt * A. dA_cumsum is computed from
  # the float32 dt before dt_out is cast to out_dtype.
  family: mamba
  status: implemented
  ref_api: mamba_ssm.ops.triton.ssd_chunk_state._chunk_cumsum_fwd
  signature:
    forall: {B: Dim, S: Dim, H: Dim}
    params:
      chunk_size: {type: int}
      out_dtype: {type: "float16 | bfloat16 | float32", default: float32}
      dt_softplus: {type: bool, default: false}
      dt_min: {type: float, default: 0.0}
      dt_max: {type: float, default: .inf}
    inputs:
      dt: {dtype: float32, shape: "[B, S, H]"}
      A: {dtype: float32, shape: "[H]"}
      dt_bias: {dtype: float32, shape: "[H]", type: "Tensor | None", default: null}
    outputs:
      dt_out: {dtype: out_dtype, shape: "[B, H, NC, chunk_size]"}
      dA_cumsum: {dtype: float32, shape: "[B, H, NC, chunk_size]"}
    let: {NC: "S // chunk_size"}
    shape_rules:
    - "B > 0 and S > 0 and H > 0"
    - "chunk_size > 0 and S % chunk_size == 0"
  workloads:
  - {B: 1, S: 4096, H: 48, chunk_size: 256, out_dtype: float16, dt_softplus: true, label: mamba2-780m}
  - {B: 8, S: 2048, H: 64, chunk_size: 256, out_dtype: bfloat16, dt_softplus: true, label: mamba2-1p3b}
  - {B: 1, S: 4096, H: 48, chunk_size: 256, out_dtype: float16, dt_softplus: true, some: [dt_bias], label: mamba2-780m-dt-bias}
  - {B: 8, S: 2048, H: 64, chunk_size: 256, out_dtype: bfloat16, dt_softplus: true, some: [dt_bias], label: mamba2-1p3b-dt-bias}
  - {B: 2, S: 32768, H: 80, chunk_size: 256, out_dtype: float16, dt_softplus: true, some: [dt_bias], label: mamba2-2p7b}
  roofline:
    # clamp, dt * A and the cumsum add per token; the bias add and softplus
    # (4 flops) when present.
    flops: "(3 + (1 if present(dt_bias) else 0) + (4 if dt_softplus else 0)) * B * S * H"

SSDChunkCouplingFwdOp:
  # Causal C@B coupling matrix per chunk and group:
  #   cb[b, c, g, l, s] = sum_n C[b, c*Q+l, g, n] * B[b, c*Q+s, g, n] for s <= l, else 0.
  family: mamba
  status: implemented
  ref_api: mamba_ssm.ops.triton.ssd_bmm._bmm_chunk_fwd
  signature:
    forall: {Bsz: Dim, S: Dim, G: Dim, N: Dim, T: "DType[float16 | bfloat16]"}
    params:
      chunk_size: {type: int}
    inputs:
      C: {dtype: T, shape: "[Bsz, S, G, N]"}
      B: {dtype: T, shape: "[Bsz, S, G, N]"}
    outputs:
      cb: {dtype: T, shape: "[Bsz, NC, G, chunk_size, chunk_size]"}
    let: {NC: "S // chunk_size"}
    shape_rules:
    - "Bsz > 0 and S > 0 and G > 0 and N > 0"
    - "chunk_size > 0 and S % chunk_size == 0"
  workloads:
  - {Bsz: 1, S: 4096, G: 1, N: 128, chunk_size: 256, dtype_cases: [{T: float16}], label: mamba2-780m}
  - {Bsz: 4, S: 2048, G: 1, N: 128, chunk_size: 256, dtype_cases: [{T: bfloat16}], label: mamba2-2p7b}
  - {Bsz: 3, S: 3072, G: 8, N: 128, chunk_size: 256, dtype_cases: [{T: float16}], label: mamba2-grouped-prefill}
  roofline:
    # Causal masking halves the 2 * Q * Q * N contraction per (batch, chunk, group).
    flops: "Bsz * NC * G * chunk_size * chunk_size * N"

SSDChunkStateFwdOp:
  # Per-chunk SSM state: decay-weighted (P x Q) @ (Q x N) per (batch, chunk,
  # head). seq_idx, when passed, masks contributions from another sequence.
  # dt is taken in x's dtype (as Mamba2FwdOp passes it) or in float32 (as
  # mamba_ssm's _chunk_cumsum_fwd produces it).
  family: mamba
  status: implemented
  ref_api: mamba_ssm.ops.triton.ssd_chunk_state._chunk_state_fwd
  signature:
    forall: {Bsz: Dim, NC: Dim, Q: Dim, H: Dim, P: Dim, G: Dim, N: Dim, T: "DType[float16 | bfloat16]", TD: "DType[float16 | bfloat16 | float32]"}
    inputs:
      x: {dtype: T, shape: "[Bsz, NC * Q, H, P]"}
      B: {dtype: T, shape: "[Bsz, NC * Q, G, N]"}
      dt: {dtype: TD, shape: "[Bsz, H, NC, Q]"}
      dA_cumsum: {dtype: float32, shape: "[Bsz, H, NC, Q]"}
      seq_idx: {dtype: int32, shape: "[Bsz, NC * Q]", type: "Tensor | None", default: null}
    outputs:
      states: {dtype: float32, shape: "[Bsz, NC, H, P, N]"}
    shape_rules:
    - "Bsz > 0 and NC > 0 and Q > 0 and H > 0 and P > 0 and N > 0"
    - "G > 0 and H % G == 0"
    dtype_combos:
    - {T: float16, TD: float16}
    - {T: float16, TD: float32}
    - {T: bfloat16, TD: bfloat16}
    - {T: bfloat16, TD: float32}
  workloads:
  - {Bsz: 1, NC: 16, Q: 256, H: 48, P: 64, G: 1, N: 128, dtype_cases: [{T: float16, TD: float32}, {T: bfloat16, TD: float32}], label: mamba2-780m}
  - {Bsz: 4, NC: 8, Q: 256, H: 80, P: 64, G: 1, N: 128, dtype_cases: [{T: bfloat16, TD: float32}], label: mamba2-2p7b}
  - {Bsz: 1, NC: 16, Q: 256, H: 48, P: 64, G: 1, N: 128, some: [seq_idx], dtype_cases: [{T: float16, TD: float32}, {T: bfloat16, TD: float32}], label: mamba2-780m-seq-idx}
  - {Bsz: 2, NC: 128, Q: 256, H: 64, P: 64, G: 1, N: 128, some: [seq_idx], dtype_cases: [{T: float16, TD: float32}], label: mamba2-1p3b}
  roofline:
    # The (P x Q) @ (Q x N) contraction, the per-token decay weight and the x row scaling.
    flops: "2 * Bsz * NC * H * P * N * Q + 4 * Bsz * NC * Q * H + Bsz * NC * Q * H * P"

SSDStatePassingFwdOp:
  # Inter-chunk recurrent scan over a flattened state dimension:
  #   s_c = exp(dA_chunk_cumsum[b, h, c]) * s_{c-1} + states[b, c, h, :],
  # starting from initial_states, or from zero when it is not passed.
  # prev_states[:, c] is the state entering chunk c. In the Mamba-2 pipeline N
  # is the flattened d_head * d_state.
  family: mamba
  status: implemented
  ref_api: mamba_ssm.ops.triton.ssd_state_passing._state_passing_fwd
  signature:
    forall: {B: Dim, NC: Dim, H: Dim, N: Dim, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      states: {dtype: T, shape: "[B, NC, H, N]"}
      dA_chunk_cumsum: {dtype: float32, shape: "[B, H, NC]"}
      initial_states: {dtype: float32, shape: "[B, H, N]", type: "Tensor | None", default: null}
    outputs:
      prev_states: {dtype: float32, shape: "[B, NC, H, N]"}
      final_states: {dtype: float32, shape: "[B, H, N]"}
    shape_rules:
    - "B > 0 and NC > 0 and H > 0 and N > 0"
  workloads:
  - {B: 1, NC: 16, H: 64, N: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: mamba2-1p3b}
  - {B: 2, NC: 128, H: 80, N: 128, dtype_cases: [{T: float16}], label: mamba2-2p7b}
  - {B: 1, NC: 16, H: 64, N: 128, some: [initial_states], dtype_cases: [{T: float16}, {T: bfloat16}], label: mamba2-1p3b-init}
  # Flattened d_head * d_state = 8192 as produced inside Mamba2FwdOp.
  - {B: 1, NC: 16, H: 64, N: 8192, some: [initial_states], dtype_cases: [{T: float32}], label: mamba2-1p3b-flat}
  roofline:
    # A multiply-add per state element, one exp per (batch, head, chunk).
    flops: "2 * B * NC * H * N + B * H * NC"

SSDChunkScanFwdOp:
  # Fused SSD chunk output: the history term exp(dA[l]) * (C[l] @ prev_states)
  # plus the causal intra-chunk term sum_{s <= l} cb[l, s] * exp(dA[l] - dA[s]) * dt[s] * x[s].
  family: mamba
  status: implemented
  ref_api: mamba_ssm.ops.triton.ssd_chunk_scan._chunk_scan_fwd
  signature:
    forall: {B: Dim, NC: Dim, Q: Dim, H: Dim, P: Dim, G: Dim, N: Dim, T: "DType[float16 | bfloat16]"}
    inputs:
      x: {dtype: T, shape: "[B, NC * Q, H, P]"}
      cb: {dtype: T, shape: "[B, NC, G, Q, Q]"}
      dA_cumsum: {dtype: float32, shape: "[B, H, NC, Q]"}
      C: {dtype: T, shape: "[B, NC * Q, G, N]"}
      prev_states: {dtype: float32, shape: "[B, NC, H, P, N]"}
      dt: {dtype: T, shape: "[B, H, NC, Q]"}
    outputs:
      y: {dtype: float32, shape: "[B, NC * Q, H, P]"}
    shape_rules:
    - "B > 0 and NC > 0 and Q > 0 and H > 0 and P > 0 and N > 0"
    - "G > 0 and H % G == 0"
  workloads:
  - {B: 1, NC: 16, Q: 256, H: 48, P: 64, G: 1, N: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: mamba2-780m}
  - {B: 4, NC: 8, Q: 256, H: 80, P: 64, G: 1, N: 128, dtype_cases: [{T: bfloat16}], label: mamba2-2p7b}
  - {B: 2, NC: 128, Q: 256, H: 64, P: 64, G: 1, N: 128, dtype_cases: [{T: float16}], label: mamba2-1p3b}
  roofline:
    # History: a (1 x N) @ (N x P) per token and head; intra-chunk: the causal
    # (Q x Q) @ (Q x P) per (batch, chunk, head), halved by the mask.
    flops: "2 * B * NC * Q * H * N * P + B * NC * H * Q * Q * P"

SSDRecurrentFwdOp:
  # Single-token Mamba-2 SSD decode step. y is the only returned tensor;
  # state is updated in place. The D * x skip connection and z-gate are not
  # fused here.
  family: mamba
  status: implemented
  ref_api: mamba_ssm.ops.triton.selective_state_update.selective_state_update
  signature:
    forall: {Bsz: Dim, H: Dim, P: Dim, G: Dim, N: Dim, T: "DType[float16 | bfloat16]"}
    inputs:
      A: {dtype: float32, shape: "[H, P, N]"}
      dt: {dtype: float32, shape: "[Bsz, H, P]"}
      x: {dtype: T, shape: "[Bsz, H, P]"}
      B: {dtype: T, shape: "[Bsz, G, N]"}
      C: {dtype: T, shape: "[Bsz, G, N]"}
      state: {dtype: float32, shape: "[Bsz, H, P, N]", mutated: true, contiguous: true}
    outputs:
      y: {dtype: float32, shape: "[Bsz, H, P]"}
    shape_rules:
    - "Bsz > 0 and H > 0 and P > 0 and N > 0"
    - "G > 0 and H % G == 0"
  workloads:
  - {Bsz: 1, H: 64, P: 64, G: 1, N: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: mamba2-1p3b}
  - {Bsz: 8, H: 80, P: 64, G: 1, N: 128, dtype_cases: [{T: float16}], label: mamba2-2p7b}
  - {Bsz: 32, H: 48, P: 64, G: 1, N: 128, dtype_cases: [{T: float16}], label: mamba2-780m}
  roofline:
    # Per state element: dt * A, exp, dt * x * B (two products), the decay
    # multiply, the state add and the multiply-add against C.
    flops: "8 * Bsz * H * P * N"

Mamba2FwdOp:
  # End-to-end Mamba-2 SSD forward: SSDChunkCumsum -> SSDChunkCoupling -> SSDChunkState ->
  # SSDStatePassing -> SSDChunkScan. Follows
  # mamba_ssm.ops.triton.ssd_combined.mamba_chunk_scan_combined with one
  # deviation: final_states is always returned (chunked prefill consumes the
  # carried state), so the upstream return_final_states switch does not exist.
  # dt_bias is added to dt in the SSDChunkCumsum stage; initial_states seeds the
  # inter-chunk scan. The batch index is Bsz because B names a tensor.
  family: mamba
  status: implemented
  ref_api: mamba_ssm.ops.triton.ssd_combined.mamba_chunk_scan_combined
  signature:
    forall: {Bsz: Dim, S: Dim, H: Dim, P: Dim, G: Dim, N: Dim, T: "DType[float16 | bfloat16]"}
    params:
      chunk_size: {type: int, default: 256}
      dt_softplus: {type: bool, default: true}
    inputs:
      x: {dtype: T, shape: "[Bsz, S, H, P]"}
      dt: {dtype: float32, shape: "[Bsz, S, H]"}
      A: {dtype: float32, shape: "[H]"}
      B: {dtype: T, shape: "[Bsz, S, G, N]"}
      C: {dtype: T, shape: "[Bsz, S, G, N]"}
      dt_bias: {dtype: float32, shape: "[H]", type: "Tensor | None", default: null}
      initial_states: {dtype: float32, shape: "[Bsz, H, P, N]", type: "Tensor | None", default: null}
    outputs:
      y: {dtype: float32, shape: "[Bsz, S, H, P]"}
      final_states: {dtype: float32, shape: "[Bsz, H, P, N]"}
    let: {NC: "S // chunk_size"}
    shape_rules:
    - "Bsz > 0 and S > 0 and H > 0 and P > 0 and N > 0"
    - "chunk_size > 0 and S % chunk_size == 0"
    - "G > 0 and H % G == 0"
  workloads:
  - {Bsz: 1, S: 2048, H: 80, P: 64, G: 1, N: 128, dtype_cases: [{T: bfloat16}], label: mamba2-2p7b}
  - {Bsz: 1, S: 8192, H: 64, P: 64, G: 1, N: 128, dtype_cases: [{T: float16}], label: mamba2-1p3b}
  - {Bsz: 1, S: 2048, H: 80, P: 64, G: 1, N: 128, some: [dt_bias], dtype_cases: [{T: bfloat16}], label: mamba2-2p7b-dt-bias}
  - {Bsz: 1, S: 8192, H: 64, P: 64, G: 1, N: 128, some: [dt_bias], dtype_cases: [{T: float16}], label: mamba2-1p3b-dt-bias}
  - {Bsz: 1, S: 2048, H: 80, P: 64, G: 1, N: 128, some: [initial_states], dtype_cases: [{T: bfloat16}], label: mamba2-2p7b-init}
  - {Bsz: 1, S: 8192, H: 64, P: 64, G: 1, N: 128, some: [initial_states], dtype_cases: [{T: float16}], label: mamba2-1p3b-init}
  - {Bsz: 1, S: 2048, H: 80, P: 64, G: 1, N: 128, some: [dt_bias, initial_states], dtype_cases: [{T: bfloat16}], label: mamba2-2p7b-dt-bias-init}
  - {Bsz: 1, S: 8192, H: 64, P: 64, G: 1, N: 128, some: [dt_bias, initial_states], dtype_cases: [{T: float16}], label: mamba2-1p3b-dt-bias-init}
  roofline:
    # The sum of the five stages' counts: SSDChunkCumsum, SSDChunkCoupling, SSDChunkState,
    # SSDStatePassing over the flattened P * N state, SSDChunkScan.
    flops: >-
      (3 + (1 if present(dt_bias) else 0) + (4 if dt_softplus else 0)) * Bsz * S * H
      + Bsz * NC * G * chunk_size * chunk_size * N
      + 2 * Bsz * S * H * P * N + 4 * Bsz * S * H + Bsz * S * H * P
      + 2 * Bsz * NC * H * P * N + Bsz * H * NC
      + 2 * Bsz * S * H * N * P + Bsz * NC * H * chunk_size * chunk_size * P
  composition:
    kind: composite
    stages:
    - {name: ssd_chunk_cumsum_float16, op: SSDChunkCumsumFwdOp}
    - {name: ssd_chunk_cumsum_bfloat16, op: SSDChunkCumsumFwdOp}
    - {name: ssd_chunk_coupling, op: SSDChunkCouplingFwdOp}
    - {name: chunk_state, op: SSDChunkStateFwdOp}
    - {name: state_passing, op: SSDStatePassingFwdOp}
    - {name: chunk_scan, op: SSDChunkScanFwdOp}
CausalConv1dFwdOp:
  # Not vLLM's causal_conv1d_fn: dilation spaces the filter taps dilation tokens apart, so a
  # state holds the last (W - 1) * dilation tokens (transformers Qwen4ExpTextPLELayer short
  # conv, F.conv1d(..., dilation=3, groups=D)). A float32 weight and bias convolve the
  # activations upcast to float32 (transformers modeling_glm5_next causal_conv1d_fn, conv1d
  # kept in float32). With cache_indices, conv_state is a pool of P states and sequence b
  # reads and writes conv_state[cache_indices[b]], the slots other than -1 distinct across the
  # call. A slot of -1 (vLLM's pad_slot_id) is never written and its sequence's
  # outputs are unspecified; every other slot index names a state, vLLM's null slot 0 is not
  # declared. A state is the first (W - 1) * dilation tokens of its L columns, the rest not
  # touched.
  family: mamba
  status: implemented
  ref_api: vllm.model_executor.layers.mamba.ops.causal_conv1d.causal_conv1d_fn
  signature:
    types:
      States:
        params: {pooled: Bool, B: Dim, P: Dim, D: Dim, L: Dim}
        match: pooled
        cases:
        - {when: false, is: "[B, D, L]"}
        - {when: true, is: "[P, D, L]"}
    forall:
      B: Dim
      D: Dim
      W: Dim
      Tt: Dim
      L: Dim
      P: Dim
      T: "DType[float16 | bfloat16]"
      Tw: "DType[float16 | bfloat16 | float32]"
      seq_lens: "Seq[Int]"
    params:
      activation: {type: "'silu' | None", default: silu}
      dilation: {type: int, default: 1, kw_only: true}
      validate_inputs: {type: bool, default: false, kw_only: true}
    inputs:
      # Token-major, the sequences packed along Tt: the layout the Mamba block's input
      # projection produces. The ref_api takes the (D, Tt) transposed view of this storage.
      x: {dtype: T, shape: "[Tt, D]"}
      weight: {dtype: Tw, shape: "[D, W]"}
      # The (W - 1) * dilation tokens preceding each sequence. Read for a sequence whose
      # has_initial_state is true, and overwritten with that sequence's own tail; an empty
      # sequence keeps its state.
      conv_state: {dtype: T, shape: "States[present(cache_indices), B, P, D, L]", mutated: true, contiguous: true}
      cu_seqlens: {dtype: int32, shape: "[B + 1]", values: "prefix_sum(seq_lens)", requires: ["prefix_offsets(Tt)"]}
      bias: {dtype: Tw, shape: "[D]", type: "Tensor | None"}
      has_initial_state: {dtype: bool, shape: "[B]", type: "Tensor | None", default: null}
      cache_indices: {dtype: int32, shape: "[B]", type: "Tensor | None", default: null, kw_only: true, values: "sample_indices(B, P)", requires: ["in_range(-1, P)"]}
    outputs:
      output: {dtype: T, shape: "[Tt, D]"}
    dtype_combos:
    - {T: float16, Tw: float16}
    - {T: bfloat16, Tw: bfloat16}
    - {T: float16, Tw: float32}
    - {T: bfloat16, Tw: float32}
    shape_rules:
      - "B > 0 and D > 0 and Tt > 0"
      - "W >= 2 and W <= 4"
      - "dilation >= 1"
      - "L >= (W - 1) * dilation"
  roofline:
    flops: "2 * D * Tt * W"
    # (W - 1) * dilation tokens of each sequence's state are written, and read where
    # has_initial_state is passed.
    bytes: >-
      bytes(x) + bytes(weight) + bytes(cu_seqlens) + bytes(output)
      + (bytes(bias) if present(bias) else 0)
      + (bytes(has_initial_state) if present(has_initial_state) else 0)
      + (bytes(cache_indices) if present(cache_indices) else 0)
      + (2 if present(has_initial_state) else 1) * bytes(conv_state) * B * (W - 1) * dilation // ((P if present(cache_indices) else B) * L)
  workloads:
    - {D: 5376, W: 4, L: 3, Tt: 4096, seq_lens: "repeat(1024, 4)", dtype_cases: [{T: bfloat16, Tw: bfloat16}], some: [bias, has_initial_state], label: mamba2-2.7b-prefill-4k}
    - {D: 5376, W: 4, L: 3, Tt: 4096, seq_lens: "repeat(1024, 4)", dtype_cases: [{T: bfloat16, Tw: bfloat16}], some: [bias], label: mamba2-2.7b-pf4k-nost}
    - {D: 5376, W: 4, L: 3, Tt: 32768, seq_lens: "repeat(4096, 8)", dtype_cases: [{T: bfloat16, Tw: bfloat16}], some: [bias, has_initial_state], label: mamba2-2.7b-prefill-32k}
    - {D: 8192, W: 4, L: 3, Tt: 4096, seq_lens: [2500, 1000, 500, 96], dtype_cases: [{T: float16, Tw: float16}], bias: null, some: [has_initial_state], label: qwen3-next-pf4k-ragged}
    - {D: 8192, W: 4, L: 3, Tt: 32768, seq_lens: "repeat(8192, 4)", dtype_cases: [{T: float16, Tw: float16}], bias: null, some: [has_initial_state], label: qwen3-next-prefill-32k}
    # GDN-layer convolutions reading and writing a state pool: Qwen3.6-27B (10240) and
    # Qwen3.6-35B-A3B (8192); a pool 3 tokens wider also holds speculative-decode drafts.
    - {D: 10240, W: 4, L: 3, P: 256, Tt: 4096, seq_lens: "repeat(1024, 4)", dtype_cases: [{T: bfloat16, Tw: bfloat16}], bias: null, some: [has_initial_state, cache_indices], label: qwen3.6-27b-pf-pool}
    - {D: 10240, W: 4, L: 6, P: 256, Tt: 4096, seq_lens: [3000, 1000, 96], dtype_cases: [{T: bfloat16, Tw: bfloat16}], bias: null, some: [has_initial_state, cache_indices], label: qwen3.6-27b-pf-spec-pool}
    - {D: 8192, W: 4, L: 3, P: 256, Tt: 4096, seq_lens: "repeat(1024, 4)", dtype_cases: [{T: bfloat16, Tw: bfloat16}], bias: null, some: [has_initial_state, cache_indices], label: qwen3.6-35b-a3b-pf-pool}
    # Qwen3.8-Flash-Next PLE short conv over 4 streams of 2560: dilation 3, no bias.
    - {D: 10240, W: 4, L: 9, Tt: 4096, seq_lens: "repeat(1024, 4)", dilation: 3, dtype_cases: [{T: bfloat16, Tw: bfloat16}], bias: null, some: [has_initial_state], label: qwen3.8-flash-ple-pf}
    - {D: 10240, W: 4, L: 9, P: 256, Tt: 4096, seq_lens: "repeat(1024, 4)", dilation: 3, dtype_cases: [{T: bfloat16, Tw: bfloat16}], bias: null, some: [has_initial_state, cache_indices], label: qwen3.8-flash-ple-pool}
    # GLM-5.3-Flash KDA convolution: float32 filters over bf16 activations.
    - {D: 24576, W: 4, L: 3, Tt: 4096, seq_lens: "repeat(1024, 4)", dtype_cases: [{T: bfloat16, Tw: float32}], bias: null, some: [has_initial_state], label: glm-5.3-flash-pf}
    - {D: 24576, W: 4, L: 3, P: 256, Tt: 4096, seq_lens: "repeat(1024, 4)", dtype_cases: [{T: bfloat16, Tw: float32}], bias: null, some: [has_initial_state, cache_indices], label: glm-5.3-flash-pf-pool}

CausalConv1dUpdateFwdOp:
  # Not vLLM's causal_conv1d_update: dilation and the float32 weight are
  # CausalConv1dFwdOp's, and query_start_loc comes with num_accepted_tokens, x packing a
  # sequence's draft tokens. With conv_state_indices, sequence b's state is
  # conv_state[conv_state_indices[b]]. A state is the first (W - 1) * dilation tokens of its
  # L columns and is advanced by the sequence's tokens; with num_accepted_tokens, sequence b
  # with a = num_accepted_tokens[b] and q tokens reads the (W - 1) * dilation tokens from
  # column a - 1, and its first (W - 1) * dilation + q - 1 columns become its last such
  # tokens, so a later call resumes from any accepted draft. A slot of -1 (vLLM's
  # pad_slot_id) is never written and its sequence's outputs are unspecified;
  # every other slot index names a state, vLLM's null slot 0 is not declared.
  family: mamba
  status: implemented
  ref_api: vllm.model_executor.layers.mamba.ops.causal_conv1d.causal_conv1d_update
  signature:
    types:
      Tokens:
        params: {varlen: Bool, B: Dim, Tt: Dim, D: Dim}
        match: varlen
        cases:
        - {when: false, is: "[B, D]"}
        - {when: true, is: "[Tt, D]"}
      States:
        params: {pooled: Bool, B: Dim, P: Dim, D: Dim, L: Dim}
        match: pooled
        cases:
        - {when: false, is: "[B, D, L]"}
        - {when: true, is: "[P, D, L]"}
    forall:
      B: Dim
      D: Dim
      W: Dim
      Tt: Dim
      L: Dim
      P: Dim
      T: "DType[float16 | bfloat16]"
      Tw: "DType[float16 | bfloat16 | float32]"
      seq_lens: "Seq[Int]"
    params:
      activation: {type: "'silu' | None", default: silu}
      dilation: {type: int, default: 1, kw_only: true}
      max_query_len: {type: int, default: -1, kw_only: true}
      validate_inputs: {type: bool, default: false, kw_only: true}
    inputs:
      x: {dtype: T, shape: "Tokens[present(query_start_loc), B, Tt, D]"}
      weight: {dtype: Tw, shape: "[D, W]"}
      # The (W - 1) * dilation most recent tokens per sequence, the state
      # CausalConv1dFwdOp leaves, advanced in place.
      conv_state: {dtype: T, shape: "States[present(conv_state_indices), B, P, D, L]", mutated: true, contiguous: true}
      bias: {dtype: Tw, shape: "[D]", type: "Tensor | None", default: null}
      conv_state_indices: {dtype: int32, shape: "[B]", type: "Tensor | None", default: null, kw_only: true, values: "sample_indices(B, P)", requires: ["in_range(-1, P)"]}
      num_accepted_tokens: {dtype: int32, shape: "[B]", type: "Tensor | None", default: null, kw_only: true, values: "full((B,), 1)", requires: ["in_range(1, L - (W - 1) * dilation + 2)"]}
      query_start_loc: {dtype: int32, shape: "[B + 1]", type: "Tensor | None", default: null, kw_only: true, values: "prefix_sum(seq_lens)", requires: ["prefix_offsets(Tt)", "max_segment(max_query_len)"]}
    outputs:
      output: {dtype: T, shape: "Tokens[present(query_start_loc), B, Tt, D]"}
    dtype_combos:
    - {T: float16, Tw: float16}
    - {T: bfloat16, Tw: bfloat16}
    - {T: float16, Tw: float32}
    - {T: bfloat16, Tw: float32}
    shape_rules:
      - "B > 0 and D > 0"
      - "W >= 2 and W <= 4"
      - "dilation >= 1"
      - "not present(query_start_loc) or (present(conv_state_indices) and present(num_accepted_tokens) and max_query_len > 0)"
      - "L >= (W - 1) * dilation + (max_query_len - 1 if present(num_accepted_tokens) and present(query_start_loc) else 0)"
  roofline:
    flops: "2 * (Tt if present(query_start_loc) else B) * D * W"
    # Each sequence reads (W - 1) * dilation state tokens and writes as many, or, rolling
    # back drafts, (W - 1) * dilation + q - 1 for its q tokens.
    bytes: >-
      bytes(x) + bytes(weight) + bytes(output)
      + (bytes(bias) if present(bias) else 0)
      + (bytes(conv_state_indices) if present(conv_state_indices) else 0)
      + (bytes(num_accepted_tokens) if present(num_accepted_tokens) else 0)
      + (bytes(query_start_loc) if present(query_start_loc) else 0)
      + bytes(conv_state) * (2 * B * (W - 1) * dilation + (Tt - B if present(num_accepted_tokens) and present(query_start_loc) else 0)) // ((P if present(conv_state_indices) else B) * L)
  workloads:
    - {B: 1, D: 5376, W: 4, L: 3, dtype_cases: [{T: bfloat16, Tw: bfloat16}], some: [bias], label: mamba2-2.7b-decode-b1}
    - {B: 64, D: 5376, W: 4, L: 3, dtype_cases: [{T: bfloat16, Tw: bfloat16}], some: [bias], label: mamba2-2.7b-decode-b64}
    - {B: 256, D: 5376, W: 4, L: 3, dtype_cases: [{T: bfloat16, Tw: bfloat16}], some: [bias], label: mamba2-2.7b-decode-b256}
    - {B: 64, D: 8192, W: 4, L: 3, dtype_cases: [{T: float16, Tw: float16}], label: qwen3-next-decode-b64}
    # GDN-layer decode on a state pool, and speculative verification of 3 drafts a sequence
    # with rollback: Qwen3.6-27B (10240) and Qwen3.6-35B-A3B (8192).
    - {B: 64, D: 10240, W: 4, L: 3, P: 256, dtype_cases: [{T: bfloat16, Tw: bfloat16}], some: [conv_state_indices], label: qwen3.6-27b-dec-pool}
    - {D: 10240, W: 4, L: 6, P: 256, Tt: 256, seq_lens: "repeat(4, 64)", max_query_len: 4, dtype_cases: [{T: bfloat16, Tw: bfloat16}], some: [conv_state_indices, num_accepted_tokens, query_start_loc], label: qwen3.6-27b-spec-verify}
    - {B: 64, D: 8192, W: 4, L: 3, P: 256, dtype_cases: [{T: bfloat16, Tw: bfloat16}], some: [conv_state_indices], label: qwen3.6-35b-a3b-dec-pool}
    - {D: 8192, W: 4, L: 6, P: 256, Tt: 256, seq_lens: "repeat(4, 64)", max_query_len: 4, dtype_cases: [{T: bfloat16, Tw: bfloat16}], some: [conv_state_indices, num_accepted_tokens, query_start_loc], label: qwen3.6-35b-a3b-spec}
    # Qwen3.8-Flash-Next PLE short conv: dilation 3, a 9-token state.
    - {B: 64, D: 10240, W: 4, L: 9, P: 256, dilation: 3, dtype_cases: [{T: bfloat16, Tw: bfloat16}], some: [conv_state_indices], label: qwen3.8-flash-ple-dec}
    - {D: 10240, W: 4, L: 12, P: 256, Tt: 256, seq_lens: "repeat(4, 64)", max_query_len: 4, dilation: 3, dtype_cases: [{T: bfloat16, Tw: bfloat16}], some: [conv_state_indices, num_accepted_tokens, query_start_loc], label: qwen3.8-flash-ple-spec}
    # GLM-5.3-Flash KDA convolution: float32 filters over bf16 activations.
    - {B: 64, D: 24576, W: 4, L: 3, P: 256, dtype_cases: [{T: bfloat16, Tw: float32}], some: [conv_state_indices], label: glm-5.3-flash-dec-pool}
    - {D: 24576, W: 4, L: 6, P: 256, Tt: 256, seq_lens: "repeat(4, 64)", max_query_len: 4, dtype_cases: [{T: bfloat16, Tw: float32}], some: [conv_state_indices, num_accepted_tokens, query_start_loc], label: glm-5.3-flash-spec}

SelectiveScanFwdOp:
  # Mamba-1 S6 selective scan: a first-order recurrence whose decay and input gates are
  # functions of the input, discretized per channel. The SSD entries above carry one
  # scalar decay per head; this one does not reduce to their chunked matmul.
  #
  # Index names, which differ from the SSD stages above:
  #   Di d_inner   N d_state   G n_groups   Bsz batch
  family: mamba
  status: implemented
  ref_api: mamba_ssm.ops.selective_scan_interface.selective_scan_fn
  signature:
    forall: {Bsz: Dim, S: Dim, Di: Dim, N: Dim, G: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      delta_softplus: {type: bool, default: true}
    inputs:
      u: {dtype: T, shape: "[Bsz, Di, S]"}
      delta: {dtype: T, shape: "[Bsz, Di, S]"}
      A: {dtype: float32, shape: "[Di, N]"}
      B: {dtype: T, shape: "[Bsz, G, N, S]"}
      C: {dtype: T, shape: "[Bsz, G, N, S]"}
      # The skip term `D * u`, and the gate `u * silu(z)`.
      D: {dtype: float32, shape: "[Di]", type: "Tensor | None", default: null}
      z: {dtype: T, shape: "[Bsz, Di, S]", type: "Tensor | None", default: null}
      delta_bias: {dtype: float32, shape: "[Di]", type: "Tensor | None", default: null}
      # Packed sequences: the id each token belongs to, as the SSD stages take it. A
      # token whose id differs from its predecessor's restarts the recurrence.
      seq_idx: {dtype: int32, shape: "[Bsz, S]", type: "Tensor | None", default: null}
      initial_states: {dtype: float32, shape: "[Bsz, Di, N]", type: "Tensor | None", default: null}
    outputs:
      y: {dtype: T, shape: "[Bsz, Di, S]"}
      final_states: {dtype: float32, shape: "[Bsz, Di, N]"}
    shape_rules:
    - "Bsz > 0 and S > 0 and Di > 0 and N > 0 and G > 0"
    - "Di % G == 0"
    # A packed batch starts from zero: a carried state names one sequence per batch row.
    - "not present(seq_idx) or not present(initial_states)"
  workloads:
  # Mamba-1 model sizes: 130M D=1536, 1.4B D=4096, 2.8B D=5120; N=16, G=1.
  - {Bsz: 1, S: 4096, Di: 5120, N: 16, G: 1, some: [D, z, delta_bias], dtype_cases: [{T: bfloat16}, {T: float16}], label: mamba-2.8b-prefill}
  - {Bsz: 1, S: 1, Di: 5120, N: 16, G: 1, some: [D, z, delta_bias, initial_states], dtype_cases: [{T: bfloat16}], label: mamba-2.8b-decode}
  - {Bsz: 64, S: 1, Di: 5120, N: 16, G: 1, some: [D, z, delta_bias, initial_states], dtype_cases: [{T: bfloat16}], label: mamba-2.8b-decode-b64}
  - {Bsz: 1, S: 4096, Di: 4096, N: 16, G: 1, some: [D, z, delta_bias], dtype_cases: [{T: bfloat16}], label: mamba-1.4b-prefill}
  - {Bsz: 1, S: 4096, Di: 1536, N: 16, G: 1, some: [D, delta_bias], dtype_cases: [{T: float32}], label: mamba-130m-no-gate}
  - {Bsz: 1, S: 4096, Di: 5120, N: 16, G: 1, some: [D, z, delta_bias, seq_idx], dtype_cases: [{T: bfloat16}], label: mamba-2.8b-packed}
  - {Bsz: 8, S: 2048, Di: 4096, N: 32, G: 8, some: [D, z, delta_bias], dtype_cases: [{T: bfloat16}], label: grouped-state}
  # The bare recurrence: a gate, no skip and no bias.
  - {Bsz: 4, S: 1024, Di: 2048, N: 16, G: 1, some: [z], dtype_cases: [{T: bfloat16}], label: bare-scan}
  roofline:
    # Per (element, state): the discretized decay exp(delta * A), the state update against
    # delta * B * u, and the C readout. Per element: the optional bias and softplus on
    # delta, the optional D skip, and the optional silu gate.
    flops: >-
      Bsz * Di * S * (6 * N + (1 if present(delta_bias) else 0)
      + (4 if delta_softplus else 0) + (2 if present(D) else 0)
      + (5 if present(z) else 0))
