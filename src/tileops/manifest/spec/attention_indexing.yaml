# Attention indexing and sparse selection operators.

FP8LightningIndexerFwdOp:
  family: attention
  status: implemented
  ref_api: deep_gemm.fp8_mqa_logits  # gitleaks:allow (public API path)
  signature:
    forall: {B: Dim, S: Dim, S_kv: Dim, H: Dim, G: Dim, D: Dim, first: Dim, T: "DType[bfloat16 | float8_e4m3fn]", seq_lens: "Seq[Int]"}
    params:
      clean_logits: {type: bool, default: true}
    inputs:
      index_q: {dtype: T, shape: "[B, S, H, D]"}
      index_k: {dtype: T, shape: "[B, S_kv, G, D]"}
      weights: {dtype: float32, shape: "[S, H]"}
      # Query s scores the keys in [starts[s], ends[s]): its own segment up to
      # itself, for queries at packed positions first .. first + S - 1 of segments seq_lens.
      starts: {dtype: int32, shape: "[S]", values: "key_windows(seq_lens, first, S, 'start')", requires: ["in_range(0, S_kv + 1)"]}
      ends: {dtype: int32, shape: "[S]", values: "key_windows(seq_lens, first, S, 'end')", requires: ["in_range(0, S_kv + 1)"]}
      # Per-key scales of pre-quantized FP8 keys; a bf16 call is quantized by the op.
      index_k_scale: {dtype: float32, shape: "[B, S_kv, G]", type: "Tensor | None", default: null}
    outputs:
      logits: {dtype: float32, shape: "[B, S, S_kv, G]"}
    shape_rules:
    - "G > 0 and H % G == 0"
    - "not present(index_k_scale) or T == 'float8_e4m3fn'"
  workloads:
  - {B: 1, S: 8192, H: 32, D: 64, S_kv: 32768, G: 1, seq_lens: "repeat(512, 64)", first: 24576, clean_logits: true, dtype_cases: [{T: bfloat16}], label: chunk-prefill}
  - {B: 1, S: 8192, H: 32, D: 64, S_kv: 32768, G: 1, seq_lens: "repeat(512, 64)", first: 24576, clean_logits: true, dtype_cases: [{T: float8_e4m3fn}], label: chunk-prefill}
  - {B: 1, S: 8192, H: 32, D: 64, S_kv: 32768, G: 1, seq_lens: "repeat(512, 64)", first: 24576, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: chunk-prefill-kscale}
  - {B: 1, S: 2048, H: 32, D: 64, S_kv: 2048, G: 1, seq_lens: [2048], first: 0, clean_logits: true, dtype_cases: [{T: bfloat16}], label: short-prefill}
  - {B: 1, S: 3072, H: 32, D: 64, S_kv: 8192, G: 1, seq_lens: [8192], first: 5120, clean_logits: true, dtype_cases: [{T: bfloat16}], label: context-chunk}
  - {B: 1, S: 2048, H: 64, D: 128, S_kv: 4096, G: 1, seq_lens: [4096], first: 2048, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: index-q2048-ctx4096}
  - {B: 1, S: 2048, H: 64, D: 128, S_kv: 8192, G: 1, seq_lens: [8192], first: 6144, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: index-q2048-ctx8192}
  - {B: 1, S: 2048, H: 64, D: 128, S_kv: 16384, G: 1, seq_lens: [16384], first: 14336, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: index-q2048-ctx16384}
  - {B: 1, S: 2048, H: 64, D: 128, S_kv: 32768, G: 1, seq_lens: [32768], first: 30720, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: index-q2048-ctx32768}
  - {B: 1, S: 2048, H: 64, D: 128, S_kv: 65536, G: 1, seq_lens: [65536], first: 63488, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: index-q2048-ctx65536}
  - {B: 1, S: 2048, H: 64, D: 128, S_kv: 131072, G: 1, seq_lens: [131072], first: 129024, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: index-q2048-ctx131072}
  - {B: 1, S: 4096, H: 64, D: 128, S_kv: 4096, G: 1, seq_lens: [4096], first: 0, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: index-q4096-ctx4096}
  - {B: 1, S: 4096, H: 64, D: 128, S_kv: 8192, G: 1, seq_lens: [8192], first: 4096, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: index-q4096-ctx8192}
  - {B: 1, S: 4096, H: 64, D: 128, S_kv: 16384, G: 1, seq_lens: [16384], first: 12288, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: index-q4096-ctx16384}
  - {B: 1, S: 4096, H: 64, D: 128, S_kv: 32768, G: 1, seq_lens: [32768], first: 28672, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: index-q4096-ctx32768}
  - {B: 1, S: 4096, H: 64, D: 128, S_kv: 65536, G: 1, seq_lens: [65536], first: 61440, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: index-q4096-ctx65536}
  - {B: 1, S: 4096, H: 64, D: 128, S_kv: 131072, G: 1, seq_lens: [131072], first: 126976, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: index-q4096-ctx131072}
  - {B: 1, S: 1, H: 64, D: 128, S_kv: 16384, G: 1, seq_lens: [16384], first: 16383, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: ds-v32-decode-b1}
  roofline:
    func: tileops._perf.formulas.fp8_lightning_indexer_roofline

GatedPoolCompressFwdOp:
  # Pools every ratio tokens of a request into one entry: per channel, softmax over the
  # window's tokens of score + ape[j] (j the token's slot in the window) in float32, the
  # weights and their products with kv rounded to kv's dtype and summed in float32, rounded
  # once to bfloat16. With overlap the window also takes the first D channels of the
  # previous window's tokens, the current window giving the last D; the first window has no
  # previous one. Windows start at each sequence's position 0 (DeepSeek-V4-Flash
  # inference/model.py Compressor.forward, transformers
  # Glm5NextTextIndexer.get_pooled_states).
  # Request i holds tokens cu_seqlens[i]:cu_seqlens[i + 1] at positions from start_pos[i].
  # The token at position p with (p + 1) % ratio == 0 closes a window: valid is true at it
  # and entries holds the window's entry; elsewhere entries is unspecified.
  # The state of slot state_slots[i] is a ring: row p % (C * ratio) holds the request's
  # token at position p, kv in kv_state and score + ape in score_state. A call writes the
  # rows of its tokens among the request's last C * ratio positions and reads the earlier
  # positions its windows need.
  # start_pos[i] 0 starts a request afresh; otherwise start_pos[i] is the end of the
  # request's last call or one position before it, so the caller may roll back at most the
  # last token it passed. Distinct state_slots are the caller's obligation.
  family: attention
  status: implemented
  ref_api: workloads.attention.gated_pool_compress.gated_pool_compress
  signature:
    forall: {N: Dim, T_q: Dim, NS: Dim, D: Dim, T: "DType[bfloat16 | float32]", seq_lens: "Seq[Int]", positions: "Seq[Int]"}
    params:
      ratio: {type: int}
      overlap: {type: bool, default: false}
      validate_inputs: {type: bool, default: false, kw_only: true}
    let:
      C: "2 if overlap else 1"
    inputs:
      kv: {dtype: T, shape: "[T_q, C * D]"}
      score: {dtype: T, shape: "[T_q, C * D]"}
      ape: {dtype: T, shape: "[ratio, C * D]"}
      kv_state: {dtype: float32, shape: "[NS, C * ratio, C * D]", mutated: true, contiguous: true}
      score_state: {dtype: float32, shape: "[NS, C * ratio, C * D]", mutated: true, contiguous: true}
      cu_seqlens: {dtype: int32, shape: "[N + 1]", values: "prefix_sum(seq_lens)", requires: ["prefix_offsets(T_q)"]}
      start_pos: {dtype: int32, shape: "[N]", values: "as_tensor(positions)"}
      state_slots: {dtype: int32, shape: "[N]", values: "sample_indices(N, NS)", requires: ["in_range(0, NS)"]}
    outputs:
      entries: {dtype: bfloat16, shape: "[T_q, D]"}
      valid: {dtype: bool, shape: "[T_q]"}
    shape_rules:
    - "ratio > 0"
    - "D > 0"
  workloads:
  # DeepSeek-V4-Flash: CSA attention (ratio 4, overlapping), HCA attention (ratio 128) and
  # the indexer (ratio 4, overlapping, 128 channels), float32 kv and score. Decode positions
  # end a window; MTP verification passes two tokens a request.
  - {T_q: 4096, NS: 64, D: 512, ratio: 4, overlap: true, seq_lens: [4096], positions: [0], dtype_cases: [{T: float32}], label: dsv4-flash-csa-4k}
  - {T_q: 32768, NS: 64, D: 512, ratio: 4, overlap: true, seq_lens: [32768], positions: [0], dtype_cases: [{T: float32}], label: dsv4-flash-csa-32k}
  - {T_q: 64, NS: 64, D: 512, ratio: 4, overlap: true, seq_lens: "repeat(1, 64)", positions: "repeat(32767, 64)", dtype_cases: [{T: float32}], label: dsv4-flash-csa-b64}
  - {T_q: 32, NS: 64, D: 512, ratio: 4, overlap: true, seq_lens: "repeat(2, 16)", positions: "repeat(32766, 16)", dtype_cases: [{T: float32}], label: dsv4-flash-csa-mtp}
  - {T_q: 4096, NS: 64, D: 512, ratio: 128, seq_lens: [4096], positions: [0], dtype_cases: [{T: float32}], label: dsv4-flash-hca-4k}
  - {T_q: 32768, NS: 64, D: 512, ratio: 128, seq_lens: [32768], positions: [0], dtype_cases: [{T: float32}], label: dsv4-flash-hca-32k}
  - {T_q: 64, NS: 64, D: 512, ratio: 128, seq_lens: "repeat(1, 64)", positions: "repeat(32767, 64)", dtype_cases: [{T: float32}], label: dsv4-flash-hca-b64}
  - {T_q: 4096, NS: 64, D: 128, ratio: 4, overlap: true, seq_lens: [4096], positions: [0], dtype_cases: [{T: float32}], label: dsv4-flash-idx-4k}
  - {T_q: 64, NS: 64, D: 128, ratio: 4, overlap: true, seq_lens: "repeat(1, 64)", positions: "repeat(32767, 64)", dtype_cases: [{T: float32}], label: dsv4-flash-idx-b64}
  # GLM-5.3-Flash indexer key pools: ratio 4, 128 channels, bfloat16 k and gate.
  - {T_q: 4096, NS: 64, D: 128, ratio: 4, seq_lens: [4096], positions: [0], dtype_cases: [{T: bfloat16}], label: glm-5.3-flash-4k}
  - {T_q: 32768, NS: 64, D: 128, ratio: 4, seq_lens: [1000, 31768], positions: [0, 0], dtype_cases: [{T: bfloat16}], label: glm-5.3-flash-ragged}
  - {T_q: 64, NS: 64, D: 128, ratio: 4, seq_lens: "repeat(1, 64)", positions: "repeat(32767, 64)", dtype_cases: [{T: bfloat16}], label: glm-5.3-flash-b64}
  roofline:
    # The windows that close in the call, and the state rows they read and write.
    func: "tileops._perf.formulas.gated_pool_compress_roofline"

TopKSelectFwdOp:
  # Unordered along the top_k axis: a row selects the same positions every call and may
  # place them in different slots. A window holding fewer than top_k positions selects all
  # of them and fills the rest with fill_value; flashinfer.top_k takes no such window,
  # DeepSeek-V4-Flash inference/model.py Indexer.forward selects topk(min(k, n)) and fills
  # with -1, the index its sparse attention skips.
  family: attention
  status: implemented
  ref_api: flashinfer.top_k
  signature:
    forall: {B: Dim, S: Dim, S_kv: Dim, G: Dim}
    params:
      top_k: {type: int}
      # The index of a slot no key fills; None is S_kv, one past the last key.
      fill_value: {type: "int | None", default: null, kw_only: true}
    inputs:
      logits: {dtype: float32, shape: "[B, S, S_kv, G]"}
      # Row (b, s) selects from logits[b, s, starts[b, s]:ends[b, s]].
      starts: {dtype: int32, shape: "[B, S]", values: "full((B, S), 0)", requires: ["in_range(0, S_kv + 1)"]}
      ends: {dtype: int32, shape: "[B, S]", values: "full((B, S), S_kv)", requires: ["in_range(0, S_kv + 1)"]}
    outputs:
      indices: {dtype: int32, shape: "[B, S, G, top_k]"}
    shape_rules:
    - "0 < top_k"
    # The indices are int32.
    - "not present(fill_value) or (-2147483648 <= fill_value and fill_value <= 2147483647)"
  workloads:
  - {B: 1, S: 32768, S_kv: 65536, G: 1, top_k: 1024, label: prefill-k1024}
  - {B: 1, S: 32768, S_kv: 65536, G: 1, top_k: 2048, label: prefill-k2048}
  - {B: 1, S: 1, S_kv: 16384, G: 1, top_k: 2048, label: ds-v32-topk-decode-b1}
  # Top-512 of ratio-4 compressed keys (DeepSeek-V4-Flash entries, GLM-5.3-Flash pools,
  # Qwen3.8-Flash-Next blocks): S_kv is the context over 4.
  - {B: 1, S: 4096, S_kv: 1024, G: 1, top_k: 512, fill_value: -1, label: dsv4-flash-prefill-4k}
  - {B: 1, S: 32768, S_kv: 8192, G: 1, top_k: 512, fill_value: -1, label: dsv4-flash-prefill-32k}
  - {B: 64, S: 1, S_kv: 8192, G: 1, top_k: 512, fill_value: -1, label: dsv4-flash-decode-b64}
  # Fewer compressed keys than top_k: a 100-token context.
  - {B: 1, S: 1, S_kv: 25, G: 1, top_k: 512, fill_value: -1, label: dsv4-flash-short-ctx}
  - {B: 64, S: 2, S_kv: 8192, G: 1, top_k: 512, label: glm-5.3-flash-mtp-b64}
  - {B: 1, S: 4096, S_kv: 1024, G: 1, top_k: 512, label: qwen3.8-flash-prefill}
  - {B: 64, S: 1, S_kv: 65536, G: 1, top_k: 512, label: qwen3.8-flash-256k-b64}
  roofline:
    func: tileops._perf.formulas.topk_select_roofline
