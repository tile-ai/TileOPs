# Attention indexing and sparse selection operators.

FP8LightningIndexerFwdOp:
  family: attention
  status: implemented
  signature:
    forall: {B: Dim, S: Dim, S_kv: Dim, H: Dim, G: Dim, D: Dim, first: Dim, T: "DType[bfloat16 | float8_e4m3fn]", seq_lens: "Seq[Int]"}
    params:
      clean_logits: {type: bool, default: true}
    inputs:
      index_q: {dtype: T, shape: "[B, S, H, D]"}
      index_k: {dtype: T, shape: "[B, S_kv, G, D]"}
      weights: {dtype: float32, shape: "[S, H]"}
      # Query s scores the keys in [cu_seqlen_ks[s], cu_seqlen_ke[s]): its own segment up to
      # itself, for queries at packed positions first .. first + S - 1 of segments seq_lens.
      cu_seqlen_ks: {dtype: int32, shape: "[S]", values: "key_windows(seq_lens, first, S, 'start')", requires: ["in_range(0, S_kv + 1)"]}
      cu_seqlen_ke: {dtype: int32, shape: "[S]", values: "key_windows(seq_lens, first, S, 'end')", requires: ["in_range(0, S_kv + 1)"]}
      # Per-key scales of pre-quantized FP8 keys; a bf16 call is quantized by the op.
      index_k_scale: {dtype: float32, shape: "[B, S_kv, G]", optional: true}
    outputs:
      logits: {dtype: float32, shape: "[B, S, S_kv, G]"}
    shape_rules:
    - "G > 0 and H % G == 0"
    - "not present(index_k_scale) or T == 'float8_e4m3fn'"
  workloads:
  - {B: 1, S: 8192, H: 32, D: 64, S_kv: 32768, G: 1, seq_lens: [512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512], first: 24576, clean_logits: true, dtype_cases: [{T: bfloat16}], label: lightning-indexer-s8k-h32-d64}
  - {B: 1, S: 8192, H: 32, D: 64, S_kv: 32768, G: 1, seq_lens: [512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512], first: 24576, clean_logits: true, dtype_cases: [{T: float8_e4m3fn}], label: lightning-indexer-s8k-h32-d64}
  - {B: 1, S: 8192, H: 32, D: 64, S_kv: 32768, G: 1, seq_lens: [512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512, 512], first: 24576, clean_logits: true, some: [index_k_scale], dtype_cases: [{T: float8_e4m3fn}], label: lightning-indexer-s8k-h32-d64-kscale}
  roofline:
    # One D-long contraction per query head and key, reduced over each group's heads.
    flops: "2 * B * S * S_kv * H * D"

TopkSelectorFwdOp:
  # Unordered along the topk axis: a row selects the same positions every call and may
  # place them in different slots. A window holding fewer than topk positions fills the
  # rest with S_kv, which selects nothing.
  family: attention
  status: implemented
  signature:
    forall: {B: Dim, S: Dim, S_kv: Dim, G: Dim}
    params:
      topk: {type: int}
    inputs:
      index_score: {dtype: float32, shape: "[B, S, S_kv, G]"}
      # Row (b, s) selects from index_score[b, s, starts[b, s]:ends[b, s]].
      starts: {dtype: int32, shape: "[B, S]", values: "full((B, S), 0)", requires: ["in_range(0, S_kv + 1)"]}
      ends: {dtype: int32, shape: "[B, S]", values: "full((B, S), S_kv)", requires: ["in_range(0, S_kv + 1)"]}
    outputs:
      indexes: {dtype: int32, shape: "[B, S, G, topk]"}
    shape_rules:
    - "0 < topk and topk <= S_kv"
  workloads:
  - {B: 1, S: 32768, S_kv: 65536, G: 1, topk: 1024, label: topk1024-s32k-kv64k}
  - {B: 1, S: 32768, S_kv: 65536, G: 1, topk: 2048, label: topk2048-s32k-kv64k}
  roofline:
    # One comparison per score in the window.
    flops: "B * S * G * S_kv"
