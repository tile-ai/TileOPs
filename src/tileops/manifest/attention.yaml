GroupedQueryAttentionPagedFwdOp:
  family: attention
  status: spec-only
  signature:
    forall: {B: Dim, T_q: Dim, NP: Dim, PS: Dim, W: Dim, H: Dim, H_kv: Dim, D: Dim, P: Dim, SK: Shape, T: "DType[float16 | bfloat16 | float8_e4m3fn]", KV: "DType[float16 | bfloat16 | float8_e4m3fn]", q_lens: "Seq[Int]", cache_lens: "Seq[Int]"}
    params:
      is_causal: {type: bool, default: true}
      window_size_left: {type: int, default: -1}
      window_size_right: {type: int, default: -1}
      sm_scale: {type: "float | None", default: null}
      softcap: {type: "float | None", default: null}
      out_dtype: {type: "float16 | bfloat16 | None", default: null}
      pos_encoding_mode: {type: "'none' | 'rope'", default: none}
      rotary_dim: {type: "int | None", default: null}
      rope_layout: {type: "'neox' | 'interleaved'", default: neox}
    inputs:
      q: {dtype: T, shape: "[T_q, H, D]"}
      k_pages: {dtype: KV, shape: "[NP, PS, H_kv, D]"}
      v_pages: {dtype: KV, shape: "[NP, PS, H_kv, D]"}
      page_table: {dtype: int32, shape: "[B, W]", values: "paged_block_table(B, W, NP)", requires: ["in_range(0, NP)"]}
      cache_seqlens: {dtype: int32, shape: "[B]", values: "as_tensor(cache_lens)", requires: ["in_range(0, W * PS + 1)", "attn.paged_fits(cu_seqlens_q, W * PS)"]}
      cu_seqlens_q: {dtype: int32, shape: "[B + 1]", values: "prefix_sum(q_lens)", requires: ["prefix_offsets(T_q)"]}
      q_scale: {dtype: float32, shape: "[B, H_kv]", optional: true}
      # A per-tensor scale is [1]; a per-request, per-KV-head one is [B, H_kv].
      k_scale: {dtype: float32, shape: "[*SK]", optional: true}
      v_scale: {dtype: float32, shape: "[*SK]", optional: "present(k_scale)"}
      rope_cos: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[P, R // 2]", optional: "pos_encoding_mode == 'rope'"}
      rope_sin: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[P, R // 2]", optional: "pos_encoding_mode == 'rope'"}
    outputs:
      o: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[T_q, H, D]"}
    let:
      R: "rotary_dim.value if present(rotary_dim) else D"
    dtype_combos:
    - {T: float16, KV: float16}
    - {T: bfloat16, KV: bfloat16}
    - {T: float16, KV: float8_e4m3fn}
    - {T: bfloat16, KV: float8_e4m3fn}
    - {T: float8_e4m3fn, KV: float8_e4m3fn}
    shape_rules:
    - "H_kv > 0 and H % H_kv == 0 and PS > 0"
    - "window_size_left >= -1 and window_size_right >= -1"
    - "(T == 'float8_e4m3fn') == present(q_scale)"
    - "(KV == 'float8_e4m3fn') == present(k_scale)"
    - "present(out_dtype) if T == 'float8_e4m3fn' else (not present(out_dtype) or out_dtype.value == T)"
    - "pos_encoding_mode == 'rope' or not present(rotary_dim)"
    - "not present(rotary_dim) or (rotary_dim.value > 0 and rotary_dim.value % 2 == 0 and rotary_dim.value <= D)"
  workloads:
  - {T_q: 4096, NP: 576, PS: 64, W: 72, H: 32, H_kv: 8, D: 128, q_lens: [512, 512, 512, 512, 512, 512, 512, 512], cache_lens: [4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096], dtype_cases: [{T: float16, KV: float16}], label: llama-8b-paged-b8-prefix4k-chunk512-p64}
  roofline:
    func: "tileops.perf.formulas.gqa_paged_fwd_roofline"

GroupedQueryAttentionPrefillPagedWithKVCacheFwdOp:
  family: attention
  status: implemented
  signature:
    forall: {B: Dim, T_q: Dim, PT: Dim, W: Dim, H: Dim, H_kv: Dim, D: Dim, T: "DType[float16 | bfloat16]", q_lens: "Seq[Int]", cache_lens: "Seq[Int]"}
    params:
      page_size: {type: int}
      max_seqlen_q: {type: int}
      is_causal: {type: bool, default: true}
      cache_dtype: {type: "float16 | bfloat16 | float8_e4m3fn | None", default: null}
      sm_scale: {type: "float | None", default: null}
      softcap: {type: "float | None", default: null}
      fuse_rope: {type: bool, default: false}
      rope_base: {type: float, default: 10000.0}
      max_position: {type: "int | None", default: null}
      rotary_dim: {type: "int | None", default: null}
    inputs:
      q: {dtype: T, shape: "[T_q, H, D]"}
      k_new: {dtype: T, shape: "[T_q, H_kv, D]"}
      v_new: {dtype: T, shape: "[T_q, H_kv, D]"}
      # The new tokens are appended into the pool, so the call writes these as
      # well as reading the pages the block table names.
      k_pages: {dtype: "coalesce_dtype(cache_dtype, T)", shape: "[PT, H_kv, D]", mutated: true, contiguous: true}
      v_pages: {dtype: "coalesce_dtype(cache_dtype, T)", shape: "[PT, H_kv, D]", mutated: true, contiguous: true}
      # Dequantization scales of an FP8 cache; an unquantized cache ignores them.
      k_scale: {dtype: float32, shape: "[1]"}
      v_scale: {dtype: float32, shape: "[1]"}
      cu_seqlens_q: {dtype: int32, shape: "[B + 1]", values: "prefix_sum(q_lens)", requires: ["prefix_offsets(T_q)", "max_segment(max_seqlen_q)"]}
      # Each request's cache length before the append.
      cache_seqlens: {dtype: int32, shape: "[B]", values: "as_tensor(cache_lens)", requires: ["in_range(0, W * page_size + 1)", "attn.paged_fits(cu_seqlens_q, W * page_size)"]}
      block_table: {dtype: int32, shape: "[B, W]", values: "paged_block_table(B, W, NP)", requires: ["in_range(0, NP)"]}
    outputs:
      o: {dtype: T, shape: "[T_q, H, D]"}
    let:
      NP: "PT // page_size"
    shape_rules:
    - "H_kv > 0 and H % H_kv == 0"
    - "page_size > 0 and max_seqlen_q > 0"
    - "PT % page_size == 0"
    - "not present(cache_dtype) or cache_dtype.value == T or cache_dtype.value == 'float8_e4m3fn'"
    - "not present(rotary_dim) or fuse_rope"
    - "not present(rotary_dim) or (rotary_dim.value > 0 and rotary_dim.value % 2 == 0 and rotary_dim.value <= D)"
    - "not fuse_rope or (present(max_position) and max_position.value > 0)"
  workloads:
  - {T_q: 8192, PT: 270336, W: 528, H: 32, H_kv: 8, D: 256, q_lens: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024], cache_lens: [32768, 32768, 32768, 32768, 32768, 32768, 32768, 32768], page_size: 64, max_seqlen_q: 1024, is_causal: true, fuse_rope: true, max_position: 33792, rotary_dim: 64, dtype_cases: [{T: float16}], label: qwen35-9b-prefill-paged-fullattn-b8-prefix32k-chunk1k-p64-partial-rope64}
  - {T_q: 4608, PT: 270336, W: 528, H: 32, H_kv: 8, D: 256, q_lens: [256, 512, 768, 1024, 384, 640, 896, 128], cache_lens: [4096, 8192, 16384, 32768, 12288, 24576, 30720, 2048], page_size: 64, max_seqlen_q: 1024, is_causal: true, fuse_rope: true, max_position: 33792, rotary_dim: 64, dtype_cases: [{T: float16}], label: qwen35-9b-prefill-paged-fullattn-mixed-b8-p64-partial-rope64}
  - {T_q: 4096, PT: 36864, W: 72, H: 32, H_kv: 8, D: 128, q_lens: [512, 512, 512, 512, 512, 512, 512, 512], cache_lens: [4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096], page_size: 64, max_seqlen_q: 512, is_causal: true, fuse_rope: true, max_position: 4608, dtype_cases: [{T: float16}], label: llama-8b-prefill-paged-b8-prefix4k-chunk512-p64-full-rope}
  - {T_q: 2048, PT: 18432, W: 72, H: 8, H_kv: 2, D: 64, q_lens: [512, 512, 512, 512], cache_lens: [4096, 4096, 4096, 4096], page_size: 64, max_seqlen_q: 512, is_causal: true, softcap: 50.0, dtype_cases: [{T: float16}], label: gqa-prefill-paged-softcap50-b4-prefix4k-chunk512-p64}
  - {T_q: 8192, PT: 270336, W: 528, H: 32, H_kv: 8, D: 256, q_lens: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024], cache_lens: [32768, 32768, 32768, 32768, 32768, 32768, 32768, 32768], page_size: 64, max_seqlen_q: 1024, cache_dtype: float8_e4m3fn, is_causal: true, dtype_cases: [{T: float16}], label: qwen35-9b-prefill-paged-fp8-cache-b8-prefix32k-chunk1k-p64}
  - {T_q: 4096, PT: 36864, W: 72, H: 32, H_kv: 8, D: 128, q_lens: [512, 512, 512, 512, 512, 512, 512, 512], cache_lens: [4096, 4096, 4096, 4096, 4096, 4096, 4096, 4096], page_size: 64, max_seqlen_q: 512, cache_dtype: float8_e4m3fn, is_causal: true, dtype_cases: [{T: float16}], label: llama-8b-prefill-paged-fp8-cache-b8-prefix4k-chunk512-p64}
  - {T_q: 2048, PT: 18432, W: 72, H: 8, H_kv: 2, D: 64, q_lens: [512, 512, 512, 512], cache_lens: [4096, 4096, 4096, 4096], page_size: 64, max_seqlen_q: 512, cache_dtype: float8_e4m3fn, is_causal: true, softcap: 50.0, dtype_cases: [{T: float16}], label: gqa-prefill-paged-fp8-cache-softcap50-b4-prefix4k-chunk512-p64}
