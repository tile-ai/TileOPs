# ---------------------------------------------------------------------------
# attention — decode (single-query against KV cache)
# ---------------------------------------------------------------------------

MultiHeadAttentionDecodePagedWithKVCacheFwdOp:
  family: attention
  status: implemented
  signature:
    forall: {B: Dim, S_q: Dim, H: Dim, D: Dim, N_kv: Dim, W: Dim, T: "DType[float16 | bfloat16]", kv_lens: "Seq[Int]"}
    params:
      page_size: {type: int}
      is_causal: {type: bool, default: false}
    inputs:
      q: {dtype: T, shape: "[B, S_q, H, D]"}
      # One page pool shared by every request.
      k: {dtype: T, shape: "[N_kv, H, D]"}
      v: {dtype: T, shape: "[N_kv, H, D]"}
      real_seqlen_kv: {dtype: int32, shape: "[B]", values: "as_tensor(kv_lens)", requires: ["in_range(0, W * page_size + 1)"]}
      block_table: {dtype: int32, shape: "[B, W]", values: "paged_block_table(B, W, NP)", requires: ["in_range(0, NP)"]}
    outputs:
      o: {dtype: T, shape: "[B, S_q, H, D]"}
    let:
      NP: "N_kv // page_size"
    shape_rules:
    - "page_size > 0 and N_kv % page_size == 0"
  workloads:
  - {S_q: 1, H: 16, D: 128, N_kv: 512, W: 4, kv_lens: [512], page_size: 128, dtype_cases: [{T: float16}], label: single-token-page128}
  - {S_q: 1, H: 8, D: 64, N_kv: 1024, W: 4, kv_lens: [1024, 1024], page_size: 256, dtype_cases: [{T: float16}], label: batch2-page256}
  - {S_q: 1, H: 8, D: 64, N_kv: 1024, W: 4, kv_lens: [1024], page_size: 256, dtype_cases: [{T: float16}], label: longer-cache}
  - {S_q: 1, H: 8, D: 64, N_kv: 512, W: 2, kv_lens: [512], page_size: 256, dtype_cases: [{T: float16}], label: shorter-cache}
  roofline:
    flops: "4 * B * H * S_q * N_kv * D"
    # The whole pool, and one block-table row of the pages the pool holds per request.
    bytes: "bytes(q) + bytes(k) + bytes(v) + bytes(o) + 4 * B + 4 * B * max((1, ceil_div(N_kv, page_size)))"

