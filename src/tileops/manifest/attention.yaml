      o: {dtype: T, shape: "[B, H, D]"}
  workloads:
  - {B: 32, H: 128, H_kv: 1, N_kv: 4096, D: 128, PE: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: deepseek-v2-4k}
  - {B: 8, H: 128, H_kv: 1, N_kv: 32768, D: 128, PE: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: deepseek-v2-32k}
  - {B: 16, H: 128, H_kv: 1, N_kv: 4096, D: 128, PE: 64, dtype_cases: [{T: bfloat16}], label: deepseek-v3-4k}
  - {B: 4, H: 128, H_kv: 1, N_kv: 32768, D: 128, PE: 64, dtype_cases: [{T: bfloat16}], label: deepseek-v3-32k}
