  - {T_q: 8192, T_k: 8192, H: 32, H_kv: 8, D: 128, q_lens: [2048, 2048, 2048, 2048], k_lens: [2048, 2048, 2048, 2048], max_seqlen_q: 2048, is_causal: true, window_size_left: 1024, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-long-w1024}
  - {T_q: 2048, T_k: 2048, H: 64, H_kv: 8, D: 128, q_lens: [512, 512, 512, 512], k_lens: [512, 512, 512, 512], max_seqlen_q: 512, is_causal: true, window_size_left: 256, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-short-w256}
  - {T_q: 8192, T_k: 8192, H: 64, H_kv: 8, D: 128, q_lens: [2048, 2048, 2048, 2048], k_lens: [2048, 2048, 2048, 2048], max_seqlen_q: 2048, is_causal: true, window_size_left: 1024, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-long-w1024}
