    flops: "2 * B * H * N_kv * (2 * D + PE)"

DeepSeekSparseAttentionDecodeWithKVCacheFwdOp:
  family: attention
  status: implemented
  signature:
    forall: {B: Dim, S: Dim, S_kv: Dim, H: Dim, H_kv: Dim, D: Dim, K: Dim, T: "DType[float16 | bfloat16]"}
    params:
      dim_tail: {type: int}
      stride_kv: {type: int}
      q_start_index_s: {type: int}
      sm_scale: {type: "float | None", default: null}
      is_causal: {type: bool, default: true}
    inputs:
      q: {dtype: T, shape: "[B, S, H, D + dim_tail]"}
      kv: {dtype: T, shape: "[B, S_kv, H_kv, D + dim_tail]"}
      # The keys each query row attends to; S_kv pads a row that selects fewer than K.
      indices:
        dtype: int32
        shape: "[B, S, H_kv, K]"
        values: "causal_topk_indices(B, S, H_kv, K, S_kv, q_start_index_s, stride_kv)"
        requires: ["in_range(0, S_kv + 1)"]
    outputs:
      o: {dtype: T, shape: "[B, S, H, D]"}
    shape_rules:
    - "H_kv > 0 and H % H_kv == 0"
    - "dim_tail >= 0 and stride_kv > 0"
    # The kernel's first stride_kv - 1 outputs are undefined when queries start at 0.
    - "q_start_index_s > stride_kv or (q_start_index_s == 0 and stride_kv == 1)"
  workloads:
  - {B: 1, S: 1024, S_kv: 2048, H: 128, H_kv: 1, D: 512, K: 2048, dim_tail: 64, stride_kv: 1, q_start_index_s: 1024, dtype_cases: [{T: float16}], label: single-batch-mainstream}
  - {B: 1, S: 512, S_kv: 4096, H: 128, H_kv: 1, D: 512, K: 1024, dim_tail: 64, stride_kv: 1, q_start_index_s: 512, dtype_cases: [{T: float16}], label: longer-kv-lower-topk}
  roofline:
    flops: "2 * B * S * H * K * (2 * D + dim_tail)"

# Native Sparse Attention (NSA) runs as three passes over one packed batch: compress the
# keys and values per block, select the blocks each token keeps, then attend to those
# blocks only. `offsets` carries the request boundaries through all three.
NSACmpVarlenFwdOp:
  family: attention
  status: implemented
  signature:
    forall: {N: Dim, T_q: Dim, C: Dim, H: Dim, H_kv: Dim, DK: Dim, DV: Dim, T: "DType[float16 | bfloat16]", seq_lens: "Seq[Int]"}
    params:
      scale: {type: float}
      bs: {type: int}
    inputs:
      q: {dtype: T, shape: "[T_q, H, DK]"}
      k_cmp: {dtype: T, shape: "[C, H_kv, DK]"}
      v_cmp: {dtype: T, shape: "[C, H_kv, DV]"}
      offsets: {dtype: int32, shape: "[N + 1]", values: "prefix_sum(seq_lens)", requires: ["prefix_offsets(T_q)"]}
      chunk_offsets: {dtype: int32, shape: "[N + 1]", values: "chunk_offsets(seq_lens, bs)", requires: ["prefix_offsets(C)"]}
      token_indices: {dtype: int32, shape: "[T_q, 2]", values: "token_indices(seq_lens)", requires: ["indices_within(offsets)"]}
    outputs:
      o: {dtype: T, shape: "[T_q, H, DV]"}
      lse: {dtype: T, shape: "[T_q, H]"}
    shape_rules:
    # One query group per KV head, and the MMA the group feeds needs 16 rows.
    - "H_kv > 0 and H % H_kv == 0 and H // H_kv % 16 == 0"
    - "bs > 0"
  workloads:
  - {C: 256, H: 32, H_kv: 2, DK: 128, DV: 128, scale: 0.08838834764831845, bs: 32, seq_lens: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024], dtype_cases: [{T: float16}], label: nsa-cmp-s8k-r8-h32-d128}
  - {C: 128, H: 32, H_kv: 2, DK: 128, DV: 128, scale: 0.08838834764831845, bs: 32, seq_lens: [1024, 1024, 1024, 1024], dtype_cases: [{T: float16}], label: nsa-cmp-s4k-r4-h32-d128}
  roofline:
    # Each token scores its own request's closed chunks.
    func: "tileops.perf.formulas.nsa_cmp_fwd_varlen_roofline"

NSATopkVarlenFwdOp:
  family: attention
  status: implemented
  signature:
    forall: {N: Dim, T_q: Dim, C: Dim, H: Dim, H_kv: Dim, D: Dim, T: "DType[float16 | bfloat16]", seq_lens: "Seq[Int]"}
    params:
      scale: {type: float}
      selected_block_num: {type: int}
      bs: {type: int}
    inputs:
      q: {dtype: T, shape: "[T_q, H, D]"}
      k_cmp: {dtype: T, shape: "[C, H_kv, D]"}
      # FIXME(staged-rollout): declared and passed, but the kernel discards it.
      #
      # Broken invariant: a manifest input is read by the kernel, and this one is not.
      # Why: the top-k pass recomputes the lse itself; dropping the argument is an op
      #   signature change the NSA pipeline's callers have to move with.
      # Cleanup: drop `lse_in` here and from the kernel, or make the kernel read it.
      lse_in: {dtype: T, shape: "[T_q, H]"}
      offsets: {dtype: int32, shape: "[N + 1]", values: "prefix_sum(seq_lens)", requires: ["prefix_offsets(T_q)"]}
      chunk_offsets: {dtype: int32, shape: "[N + 1]", values: "chunk_offsets(seq_lens, bs)", requires: ["prefix_offsets(C)"]}
      token_indices: {dtype: int32, shape: "[T_q, 2]", values: "token_indices(seq_lens)", requires: ["indices_within(offsets)"]}
    outputs:
      block_indices: {dtype: int32, shape: "[T_q, H_kv, selected_block_num]"}
    shape_rules:
    - "H_kv > 0 and H % H_kv == 0 and H // H_kv % 16 == 0"
    # The selection ranks at most one block's worth of chunks against its pool.
    - "0 < selected_block_num and selected_block_num <= bs"
  workloads:
  - {C: 256, H: 32, H_kv: 2, D: 128, scale: 1.0, selected_block_num: 16, bs: 32, seq_lens: [1024, 1024, 1024, 1024, 1024, 1024, 1024, 1024], dtype_cases: [{T: float16}], label: nsa-topk-s8k-r8-h32-d128}
  - {C: 128, H: 32, H_kv: 2, D: 128, scale: 1.0, selected_block_num: 16, bs: 32, seq_lens: [1024, 1024, 1024, 1024], dtype_cases: [{T: float16}], label: nsa-topk-s4k-r4-h32-d128}
  roofline:
