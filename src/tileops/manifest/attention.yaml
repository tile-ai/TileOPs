# attention.yaml -- manifest entries for the 'attention' family.
#
# Index names shared across this family:
#   B  batch         S, S_q, S_kv  sequence lengths    H, H_kv  query and KV heads
#   D  head dim      T_q, T_kv, T_k  packed token totals  N_kv  KV pool rows
#   W  pages per request            T  element dtype
# Causal attention over rectangular calls is bottom-right aligned: query i sits at
# position i + S_kv - S_q.

MultiHeadAttentionBwdOp:
  family: attention
  status: implemented
  signature:
    forall: {B: Dim, S: Dim, H: Dim, D: Dim, T: "DType[float16 | bfloat16]"}
    params:
      is_causal: {type: bool, default: true}
    inputs:
      q: {dtype: T, shape: "[B, S, H, D]"}
      k: {dtype: T, shape: "[B, S, H, D]"}
      v: {dtype: T, shape: "[B, S, H, D]"}
      o: {dtype: T, shape: "[B, S, H, D]"}
      do: {dtype: T, shape: "[B, S, H, D]"}
      lse: {dtype: float32, shape: "[B, H, S]"}
    outputs:
      dq: {dtype: T, shape: "[B, S, H, D]"}
      dk: {dtype: T, shape: "[B, S, H, D]"}
      dv: {dtype: T, shape: "[B, S, H, D]"}
  workloads:
  - {B: 4, S: 512, H: 32, D: 128, is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-short}
  - {B: 2, S: 2048, H: 32, D: 128, is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-long}
  - {B: 2, S: 512, H: 64, D: 128, is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-short}
  - {B: 1, S: 2048, H: 64, D: 128, is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-long}
  roofline:
    # Five contractions per score; causal halves the scores.
    flops: "10 * B * H * S * S * D // 2 if is_causal else 10 * B * H * S * S * D"
  composition:
    kind: composite
    stages:
    # MHA is GQA with one KV head per query head: every kernel this op runs is
    # built by the GQA backward op it delegates to.
    - {name: gqa_backward, op: GroupedQueryAttentionBwdOp}

GroupedQueryAttentionDenseFwdOp:
  family: attention
  status: implemented
  signature:
    forall: {B: Dim, S_q: Dim, S_kv: Dim, H: Dim, H_kv: Dim, D: Dim, P_pad: Dim, T: "DType[float16 | bfloat16 | float8_e4m3fn]"}
    params:
      is_causal: {type: bool, default: true}
      window_size_left: {type: int, default: -1}
      window_size_right: {type: int, default: -1}
      sm_scale: {type: "float | None", default: null}
      softcap: {type: "float | None", default: null}
      pos_encoding_mode: {type: "'none' | 'rope'", default: none}
      rotary_dim: {type: "int | None", default: null}
      rope_layout: {type: "'neox' | 'interleaved'", default: neox}
      out_dtype: {type: "float16 | bfloat16 | None", default: null}
    inputs:
      q: {dtype: T, shape: "[B, S_q, H, D]"}
      k: {dtype: T, shape: "[B, S_kv, H_kv, D]"}
      v: {dtype: T, shape: "[B, S_kv, H_kv, D]"}
      # FP8 dequantization scales, one per batch entry and KV head.
      q_scale: {dtype: float32, shape: "[B, H_kv]", optional: true}
      k_scale: {dtype: float32, shape: "[B, H_kv]", optional: "present(q_scale)"}
      v_scale: {dtype: float32, shape: "[B, H_kv]", optional: "present(q_scale)"}
      # RoPE tables indexed by KV position and rotated pair.
      rope_cos: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[S_kv + P_pad, R // 2]", optional: "pos_encoding_mode == 'rope'"}
      rope_sin: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[S_kv + P_pad, R // 2]", optional: "pos_encoding_mode == 'rope'"}
    outputs:
      o: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[B, S_q, H, D]"}
    let:
      R: "rotary_dim.value if present(rotary_dim) else D"
    shape_rules:
    - "H_kv > 0 and H % H_kv == 0"
    - "window_size_left >= -1 and window_size_right >= -1"
    - "not is_causal or S_q <= S_kv"
    - "pos_encoding_mode != 'rope' or S_q <= S_kv"
    # FP8 input has no FP8 output: it names a 16-bit out_dtype and passes the scales.
    - "(T == 'float8_e4m3fn') == present(q_scale)"
    - "present(out_dtype) if T == 'float8_e4m3fn' else (not present(out_dtype) or out_dtype.value == T)"
    - "pos_encoding_mode == 'rope' or not present(rotary_dim)"
    - "not present(rotary_dim) or (rotary_dim.value > 0 and rotary_dim.value % 2 == 0 and rotary_dim.value <= D)"
  workloads:
  - {B: 32, S_q: 1, S_kv: 4096, H: 32, H_kv: 8, D: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: decode-llama-8b-4k}
  - {B: 8, S_q: 1, S_kv: 32768, H: 32, H_kv: 8, D: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: decode-llama-8b-32k}
  - {B: 16, S_q: 1, S_kv: 4096, H: 64, H_kv: 8, D: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: decode-llama-70b-4k}
  - {B: 4, S_q: 1, S_kv: 32768, H: 64, H_kv: 8, D: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: decode-llama-70b-32k}
  - {B: 32, S_q: 1, S_kv: 4096, H: 32, H_kv: 8, D: 128, softcap: 50.0, dtype_cases: [{T: float16}], label: decode-llama-8b-4k-softcap50}
  - {B: 1, S_q: 1, S_kv: 1024, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: decode-qwen3-30b-a3b-bs1-1k}
  - {B: 1, S_q: 1, S_kv: 4096, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: decode-qwen3-30b-a3b-bs1-4k}
  - {B: 1, S_q: 1, S_kv: 8192, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: decode-qwen3-30b-a3b-bs1-8k}
  - {B: 1, S_q: 1, S_kv: 16384, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: decode-qwen3-30b-a3b-bs1-16k}
  - {B: 1, S_q: 1, S_kv: 32768, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: decode-qwen3-30b-a3b-bs1-32k}
  - {B: 1, S_q: 1, S_kv: 65536, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: decode-qwen3-30b-a3b-bs1-64k}
  - {B: 1, S_q: 1, S_kv: 131072, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: decode-qwen3-30b-a3b-bs1-128k}
  - {B: 1, S_q: 1, S_kv: 262144, H: 32, H_kv: 4, D: 128, dtype_cases: [{T: float16}], label: decode-qwen3-30b-a3b-bs1-256k}
  - {B: 1, S_q: 256, S_kv: 1792, H: 8, H_kv: 2, D: 128, pos_encoding_mode: rope, rotary_dim: 64, P_pad: 0, dtype_cases: [{T: float16}, {T: bfloat16}], label: prefill-rope-neox-q256-kv1792}
  - {B: 1, S_q: 256, S_kv: 1792, H: 8, H_kv: 2, D: 128, out_dtype: float16, some: [q_scale], dtype_cases: [{T: float8_e4m3fn}], label: prefill-scaled-q256-kv1792}
  roofline:
    # The scores each query row sees under bottom-right alignment, the causal mask and both windows.
    func: "tileops.perf.formulas.gqa_dense_fwd_roofline"

GroupedQueryAttentionVarlenFwdOp:
  family: attention
  status: spec-only
  signature:
    forall: {B: Dim, T_q: Dim, T_kv: Dim, H: Dim, H_kv: Dim, D: Dim, P: Dim, T: "DType[float16 | bfloat16 | float8_e4m3fn]", q_lens: "Seq[Int]", kv_lens: "Seq[Int]"}
    params:
      is_causal: {type: bool, default: true}
      window_size_left: {type: int, default: -1}
      window_size_right: {type: int, default: -1}
      sm_scale: {type: "float | None", default: null}
      softcap: {type: "float | None", default: null}
      out_dtype: {type: "float16 | bfloat16 | None", default: null}
      pos_encoding_mode: {type: "'none' | 'rope'", default: none}
      rotary_dim: {type: "int | None", default: null}
      rope_layout: {type: "'neox' | 'interleaved'", default: neox}
      validate_inputs: {type: bool, default: false}
    inputs:
      q: {dtype: T, shape: "[T_q, H, D]"}
      k: {dtype: T, shape: "[T_kv, H_kv, D]"}
      v: {dtype: T, shape: "[T_kv, H_kv, D]"}
      cu_seqlens_q: {dtype: int32, shape: "[B + 1]", values: "prefix_sum(q_lens)", requires: ["prefix_offsets(T_q)"]}
      cu_seqlens_kv: {dtype: int32, shape: "[B + 1]", values: "prefix_sum(kv_lens)", requires: ["prefix_offsets(T_kv)"]}
      q_scale: {dtype: float32, shape: "[B, H_kv]", optional: true}
      k_scale: {dtype: float32, shape: "[B, H_kv]", optional: "present(q_scale)"}
      v_scale: {dtype: float32, shape: "[B, H_kv]", optional: "present(q_scale)"}
      rope_cos: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[P, R // 2]", optional: "pos_encoding_mode == 'rope'"}
      rope_sin: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[P, R // 2]", optional: "pos_encoding_mode == 'rope'"}
    outputs:
      o: {dtype: "coalesce_dtype(out_dtype, T)", shape: "[T_q, H, D]"}
    let:
      R: "rotary_dim.value if present(rotary_dim) else D"
    shape_rules:
    - "H_kv > 0 and H % H_kv == 0"
    - "window_size_left >= -1 and window_size_right >= -1"
    - "(window_size_left == -1 and window_size_right == -1) or (not present(sm_scale) and (not present(softcap) or softcap.value == 0))"
    - "(T == 'float8_e4m3fn') == present(q_scale)"
    - "present(out_dtype) if T == 'float8_e4m3fn' else (not present(out_dtype) or out_dtype.value == T)"
    - "pos_encoding_mode == 'rope' or not present(rotary_dim)"
    - "not present(rotary_dim) or (rotary_dim.value > 0 and rotary_dim.value % 2 == 0 and rotary_dim.value <= D)"
  workloads:
  - {T_q: 2048, T_kv: 2048, H: 32, H_kv: 8, D: 128, q_lens: [512, 512, 512, 512], kv_lens: [512, 512, 512, 512], is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-uniform}
  - {T_q: 1024, T_kv: 3072, H: 32, H_kv: 8, D: 128, q_lens: [512, 512], kv_lens: [1024, 2048], is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-q-lt-kv}
  - {T_q: 1024, T_kv: 3072, H: 64, H_kv: 8, D: 128, q_lens: [512, 512], kv_lens: [1024, 2048], is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-q-lt-kv}
  - {T_q: 2048, T_kv: 2048, H: 32, H_kv: 8, D: 128, q_lens: [512, 512, 512, 512], kv_lens: [512, 512, 512, 512], is_causal: true, window_size_left: 256, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-short-w256}
  - {T_q: 8192, T_kv: 8192, H: 32, H_kv: 8, D: 128, q_lens: [2048, 2048, 2048, 2048], kv_lens: [2048, 2048, 2048, 2048], is_causal: true, window_size_left: 1024, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-long-w1024}
  - {T_q: 2048, T_kv: 2048, H: 64, H_kv: 8, D: 128, q_lens: [512, 512, 512, 512], kv_lens: [512, 512, 512, 512], is_causal: true, window_size_left: 256, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-short-w256}
  - {T_q: 8192, T_kv: 8192, H: 64, H_kv: 8, D: 128, q_lens: [2048, 2048, 2048, 2048], kv_lens: [2048, 2048, 2048, 2048], is_causal: true, window_size_left: 1024, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-long-w1024}
  roofline:
    func: "tileops.perf.formulas.gqa_varlen_fwd_roofline"

# Compatibility contracts kept implemented until the unified Varlen Op has
# migrated its remaining FP8 and RoPE capabilities.
GroupedQueryAttentionPrefillVarlenFwdOp:
  family: attention
  status: implemented
  signature:
    forall: {B: Dim, T_q: Dim, T_kv: Dim, H: Dim, H_kv: Dim, D: Dim, T: "DType[float16 | bfloat16]", q_lens: "Seq[Int]", kv_lens: "Seq[Int]"}
    params:
      max_seqlen_q: {type: int}
      max_seqlen_kv: {type: int}
      is_causal: {type: bool, default: true}
      sm_scale: {type: "float | None", default: null}
      softcap: {type: "float | None", default: null}
      validate_inputs: {type: bool, default: false}
    inputs:
      q: {dtype: T, shape: "[T_q, H, D]"}
      k: {dtype: T, shape: "[T_kv, H_kv, D]"}
      v: {dtype: T, shape: "[T_kv, H_kv, D]"}
      cu_seqlens_q: {dtype: int32, shape: "[B + 1]", values: "prefix_sum(q_lens)", requires: ["prefix_offsets(T_q)", "max_segment(max_seqlen_q)"]}
      cu_seqlens_kv: {dtype: int32, shape: "[B + 1]", values: "prefix_sum(kv_lens)", requires: ["prefix_offsets(T_kv)", "max_segment(max_seqlen_kv)"]}
    outputs:
      o: {dtype: T, shape: "[T_q, H, D]"}
    shape_rules:
    - "H_kv > 0 and H % H_kv == 0"
    - "max_seqlen_q > 0 and max_seqlen_kv > 0"
  workloads:
  - {T_q: 2048, T_kv: 2048, H: 32, H_kv: 8, D: 128, q_lens: [512, 512, 512, 512], kv_lens: [512, 512, 512, 512], max_seqlen_q: 512, max_seqlen_kv: 512, is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-uniform}
  - {T_q: 1024, T_kv: 3072, H: 32, H_kv: 8, D: 128, q_lens: [512, 512], kv_lens: [1024, 2048], max_seqlen_q: 512, max_seqlen_kv: 2048, is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-8b-q-lt-kv}
  - {T_q: 1024, T_kv: 3072, H: 64, H_kv: 8, D: 128, q_lens: [512, 512], kv_lens: [1024, 2048], max_seqlen_q: 512, max_seqlen_kv: 2048, is_causal: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: llama-70b-q-lt-kv}
  roofline:
    # Scores per request, from the lengths the call packs.
    func: "tileops.perf.formulas.gqa_prefill_varlen_fwd_roofline"

GroupedQueryAttentionSlidingWindowVarlenFwdOp:
  family: attention
  status: implemented
  signature:
    forall: {B: Dim, T_q: Dim, T_k: Dim, H: Dim, H_kv: Dim, D: Dim, T: "DType[float16 | bfloat16]", q_lens: "Seq[Int]", k_lens: "Seq[Int]"}
    params:
      max_seqlen_q: {type: int}
      is_causal: {type: bool, default: true}
      window_size_left: {type: int, default: -1}
      window_size_right: {type: int, default: -1}
    inputs:
      q: {dtype: T, shape: "[T_q, H, D]"}
      k: {dtype: T, shape: "[T_k, H_kv, D]"}
      v: {dtype: T, shape: "[T_k, H_kv, D]"}
      cu_seqlens_q: {dtype: int32, shape: "[B + 1]", values: "prefix_sum(q_lens)", requires: ["prefix_offsets(T_q)", "max_segment(max_seqlen_q)"]}
      cu_seqlens_k: {dtype: int32, shape: "[B + 1]", values: "prefix_sum(k_lens)", requires: ["prefix_offsets(T_k)"]}
    outputs:
      o: {dtype: T, shape: "[T_q, H, D]"}
