MoePermuteAlignFwdOp:
  ref_api: "none"
  family: moe
  status: implemented
  torch_compile_fullgraph: true

  signature:
    inputs:
      topk_ids: {dtype: "int32"}
    outputs:
      sorted_token_ids: {dtype: "int32"}
      expert_ids: {dtype: "int32"}
      num_tokens_post_pad: {dtype: "int32"}
    params:
      total_tokens: {type: int}
      top_k: {type: int}
      num_experts: {type: int}
      block_size: {type: int, default: 64}
    shape_rules:
    - "topk_ids.shape == (total_tokens, top_k)"

  workloads:
    # Kimi K2: E=384, K=8, block_size=64
  - {total_tokens: 1, top_k: 8, num_experts: 384, block_size: 64, dtypes: [int32], label: "kimi-k2-decode"}
  - {total_tokens: 32, top_k: 8, num_experts: 384, block_size: 64, dtypes: [int32], label: "kimi-k2-small"}
  - {total_tokens: 512, top_k: 8, num_experts: 384, block_size: 64, dtypes: [int32], label: "kimi-k2-medium"}
  - {total_tokens: 4096, top_k: 8, num_experts: 384, block_size: 64, dtypes: [int32], label: "kimi-k2-prefill"}
    # DeepSeek-V3: E=256, K=8, block_size=64
  - {total_tokens: 1, top_k: 8, num_experts: 256, block_size: 64, dtypes: [int32], label: "deepseek-v3-decode"}
  - {total_tokens: 32, top_k: 8, num_experts: 256, block_size: 64, dtypes: [int32], label: "deepseek-v3-small"}
  - {total_tokens: 512, top_k: 8, num_experts: 256, block_size: 64, dtypes: [int32], label: "deepseek-v3-medium"}
  - {total_tokens: 4096, top_k: 8, num_experts: 256, block_size: 64, dtypes: [int32], label: "deepseek-v3-prefill"}
    # Qwen3: E=128, K=8, block_size=64
  - {total_tokens: 1, top_k: 8, num_experts: 128, block_size: 64, dtypes: [int32], label: "qwen3-decode"}
  - {total_tokens: 32, top_k: 8, num_experts: 128, block_size: 64, dtypes: [int32], label: "qwen3-small"}
  - {total_tokens: 512, top_k: 8, num_experts: 128, block_size: 64, dtypes: [int32], label: "qwen3-medium"}
  - {total_tokens: 4096, top_k: 8, num_experts: 128, block_size: 64, dtypes: [int32], label: "qwen3-prefill"}

  roofline:
    # Permute-align is integer index computation; no FLOPs
    flops: "0"
    # topk_ids read + sorted_token_ids write + expert_ids write + num_post_pad write (all int32)
    bytes: "total_tokens * top_k * 4 + (total_tokens * top_k + (num_experts + 1) * (block_size - 1)) * 4 + ceil((total_tokens * top_k + (num_experts + 1) * (block_size - 1)) / block_size) * 4 + 4"

  source:
    kernel: tileops/kernels/moe/permute_align.py
    op: tileops/ops/moe/permute_align.py
    test: tests/ops/test_moe_permute_align.py
    bench: benchmarks/ops/bench_moe_permute_align.py
    bench_manifest_driven: true
    kernel_map:
      permute_align_kernel: MoePermuteAlignKernel

MoePermuteNopadFwdOp:
  ref_api: "none"
  family: moe
  status: implemented
  torch_compile_fullgraph: true

  signature:
    inputs:
      hidden_states: {dtype: "float16 | bfloat16"}
      topk_ids: {dtype: "int32"}
      # Expert parallelism: supplied when this rank owns num_experts_local of the
      # num_experts global experts, absent when it owns them all. Presence picks
      # the scan kernel; the ids inside are read only at launch.
      expert_map: {dtype: "int32", optional: true}
    outputs:
      perm_h: {dtype: "same_as(hidden_states)"}
      true_offsets: {dtype: "int32"}
      true_sizes: {dtype: "int32"}
      expert_first_token_offset: {dtype: "int64"}
      fwd_idx: {dtype: "int32"}
    params:
      num_experts: {type: int}
      # Sizes the scan kernel's shared counters and its four per-expert outputs,
      # so it is fixed at construction. Equals num_experts without EP.
      num_experts_local: {type: int}
    shape_rules:
    - "hidden_states.ndim == 2"
    - "topk_ids.ndim == 2"
    - "topk_ids.shape[0] == hidden_states.shape[0]"
    - "expert_map is None or expert_map.shape == (num_experts,)"
    - "perm_h.shape == (hidden_states.shape[0] * topk_ids.shape[1], hidden_states.shape[1])"
    - "true_offsets.shape == (num_experts_local,)"
    - "true_sizes.shape == (num_experts_local,)"
    - "expert_first_token_offset.shape == (num_experts_local + 1,)"
    - "fwd_idx.shape == (hidden_states.shape[0] * topk_ids.shape[1],)"

  workloads:
    # Kimi K2: H=7168, E=384, K=8
  - {hidden_states_shape: [1, 7168], topk_ids_shape: [1, 8], num_experts: 384, num_experts_local: 384, dtypes: [bfloat16], label: "kimi-k2-decode"}
  - {hidden_states_shape: [32, 7168], topk_ids_shape: [32, 8], num_experts: 384, num_experts_local: 384, dtypes: [bfloat16], label: "kimi-k2-small"}
  - {hidden_states_shape: [512, 7168], topk_ids_shape: [512, 8], num_experts: 384, num_experts_local: 384, dtypes: [bfloat16], label: "kimi-k2-medium"}
  - {hidden_states_shape: [4096, 7168], topk_ids_shape: [4096, 8], num_experts: 384, num_experts_local: 384, dtypes: [bfloat16], label: "kimi-k2-prefill"}
    # DeepSeek-V3: H=7168, E=256, K=8
  - {hidden_states_shape: [1, 7168], topk_ids_shape: [1, 8], num_experts: 256, num_experts_local: 256, dtypes: [bfloat16], label: "deepseek-v3-decode"}
  - {hidden_states_shape: [32, 7168], topk_ids_shape: [32, 8], num_experts: 256, num_experts_local: 256, dtypes: [bfloat16], label: "deepseek-v3-small"}
  - {hidden_states_shape: [512, 7168], topk_ids_shape: [512, 8], num_experts: 256, num_experts_local: 256, dtypes: [bfloat16], label: "deepseek-v3-medium"}
  - {hidden_states_shape: [4096, 7168], topk_ids_shape: [4096, 8], num_experts: 256, num_experts_local: 256, dtypes: [bfloat16], label: "deepseek-v3-prefill"}
    # Qwen3-235B-A22B: H=7168, E=128, K=8
  - {hidden_states_shape: [1, 7168], topk_ids_shape: [1, 8], num_experts: 128, num_experts_local: 128, dtypes: [bfloat16], label: "qwen3-235b-decode"}
  - {hidden_states_shape: [32, 7168], topk_ids_shape: [32, 8], num_experts: 128, num_experts_local: 128, dtypes: [bfloat16], label: "qwen3-235b-small"}
  - {hidden_states_shape: [512, 7168], topk_ids_shape: [512, 8], num_experts: 128, num_experts_local: 128, dtypes: [bfloat16], label: "qwen3-235b-medium"}
  - {hidden_states_shape: [4096, 7168], topk_ids_shape: [4096, 8], num_experts: 128, num_experts_local: 128, dtypes: [bfloat16], label: "qwen3-235b-prefill"}
    # Qwen3-30B-A3B: H=3072, E=128, K=8
  - {hidden_states_shape: [1, 3072], topk_ids_shape: [1, 8], num_experts: 128, num_experts_local: 128, dtypes: [bfloat16], label: "qwen3-30b-decode"}
  - {hidden_states_shape: [32, 3072], topk_ids_shape: [32, 8], num_experts: 128, num_experts_local: 128, dtypes: [bfloat16], label: "qwen3-30b-small"}
  - {hidden_states_shape: [512, 3072], topk_ids_shape: [512, 8], num_experts: 128, num_experts_local: 128, dtypes: [bfloat16], label: "qwen3-30b-medium"}
  - {hidden_states_shape: [4096, 3072], topk_ids_shape: [4096, 8], num_experts: 128, num_experts_local: 128, dtypes: [bfloat16], label: "qwen3-30b-prefill"}
    # Two-way expert parallelism over the DeepSeek-V3 and Qwen3-235B expert tables.
  - {hidden_states_shape: [1, 7168], topk_ids_shape: [1, 8], num_experts: 256, num_experts_local: 128, expert_map_shape: [256], dtypes: [bfloat16], label: "deepseek-v3-ep2-decode"}
  - {hidden_states_shape: [512, 7168], topk_ids_shape: [512, 8], num_experts: 256, num_experts_local: 128, expert_map_shape: [256], dtypes: [bfloat16], label: "deepseek-v3-ep2-medium"}
  - {hidden_states_shape: [4096, 7168], topk_ids_shape: [4096, 8], num_experts: 256, num_experts_local: 128, expert_map_shape: [256], dtypes: [bfloat16], label: "deepseek-v3-ep2-prefill"}
  - {hidden_states_shape: [512, 7168], topk_ids_shape: [512, 8], num_experts: 128, num_experts_local: 64, expert_map_shape: [128], dtypes: [bfloat16], label: "qwen3-235b-ep2-medium"}

  # Func mode: the map plane is read only when the map is supplied, so the byte
  # count turns on a presence fact no inline expression can carry.
  roofline:
    func: "tileops.perf.formulas.moe_permute_nopad_fwd_roofline"

  source:
    kernel: tileops/kernels/moe/permute_nopad.py
    op: tileops/ops/moe/routed_expert/permute_nopad.py
    test: tests/ops/test_moe_permute_nopad.py
    bench: benchmarks/ops/bench_moe_permute_nopad.py
    bench_manifest_driven: true
    kernel_map:
      permute_nopad_kernel: MoePermuteNopadKernel

MoeUnpermuteFwdOp:
  ref_api: "none"
  family: moe
  status: implemented
  torch_compile_fullgraph: true

  signature:
    inputs:
      mm2_pad: {dtype: "float16 | bfloat16"}
      fwd_idx: {dtype: "int32"}
      topk_weights: {dtype: "float32"}
    outputs:
      output: {dtype: "same_as(mm2_pad)"}
    params:
      total_tokens: {type: int}
      top_k: {type: int}
      hidden_size: {type: int}
      # Optional caller-provided output buffer (forward(out=...)); when omitted
      # the op allocates. default: null marks it non-required so workloads need
      # not specify it; declared so forward()'s out param matches the spec.
      out: {type: tensor, default: null}
    shape_rules:
    - "output.shape == (total_tokens, hidden_size)"

  workloads:
    # Kimi K2 / DeepSeek-V3 / Qwen3-235B-A22B: H=7168, K=8
  - {total_tokens: 1, top_k: 8, hidden_size: 7168, dtypes: [bfloat16], label: "large-hidden-decode"}
  - {total_tokens: 32, top_k: 8, hidden_size: 7168, dtypes: [bfloat16], label: "large-hidden-small"}
  - {total_tokens: 512, top_k: 8, hidden_size: 7168, dtypes: [bfloat16], label: "large-hidden-medium"}
  - {total_tokens: 4096, top_k: 8, hidden_size: 7168, dtypes: [bfloat16], label: "large-hidden-prefill"}
    # Qwen3-30B-A3B: H=3072, K=8
  - {total_tokens: 1, top_k: 8, hidden_size: 3072, dtypes: [bfloat16], label: "small-hidden-decode"}
  - {total_tokens: 32, top_k: 8, hidden_size: 3072, dtypes: [bfloat16], label: "small-hidden-small"}
  - {total_tokens: 512, top_k: 8, hidden_size: 3072, dtypes: [bfloat16], label: "small-hidden-medium"}
  - {total_tokens: 4096, top_k: 8, hidden_size: 3072, dtypes: [bfloat16], label: "small-hidden-prefill"}

  roofline:
    # multiply + add per element per expert slot: 2 * T*K * H
    flops: "2 * total_tokens * top_k * hidden_size"
    # mm2_pad read [T*K, H] + output write [T, H] + fwd_idx read [T*K]*4 + topk_weights read [T*K]*4
    bytes: "(total_tokens * top_k * hidden_size + total_tokens * hidden_size) * elem_bytes + total_tokens * top_k * 4 + total_tokens * top_k * 4"

  source:
    kernel: tileops/kernels/moe/unpermute.py
    op: tileops/ops/moe/routed_expert/unpermute.py
    test: tests/ops/test_moe_unpermute.py
    bench: benchmarks/ops/bench_moe_unpermute.py
    bench_manifest_driven: true
    kernel_map:
      unpermute_kernel: MoeUnpermuteKernel

MoeGroupedGemmNopadFwdOp:
  ref_api: "none"
  family: moe
  status: implemented
  torch_compile_fullgraph: true

  signature:
    inputs:
      a: {dtype: "float16 | bfloat16", shape: [numel, k]}
      b: {dtype: "same_as(a)", shape: [num_experts, n, k]}
      true_sizes: {dtype: "int32", shape: [num_experts]}
      true_offsets: {dtype: "int32", shape: [num_experts]}
    outputs:
      c: {dtype: "same_as(a)", shape: [numel, n]}
    params:
      numel: {type: int}
      num_experts: {type: int}
      n: {type: int}
      k: {type: int}

  workloads:
    # Tight grouped-GEMM shapes representative of DeepSeek-V3 MoE
    # (E=256, K=8, H=7168, F=2048; numel = num_tokens * top_k).
  - {numel: 4096, num_experts: 256, n: 4096, k: 7168, dtypes: [bfloat16], label: "deepseek-v3-decode-gate-up"}
  - {numel: 32768, num_experts: 256, n: 4096, k: 7168, dtypes: [bfloat16], label: "deepseek-v3-prefill-gate-up"}
  - {numel: 4096, num_experts: 256, n: 7168, k: 2048, dtypes: [bfloat16], label: "deepseek-v3-decode-down"}
  - {numel: 32768, num_experts: 256, n: 7168, k: 2048, dtypes: [bfloat16], label: "deepseek-v3-prefill-down"}

  roofline:
    flops: "2 * numel * n * k"
    bytes: "(numel * k + num_experts * n * k + numel * n) * elem_bytes"

  source:
    kernel: tileops/kernels/moe/moe_grouped_gemm_nopad.py
    op: tileops/ops/moe/routed_expert/moe_grouped_gemm_nopad.py
    test: tests/ops/test_moe_grouped_gemm_nopad.py
    bench: benchmarks/ops/bench_moe_grouped_gemm_nopad.py
    bench_manifest_driven: true
    kernel_map:
      moe_grouped_gemm_kernel: MoeGroupedGemmNopadKernel
      moe_grouped_gemm_persistent_kernel: GroupedGemmPersistent3WGKernel

MoeGateUpFwdOp:
  ref_api: "none"
  family: moe
  status: implemented
  torch_compile_fullgraph: true

  signature:
    inputs:
      a: {dtype: "float16 | bfloat16", shape: [numel, k]}
      # gate and up stacked, so the GEMM is 2 * ffn wide and the gated
      # activation in the epilogue halves it.
      b: {dtype: "same_as(a)", shape: [num_experts, two_ffn, k]}
      true_sizes: {dtype: "int32", shape: [num_experts]}
      true_offsets: {dtype: "int32", shape: [num_experts]}
    outputs:
      c: {dtype: "same_as(a)", shape: [numel, ffn]}
    params:
      numel: {type: int}
      num_experts: {type: int}
      ffn: {type: int}
      k: {type: int}
      activation: {type: str, default: silu_and_mul}
    shape_rules:
    - "b.shape[1] == 2 * c.shape[1]"
    - "a.shape[0] == c.shape[0]"

  workloads:
    # gate/up shapes of the DeepSeek-V3 MoE expert pipeline
    # (E=256, K=8, H=7168, F=2048; numel = num_tokens * top_k).
  - {numel: 4096, num_experts: 256, ffn: 2048, k: 7168, dtypes: [bfloat16], label: "deepseek-v3-decode-gate-up"}
  - {numel: 32768, num_experts: 256, ffn: 2048, k: 7168, dtypes: [bfloat16], label: "deepseek-v3-prefill-gate-up"}

  roofline:
    # The GEMM is 2 * ffn wide; the activation epilogue is not counted.
    flops: "4 * numel * ffn * k"
    bytes: "(numel * k + num_experts * 2 * ffn * k + numel * ffn) * elem_bytes"

  source:
    kernel:
    - tileops/kernels/moe/moe_grouped_gemm_persistent_3wg_fused_act.py
    - tileops/kernels/moe/moe_grouped_gemm_separate_act.py
    op: tileops/ops/moe/routed_expert/gate_up.py
    test: tests/ops/test_moe_gate_up.py
    bench: benchmarks/ops/bench_moe_gate_up.py
    bench_manifest_driven: true
    kernel_map:
      moe_grouped_gemm_fused_act_kernel: MoeGroupedGemmPersistent3WGFusedActKernel
      moe_grouped_gemm_act_kernel: MoeGroupedGemmSeparateActKernel
      moe_grouped_gemm_kernel: MoeGroupedGemmNopadKernel
      moe_grouped_gemm_persistent_kernel: GroupedGemmPersistent3WGKernel

FusedMoEExpertsNopadPersistent3WGFwdOp:
  ref_api: "none"
  family: moe
  status: implemented

  signature:
    inputs:
      output:
        dtype: same_as(hidden_states)
        note: pre-allocated output buffer
      hidden_states:
        dtype: float16 | bfloat16
      w_gate_up:
        dtype: same_as(hidden_states)
      w_down:
        dtype: same_as(hidden_states)
      topk_weights:
        dtype: float32
      topk_ids:
        dtype: int32
      workspace1:
        dtype: float16 | bfloat16
        note: scratch buffer, may be empty
      workspace2:
        dtype: float16 | bfloat16
        note: scratch buffer, may be empty
      # Expert parallelism: supplied when the weights are this rank's slice of
      # the global expert table, absent when they are the whole table.
      expert_map:
        dtype: int32
        optional: true
    outputs:
      output: {dtype: "same_as(hidden_states)"}
    params:
      num_tokens: {type: int}
      num_experts:
        type: int
      # Sizes the weights, both grouped GEMMs and the permute stage. Equals
      # num_experts without EP.
      num_experts_local: {type: int}
      top_k: {type: int}
      hidden_size: {type: int}
      ffn_size: {type: int}
      routed_scaling_factor: {type: float, default: 1.0}
      activation: {type: str, default: silu_and_mul, kw_only: true}
    shape_rules:
    - "hidden_states.shape == (num_tokens, hidden_size)"
    - "w_gate_up.shape     == (num_experts_local, 2 * ffn_size, hidden_size)"
    - "w_down.shape        == (num_experts_local, hidden_size, ffn_size)"
    - "topk_weights.shape  == (num_tokens, top_k)"
    - "topk_ids.shape      == (num_tokens, top_k)"
    - "expert_map is None or expert_map.shape == (num_experts,)"
    - "output.shape        == (num_tokens, hidden_size)"

  workloads:
    # Qwen3-235B-A22B: H=7168, F=2048, E=128, K=8
  - {num_tokens: 512, num_experts: 128, num_experts_local: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [bfloat16], label: "qwen3-235b-decode"}
  - {num_tokens: 4096, num_experts: 128, num_experts_local: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [bfloat16], label: "qwen3-235b-prefill"}
    # DeepSeek-V3: H=7168, F=2048, E=256, K=8
  - {num_tokens: 512, num_experts: 256, num_experts_local: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [bfloat16], label: "deepseek-v3-decode"}
  - {num_tokens: 4096, num_experts: 256, num_experts_local: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [bfloat16], label: "deepseek-v3-prefill"}
    # Two-way expert parallelism over the DeepSeek-V3 expert table.
  - {num_tokens: 512, num_experts: 256, num_experts_local: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, expert_map_shape: [256], dtypes: [bfloat16], label: "deepseek-v3-ep2-decode"}
  - {num_tokens: 4096, num_experts: 256, num_experts_local: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, expert_map_shape: [256], dtypes: [bfloat16], label: "deepseek-v3-ep2-prefill"}

  roofline:
    flops: "num_tokens * top_k * 6 * ffn_size * hidden_size"
    bytes: "(num_experts_local * 3 * ffn_size * hidden_size + 2 * num_tokens * hidden_size) * elem_bytes"

  source:
    kernel: tileops/kernels/moe/moe_grouped_gemm_nopad.py
    op: tileops/ops/moe/routed_expert/fused_routed_expert.py
    test: tests/ops/test_fused_moe_experts.py
    bench: benchmarks/ops/bench_fused_moe_experts.py
    bench_manifest_driven: true
    kernel_map:
      permute_nopad_kernel: MoePermuteNopadKernel
      moe_grouped_gemm_kernel: MoeGroupedGemmNopadKernel
      moe_grouped_gemm_persistent_kernel: GroupedGemmPersistent3WGKernel
      moe_grouped_gemm_fused_act_kernel: MoeGroupedGemmPersistent3WGFusedActKernel
      silu_and_mul: SiluAndMulFwdKernel
      gelu_and_mul: GeluAndMulFwdKernel
      unpermute_kernel: MoeUnpermuteKernel

FusedMoeFwdOp:
  ref_api: "none"
  # correction_bias, when passed, is added to sigmoid scores for top-k selection
  # only; the returned weights stay the unbiased scores (Kimi K2 routing).
  family: moe
  status: implemented

  signature:
    inputs:
      hidden_states: {dtype: "float16 | bfloat16"}
      gating_output: {dtype: "float32"}
      w_gate_up: {dtype: "same_as(hidden_states)"}
      w_down: {dtype: "same_as(hidden_states)"}
      correction_bias: {dtype: "float32", optional: true}
    outputs:
      output: {dtype: "same_as(hidden_states)"}
    params:
      num_tokens: {type: int}
      num_experts: {type: int}
      top_k: {type: int}
      hidden_size: {type: int}
      ffn_size: {type: int}
      scoring_func: {type: str, default: softmax}
      renormalize: {type: bool, default: false}
      routed_scaling_factor: {type: float, default: 1.0}
      activation: {type: str, default: silu_and_mul, kw_only: true}
    shape_rules:
    - "hidden_states.shape == (num_tokens, hidden_size)"
    - "gating_output.shape == (num_tokens, num_experts)"
    - "correction_bias is None or correction_bias.shape == (num_experts,)"
    - "output.shape        == (num_tokens, hidden_size)"

  workloads:
    # Qwen3-235B-A22B: scoring_func=softmax
  - {num_tokens: 512, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: softmax, renormalize: false, dtypes: [bfloat16], label: "qwen3-235b-decode"}
  - {num_tokens: 4096, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: softmax, renormalize: false, dtypes: [bfloat16], label: "qwen3-235b-prefill"}
