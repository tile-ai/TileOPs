MoePermuteAlignFwdOp:
  family: moe
  status: implemented
  signature:
    forall: {T: Dim, K: Dim}
    params:
      num_experts: {type: int}
      # GEMM tile height (M) each expert's token count is padded to.
      block_size: {type: int, default: 64}
    inputs:
      topk_ids: {dtype: int32, shape: "[T, K]", values: "topk_ids(T, K, num_experts)", requires: ["in_range(0, num_experts)"]}
    let:
      # Worst-case padded length: every expert, plus the invalid-id bucket, pads one partial block.
      P: "T * K + (num_experts + 1) * (block_size - 1)"
    outputs:
      sorted_token_ids: {dtype: int32, shape: "[P]"}
      expert_ids: {dtype: int32, shape: "[ceil_div(P, block_size)]"}
      num_tokens_post_pad: {dtype: int32, shape: "[1]"}
    shape_rules:
    - "num_experts > 0"
    - "block_size > 0"
  workloads:
    # Kimi K2: E=384, K=8, block_size=64
  - {T: 1, K: 8, num_experts: 384, block_size: 64, label: "kimi-k2-decode"}
  - {T: 32, K: 8, num_experts: 384, block_size: 64, label: "kimi-k2-small"}
  - {T: 512, K: 8, num_experts: 384, block_size: 64, label: "kimi-k2-medium"}
  - {T: 4096, K: 8, num_experts: 384, block_size: 64, label: "kimi-k2-prefill"}
    # DeepSeek-V3: E=256, K=8, block_size=64
  - {T: 1, K: 8, num_experts: 256, block_size: 64, label: "deepseek-v3-decode"}
  - {T: 32, K: 8, num_experts: 256, block_size: 64, label: "deepseek-v3-small"}
  - {T: 512, K: 8, num_experts: 256, block_size: 64, label: "deepseek-v3-medium"}
  - {T: 4096, K: 8, num_experts: 256, block_size: 64, label: "deepseek-v3-prefill"}
    # Qwen3: E=128, K=8, block_size=64
  - {T: 1, K: 8, num_experts: 128, block_size: 64, label: "qwen3-decode"}
  - {T: 32, K: 8, num_experts: 128, block_size: 64, label: "qwen3-small"}
  - {T: 512, K: 8, num_experts: 128, block_size: 64, label: "qwen3-medium"}
  - {T: 4096, K: 8, num_experts: 128, block_size: 64, label: "qwen3-prefill"}
  roofline:
    # Integer index computation only.
    flops: "0"

FusedMoEExpertsFwdOp:
  ref_api: "none"
  family: moe
  status: implemented

  signature:
    inputs:
      output:
        dtype: same_as(hidden_states)
        mutated: true
        note: pre-allocated output buffer
      hidden_states:
        dtype: float16 | bfloat16
      w_gate_up:
        dtype: same_as(hidden_states)
      w_down:
        dtype: same_as(hidden_states)
      topk_weights:
        dtype: float32
      topk_ids:
        dtype: int32
    outputs:
      output: {dtype: "same_as(hidden_states)"}
    params:
      num_tokens: {type: int}
      num_experts:
        type: int
      top_k: {type: int}
      hidden_size: {type: int}
      ffn_size: {type: int}
      routed_scaling_factor: {type: float, default: 1.0}
      activation: {type: str, default: silu_and_mul, kw_only: true}
    shape_rules:
    - "hidden_states.shape == (num_tokens, hidden_size)"
    - "w_gate_up.shape     == (num_experts, 2 * ffn_size, hidden_size)"
    - "w_down.shape        == (num_experts, hidden_size, ffn_size)"
    - "topk_weights.shape  == (num_tokens, top_k)"
    - "topk_ids.shape      == (num_tokens, top_k)"
    - "output.shape        == (num_tokens, hidden_size)"

  workloads:
    # Qwen3-235B-A22B: H=7168, F=2048, E=128, K=8
  - {num_tokens: 512, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [float16, bfloat16], label: "qwen3-235b-decode"}
  - {num_tokens: 4096, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [float16, bfloat16], label: "qwen3-235b-prefill"}
    # DeepSeek-V3: H=7168, F=2048, E=256, K=8
  - {num_tokens: 512, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [float16, bfloat16], label: "deepseek-v3-decode"}
  - {num_tokens: 4096, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [float16, bfloat16], label: "deepseek-v3-prefill"}

  roofline:
    # Only the experts topk_ids selects are read, so the weight term needs the call.
    func: "tileops.perf.formulas.routed_expert_mlp_roofline"
    composition:
    - stage: pre_permute
      formula: "gather only: no flops, one read and one write of the routed rows"
    - stage: expert_mlp
      formula: "rows * (6 * ffn_size * hidden_size + 6 * ffn_size) over the routed rows"
    - stage: post_permute
      formula: "weighted reduce: 2 * num_tokens * top_k * hidden_size"

  source:
    kernel: tileops/kernels/moe/moe_grouped_gemm.py
    op: tileops/ops/moe/routed_expert/fused_routed_expert.py
    test: tests/ops/test_fused_moe_experts.py
    bench: benchmarks/ops/bench_fused_moe_experts.py
    bench_manifest_driven: true
    kernel_map:
      contiguous: MoePrePermuteContiguousKernel
      grouped_gemm: MoeGroupedGemmKernel
      unpermute_kernel: MoeUnpermuteKernel

  composition:
    kind: composite
    stages:
    - name: pre_permute
      op: MoePrePermuteFwdOp
    - name: expert_mlp
      op: MoeExpertMLPFwdOp
      variants:
      # __init__ picks the path once, for the whole pipeline: the indexed
      # variant's kernels subsume pre_permute and post_permute as well.
      - name: tight
        stages:
        - op: MoePrePermuteFwdOp
        - op: MoeExpertMLPFwdOp
        - op: MoePostPermuteFwdOp
      - name: indexed_small_route
        condition: "silu_and_mul, hidden_size % 128 == 0, ffn_size % 256 == 0, and num_tokens * top_k <= 2 * num_experts; replaces pre_permute and post_permute too"
        stages:
        - op: IndexedExpertMLPFwdOp
    - name: post_permute
      op: MoePostPermuteFwdOp

  resources:
    workspaces:
    - name: workspace1
      dtype: float16 | bfloat16
      owner: expert_mlp
      kind: scratch
      note: empty on the tight path; route-major gate/up buffer on the indexed path
    - name: workspace2
      dtype: float16 | bfloat16
      owner: expert_mlp
      kind: scratch
      note: empty on the tight path; route-major down buffer on the indexed path

IndexedExpertMLPFwdOp:
  # Route-major expert MLP: each of the T * K routes is a row of its expert's GEMM, so
  # the weights are read once per route instead of once per expert segment. Chosen by
  # FusedMoEExpertsFwdOp on small-route shapes; the kernels require SM90.
  ref_api: "none"
  family: moe
  status: implemented

  signature:
    inputs:
      output:
        dtype: same_as(hidden_states)
        mutated: true
        note: pre-allocated output buffer
      hidden_states:
        dtype: float16 | bfloat16
      w_gate_up:
        dtype: same_as(hidden_states)
      w_down:
        dtype: same_as(hidden_states)
      topk_weights:
        dtype: float32
      topk_ids:
        dtype: int32
      workspace1:
        dtype: float16 | bfloat16
        mutated: true
        note: route-major gate/up result, followed by the route statistics
      workspace2:
        dtype: float16 | bfloat16
        mutated: true
        note: route-major down result, reduced into output
    outputs:
      output: {dtype: "same_as(hidden_states)"}
    params:
      num_tokens: {type: int}
      num_experts: {type: int}
      top_k: {type: int}
      hidden_size: {type: int}
      ffn_size: {type: int}
      routed_scaling_factor: {type: float, default: 1.0}
    shape_rules:
    - "hidden_states.shape == (num_tokens, hidden_size)"
    - "w_gate_up.shape     == (num_experts, 2 * ffn_size, hidden_size)"
    - "w_down.shape        == (num_experts, hidden_size, ffn_size)"
    - "topk_weights.shape  == (num_tokens, top_k)"
    - "topk_ids.shape      == (num_tokens, top_k)"
    - "output.shape        == (num_tokens, hidden_size)"
    # workspace1 holds the route-major gate/up result and, above one token, the route
    # statistics after it; only the first part has a size the manifest can name.
    - "workspace1.shape[0] >= num_tokens * top_k * ffn_size"
    - "workspace2.shape    == (num_tokens * top_k * hidden_size,)"

  workloads:
    # DeepSeek-V3: H=7168, F=2048, E=256, K=8
  - {num_tokens: 1, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [float16, bfloat16], label: "deepseek-v3-decode-1"}
  - {num_tokens: 32, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [float16, bfloat16], label: "deepseek-v3-decode-32"}
  - {num_tokens: 64, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [float16, bfloat16], label: "deepseek-v3-decode-64"}
    # Qwen3-235B-A22B: H=7168, F=2048, E=128, K=8
  - {num_tokens: 32, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, dtypes: [float16, bfloat16], label: "qwen3-235b-decode-32"}

  roofline:
    # Only the experts topk_ids selects are read, so the weight term needs the call.
    func: "tileops.perf.formulas.routed_expert_mlp_roofline"

  source:
    kernel: tileops/kernels/moe/indexed_expert_gemm.py
    op: tileops/ops/moe/routed_expert/indexed_routed_expert.py
    test: tests/ops/test_fused_moe_experts.py
    bench: benchmarks/ops/bench_fused_moe_experts.py
    bench_manifest_driven: true
    kernel_map:
      route_stats: IndexedRouteStatsKernel
      expert_gemm: IndexedExpertGemmTemplate
      weighted_reduce: IndexedWeightedReduceKernel

FusedTopKFwdOp:
  family: moe
  status: implemented
  signature:
    forall: {T: Dim, E: Dim, G: "DType[float16 | bfloat16 | float32]"}
    params:
      top_k: {type: int}
      scoring_func: {type: "'softmax' | 'sigmoid'", default: softmax}
      renormalize: {type: bool, default: false}
    inputs:
      gating_output: {dtype: G, shape: "[T, E]", contiguous: true}
      # Added to the sigmoid scores for the selection only; the returned weights stay the
      # unbiased scores (Kimi K2 routing).
      correction_bias: {dtype: float32, shape: "[E]", optional: true, contiguous: true}
    outputs:
      topk_weights: {dtype: float32, shape: "[T, top_k]", contiguous: true}
      topk_ids: {dtype: int32, shape: "[T, top_k]", contiguous: true}
    shape_rules:
    - "0 < top_k"
    - "top_k <= E"
    - "not present(correction_bias) or scoring_func == 'sigmoid'"
  workloads:
    # Kimi K2 routing, then Qwen3-235B-A22B, over the decode-to-prefill token range.
  - {T: 32, E: 384, top_k: 8, scoring_func: sigmoid, renormalize: true, dtype_cases: [{G: bfloat16}], label: "kimi-k2-t32"}
  - {T: 512, E: 384, top_k: 8, scoring_func: sigmoid, renormalize: true, dtype_cases: [{G: bfloat16}], label: "kimi-k2-t512"}
  - {T: 4096, E: 384, top_k: 8, scoring_func: sigmoid, renormalize: true, dtype_cases: [{G: bfloat16}], label: "kimi-k2-t4096"}
    # Kimi K2 also routes with a per-expert bias, which is a second kernel build.
  - {T: 512, E: 384, top_k: 8, scoring_func: sigmoid, renormalize: true, some: [correction_bias], dtype_cases: [{G: bfloat16}, {G: float16}, {G: float32}], label: "kimi-k2-t512-bias"}
  - {T: 32, E: 128, top_k: 8, scoring_func: softmax, renormalize: false, dtype_cases: [{G: bfloat16}], label: "qwen3-235b-t32"}
  - {T: 512, E: 128, top_k: 8, scoring_func: softmax, renormalize: false, dtype_cases: [{G: bfloat16}, {G: float16}, {G: float32}], label: "qwen3-235b-t512"}
  - {T: 4096, E: 128, top_k: 8, scoring_func: softmax, renormalize: false, dtype_cases: [{G: bfloat16}], label: "qwen3-235b-t4096"}
  roofline:
    # Score every logit, then keep the top k; a passed bias adds one add per score.
    flops: "2 * T * E * (1 + top_k) + (T * E if present(correction_bias) else 0)"

FusedMoeFwdOp:
  ref_api: "none"
  # correction_bias, when passed, is added to sigmoid scores for top-k selection
  # only; the returned weights stay the unbiased scores (Kimi K2 routing).
  family: moe
  status: implemented

  signature:
    inputs:
      hidden_states: {dtype: "float16 | bfloat16"}
      gating_output: {dtype: "float32"}
      w_gate_up: {dtype: "same_as(hidden_states)"}
      w_down: {dtype: "same_as(hidden_states)"}
      correction_bias: {dtype: "float32", optional: true}
    outputs:
      output: {dtype: "same_as(hidden_states)"}
    params:
      num_tokens: {type: int}
      num_experts: {type: int}
      top_k: {type: int}
      hidden_size: {type: int}
      ffn_size: {type: int}
      scoring_func: {type: str, default: softmax}
      renormalize: {type: bool, default: false}
      routed_scaling_factor: {type: float, default: 1.0}
      activation: {type: str, default: silu_and_mul, kw_only: true}
    shape_rules:
    - "hidden_states.shape == (num_tokens, hidden_size)"
    - "gating_output.shape == (num_tokens, num_experts)"
    - "correction_bias is None or correction_bias.shape == (num_experts,)"
    - "output.shape        == (num_tokens, hidden_size)"

  workloads:
    # Qwen3-235B-A22B: scoring_func=softmax
  - {num_tokens: 512, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: softmax, renormalize: false, dtypes: [bfloat16], label: "qwen3-235b-decode"}
  - {num_tokens: 4096, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: softmax, renormalize: false, dtypes: [bfloat16], label: "qwen3-235b-prefill"}
    # DeepSeek-V3: scoring_func=sigmoid
  - {num_tokens: 512, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: sigmoid, renormalize: false, dtypes: [bfloat16], label: "deepseek-v3-decode"}
  - {num_tokens: 4096, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: sigmoid, renormalize: false, dtypes: [bfloat16], label: "deepseek-v3-prefill"}
    # Kimi K2: scoring_func=sigmoid, correction_bias, renormalize=True, routed_scaling_factor=2.827
  - {num_tokens: 512, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, correction_bias_shape: [256], dtypes: [bfloat16], label: "kimi-k2-decode"}
  - {num_tokens: 4096, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, correction_bias_shape: [256], dtypes: [bfloat16], label: "kimi-k2-prefill"}

  roofline:
    func: "tileops.perf.formulas.fused_moe_fwd_bytes"
    composition:
    - stage: route_select
      formula: "2 * num_tokens * num_experts * (1 + top_k), plus num_tokens * num_experts with correction_bias"
    - stage: routed_experts
      formula: "num_tokens * top_k * 6 * ffn_size * hidden_size over the experts the call routes to"

  source:
    kernel: tileops/ops/moe/fused_moe.py
    op: tileops/ops/moe/fused_moe.py
    test: tests/ops/test_moe_fused_moe.py
    bench: benchmarks/ops/bench_moe_fused_moe.py
    bench_manifest_driven: true
    kernel_map:
      fused_topk_kernel: FusedTopKKernel
      contiguous: MoePrePermuteContiguousKernel
      grouped_gemm: MoeGroupedGemmKernel
      unpermute_kernel: MoeUnpermuteKernel

  composition:
    kind: composite
    stages:
    - name: route_select
      op: FusedTopKFwdOp
    # The tight/indexed branch is chosen inside FusedMoEExpertsFwdOp, whose
    # entry declares it; repeating it here would be one fact in two places.
    - name: routed_experts
      op: FusedMoEExpertsFwdOp

MoePrePermuteFwdOp:
  family: moe
  status: implemented
  signature:
    types:
      LayoutMetadata:
        params: {layout: MGroupedLayout, E: Dim, P: Dim}
        match: layout
        cases:
        - {when: {contiguous: {metadata_kind: physical_psum}}, is: "[E]"}
        - {when: {contiguous: {metadata_kind: per_row}}, is: "[P]"}
    forall: {T: Dim, H: Dim, K: Dim, D: "DType[float16 | bfloat16]"}
    params:
      layout: {type: MGroupedLayout}
      num_local_experts: {type: int}
    inputs:
      hidden_states: {dtype: D, shape: "[T, H]", contiguous: true}
      local_expert_ids: {dtype: int32, shape: "[T, K]", contiguous: true, values: "topk_ids(T, K, num_local_experts)", requires: ["in_range(0, num_local_experts)"]}
    let:
      P: "moe.capacity(layout, T * K, num_local_experts)"
    outputs:
      expert_input: {dtype: D, shape: "[P, H]", contiguous: true}
      layout_metadata: {dtype: int32, shape: "LayoutMetadata[layout, num_local_experts, P]", contiguous: true}
      inverse_indices: {dtype: int32, shape: "[T * K]", contiguous: true}
    shape_rules:
    # A masked slab holds at most max_m routes per expert, which the ids do not promise.
    - "layout.kind == 'contiguous'"
    - "num_local_experts > 0"
    - "T > 0"
    - "K > 0"
  workloads:
  - {T: 32, H: 128, K: 2, num_local_experts: 4, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "small"}
  - {T: 512, H: 128, K: 2, num_local_experts: 4, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "prefill"}
    # DeepSeek-V3 under EP=8: 32 local experts, H=7168, K=8.
  - {T: 100, H: 7168, K: 8, num_local_experts: 32, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "deepseek-v3-ep8-t100"}
  roofline:
    # A gather: no arithmetic.
    flops: "0"

MoeGroupedGemmFwdOp:
  family: moe
  status: implemented
  signature:
    types:
      Rows:
        params: {layout: MGroupedLayout, E: Dim, P: Dim, C: Dim}
        match: layout
        cases:
        - {when: {masked: _}, is: "[E, layout.max_m, C]"}
        - {when: {contiguous: _}, is: "[P, C]"}
      LayoutMetadata:
        params: {layout: MGroupedLayout, E: Dim, P: Dim}
        match: layout
        cases:
        - {when: {masked: _}, is: "[E]"}
        - {when: {contiguous: {metadata_kind: physical_psum}}, is: "[E]"}
        - {when: {contiguous: {metadata_kind: per_row}}, is: "[P]"}
    forall: {P: Dim, K: Dim, N: Dim, E: Dim, D: "DType[float16 | bfloat16]"}
    params:
      layout: {type: MGroupedLayout}
      # A gated activation fused into the epilogue: b stacks gate and up along its second
      # axis, and the output keeps act(gate) * up, N columns.
      activation: {type: "'silu_and_mul' | 'gelu_and_mul' | None", default: null, kw_only: true}
      out_dtype: {type: "float32 | None", default: null, kw_only: true}
    inputs:
      a: {dtype: D, shape: "Rows[layout, E, P, K]", contiguous: true}
      b: {dtype: D, shape: "[E, 2 * N if present(activation) else N, K]", contiguous: true}
      layout_metadata: {dtype: int32, shape: "LayoutMetadata[layout, E, P]", contiguous: true, values: "moe.layout_metadata(layout, R, E)", requires: ["moe.layout_valid(layout, R, E)"]}
    let:
      # Materialized rows of `a`.
      R: "E * layout.max_m if layout.kind == 'masked' else P"
    outputs:
      output: {dtype: "coalesce_dtype(out_dtype, D)", shape: "Rows[layout, E, P, N]", buffer: out, contiguous: true}
    shape_rules:
    - "E > 0"
    - "K > 0"
    # An aligned layout materializes whole tiles.
    - "layout.kind == 'masked' or layout.packing == 'tight' or P % layout.alignment == 0"
  workloads:
    # DeepSeek-V3: 256 experts, H=7168, F=2048; gate_up is [E, 2F, H], down is [E, H, F].
  - {P: 4096, K: 7168, E: 256, N: 4096, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}, {D: float16}], label: "deepseek-v3-decode-gate-up"}
  - {P: 32768, K: 7168, E: 256, N: 4096, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}], label: "deepseek-v3-prefill-gate-up"}
  - {P: 4096, K: 2048, E: 256, N: 7168, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}], label: "deepseek-v3-decode-down"}
  - {P: 4096, K: 2048, E: 256, N: 7168, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, out_dtype: float32, dtype_cases: [{D: bfloat16}], label: "deepseek-v3-decode-down"}
  - {P: 32768, K: 2048, E: 256, N: 7168, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}], label: "deepseek-v3-prefill-down"}
  - {P: 4096, K: 7168, E: 256, N: 2048, activation: silu_and_mul, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}], label: "deepseek-v3-decode-gate-up-fused"}
  - {P: 32768, K: 7168, E: 256, N: 2048, activation: silu_and_mul, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}], label: "deepseek-v3-prefill-gate-up-fused"}
    # DeepSeek-V3 under EP=8 with a masked dispatch: 32 local experts, 128 slots each.
  - {K: 7168, E: 32, N: 4096, layout: {masked: {max_m: 128}}, dtype_cases: [{D: bfloat16}], label: "deepseek-v3-ep8-masked-gate-up"}
  roofline:
    # The contraction, and the fused gated activation (six per output element) when present.
    flops: "2 * R * (2 * N if present(activation) else N) * K + (6 * R * N if present(activation) else 0)"

MoeExpertMLPFwdOp:
  family: moe
  status: implemented
  signature:
    types:
      Rows:
        params: {layout: MGroupedLayout, E: Dim, P: Dim, C: Dim}
        match: layout
        cases:
        - {when: {masked: _}, is: "[E, layout.max_m, C]"}
        - {when: {contiguous: _}, is: "[P, C]"}
      LayoutMetadata:
        params: {layout: MGroupedLayout, E: Dim, P: Dim}
        match: layout
        cases:
        - {when: {masked: _}, is: "[E]"}
        - {when: {contiguous: {metadata_kind: physical_psum}}, is: "[E]"}
        - {when: {contiguous: {metadata_kind: per_row}}, is: "[P]"}
    forall: {P: Dim, H: Dim, F: Dim, E: Dim, D: "DType[float16 | bfloat16]"}
    params:
      layout: {type: MGroupedLayout}
      activation: {type: "'silu_and_mul' | 'gelu_and_mul'", default: silu_and_mul}
    inputs:
      expert_input: {dtype: D, shape: "Rows[layout, E, P, H]", contiguous: true}
      w_gate_up: {dtype: D, shape: "[E, 2 * F, H]", contiguous: true}
      w_down: {dtype: D, shape: "[E, H, F]", contiguous: true}
      layout_metadata: {dtype: int32, shape: "LayoutMetadata[layout, E, P]", contiguous: true, values: "moe.layout_metadata(layout, R, E)", requires: ["moe.layout_valid(layout, R, E)"]}
    let:
      # Materialized rows of `expert_input`.
      R: "E * layout.max_m if layout.kind == 'masked' else P"
    outputs:
      output: {dtype: D, shape: "Rows[layout, E, P, H]", buffer: out, contiguous: true}
    shape_rules:
    - "E > 0"
    - "H > 0"
    - "F > 0"
    # An aligned layout materializes whole tiles.
    - "layout.kind == 'masked' or layout.packing == 'tight' or P % layout.alignment == 0"
  workloads:
    # Qwen3-235B-A22B: H=7168, F=2048, E=128; DeepSeek-V3: E=256.
  - {P: 4096, H: 7168, E: 128, F: 2048, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "qwen3-235b-decode"}
  - {P: 32768, H: 7168, E: 128, F: 2048, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "qwen3-235b-prefill"}
  - {P: 4096, H: 7168, E: 256, F: 2048, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "deepseek-v3-decode"}
  - {P: 32768, H: 7168, E: 256, F: 2048, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "deepseek-v3-prefill"}
  roofline:
    # Two GEMMs (2 * 2F * H and 2 * H * F per row) and the gated activation (6F per row).
    flops: "R * (6 * F * H + 6 * F)"
  composition:
    kind: composite
    stages:
    - {name: gate_up, op: MoeGroupedGemmFwdOp}
    - {name: down, op: MoeGroupedGemmFwdOp}

MoePostPermuteFwdOp:
  family: moe
  status: implemented
  signature:
    types:
      Rows:
        params: {layout: MGroupedLayout, E: Dim, P: Dim, C: Dim}
        match: layout
        cases:
        - {when: {masked: _}, is: "[E, layout.max_m, C]"}
        - {when: {contiguous: _}, is: "[P, C]"}
    forall: {T: Dim, K: Dim, E: Dim, P: Dim, H: Dim, D: "DType[float16 | bfloat16]"}
    params:
      layout: {type: MGroupedLayout}
      epilogue: {type: "RoutingEpilogueSpec | None", default: null}
      # The dtype the reduced result is written in; None keeps the expert output's.
      out_dtype: {type: "float16 | bfloat16 | None", default: null}
    inputs:
      expert_output: {dtype: D, shape: "Rows[layout, E, P, H]", contiguous: true}
      topk_weights: {dtype: float32, shape: "[T, K]", contiguous: true}
      # The materialized row each route's result sits in.
      inverse_indices: {dtype: int32, shape: "[T * K]", contiguous: true, values: "sample_indices(T * K, R)", requires: ["in_range(0, R)"]}
    let:
      # Materialized rows of `expert_output`.
      R: "E * layout.max_m if layout.kind == 'masked' else P"
    outputs:
      output: {dtype: "coalesce_dtype(out_dtype, D)", shape: "[T, H]", buffer: out, contiguous: true}
    shape_rules:
    - "H > 0"
  workloads:
  - {T: 32, K: 2, P: 64, H: 128, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "small"}
    # The output dtype stated explicitly, equal to the expert output's.
  - {T: 32, K: 2, P: 64, H: 128, out_dtype: float16, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}], label: "small"}
  - {T: 32, K: 2, P: 64, H: 128, out_dtype: bfloat16, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: bfloat16}], label: "small"}
  - {T: 512, K: 2, P: 1024, H: 128, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "prefill"}
    # DeepSeek-V3 under EP=8: H=7168, K=8.
  - {T: 100, K: 8, P: 800, H: 7168, layout: {contiguous: {packing: tight, metadata_kind: physical_psum, alignment: 1}}, dtype_cases: [{D: float16}, {D: bfloat16}], label: "deepseek-v3-ep8-t100"}
  roofline:
    # The epilogue's scale is a float field of an object the language does not read.
    func: "tileops.perf.formulas.moe_post_permute_roofline"

FusedMoeSharedExpertFwdOp:
  ref_api: "none"
  # Public op: routed experts plus an optional shared expert. Under TP the
  # shared half is computed on this rank's shard and the caller all-reduces it.
  family: moe
  status: implemented

  signature:
    inputs:
      hidden_states: {dtype: "float16 | bfloat16"}
      gating_output: {dtype: "float32"}
      w_gate_up: {dtype: "same_as(hidden_states)"}
      w_down: {dtype: "same_as(hidden_states)"}
      correction_bias: {dtype: "float32", optional: true}
      shared_w_gate_up: {dtype: "same_as(hidden_states)", optional: true}
      shared_w_down: {dtype: "same_as(hidden_states)", optional: true}
    outputs:
      shared_output:
        dtype: "same_as(hidden_states)"
        nullable: true
      routed_output: {dtype: "same_as(hidden_states)"}
    params:
      num_tokens: {type: int}
      num_experts: {type: int}
      top_k: {type: int}
      hidden_size: {type: int}
      ffn_size: {type: int}
      scoring_func: {type: str, default: softmax}
      renormalize: {type: bool, default: false}
      routed_scaling_factor: {type: float, default: 1.0}
      shared_ffn_size: {type: int | None, default: null}
      tp_size: {type: int, default: 1}
      tp_rank: {type: int, default: 0}
      activation: {type: str, default: silu_and_mul, kw_only: true}
    shape_rules:
    - "hidden_states.shape == (num_tokens, hidden_size)"
    - "gating_output.shape == (num_tokens, num_experts)"
    - "correction_bias is None or correction_bias.shape == (num_experts,)"
    - "shared_w_gate_up is None or shared_w_gate_up.shape == (2 * shared_ffn_size, hidden_size)"
    - "shared_w_down is None or shared_w_down.shape == (hidden_size, shared_ffn_size)"
    - "routed_output.shape == (num_tokens, hidden_size)"

  workloads:
    # kimi-k2: sigmoid routing with a correction bias, shared expert enabled
  - {num_tokens: 1, num_experts: 384, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, correction_bias_shape: [384], shared_w_gate_up_shape: [36864, 7168], shared_w_down_shape: [7168, 18432], dtypes: [bfloat16], label: "kimi-k2-t1"}
  - {num_tokens: 32, num_experts: 384, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, correction_bias_shape: [384], shared_w_gate_up_shape: [36864, 7168], shared_w_down_shape: [7168, 18432], dtypes: [bfloat16], label: "kimi-k2-t32"}
  - {num_tokens: 64, num_experts: 384, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, correction_bias_shape: [384], shared_w_gate_up_shape: [36864, 7168], shared_w_down_shape: [7168, 18432], dtypes: [bfloat16], label: "kimi-k2-t64"}
  - {num_tokens: 128, num_experts: 384, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, correction_bias_shape: [384], shared_w_gate_up_shape: [36864, 7168], shared_w_down_shape: [7168, 18432], dtypes: [bfloat16], label: "kimi-k2-t128"}
  - {num_tokens: 512, num_experts: 384, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, correction_bias_shape: [384], shared_w_gate_up_shape: [36864, 7168], shared_w_down_shape: [7168, 18432], dtypes: [bfloat16], label: "kimi-k2-t512"}
  - {num_tokens: 2048, num_experts: 384, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, correction_bias_shape: [384], shared_w_gate_up_shape: [36864, 7168], shared_w_down_shape: [7168, 18432], dtypes: [bfloat16], label: "kimi-k2-t2048"}
  - {num_tokens: 4096, num_experts: 384, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 18432, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.827, correction_bias_shape: [384], shared_w_gate_up_shape: [36864, 7168], shared_w_down_shape: [7168, 18432], dtypes: [bfloat16], label: "kimi-k2-t4096"}
    # deepseek-v3: sigmoid routing with a correction bias, shared expert enabled
  - {num_tokens: 1, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [256], shared_w_gate_up_shape: [4096, 7168], shared_w_down_shape: [7168, 2048], dtypes: [bfloat16], label: "deepseek-v3-t1"}
  - {num_tokens: 32, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [256], shared_w_gate_up_shape: [4096, 7168], shared_w_down_shape: [7168, 2048], dtypes: [bfloat16], label: "deepseek-v3-t32"}
  - {num_tokens: 64, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [256], shared_w_gate_up_shape: [4096, 7168], shared_w_down_shape: [7168, 2048], dtypes: [bfloat16], label: "deepseek-v3-t64"}
  - {num_tokens: 128, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [256], shared_w_gate_up_shape: [4096, 7168], shared_w_down_shape: [7168, 2048], dtypes: [bfloat16], label: "deepseek-v3-t128"}
  - {num_tokens: 512, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [256], shared_w_gate_up_shape: [4096, 7168], shared_w_down_shape: [7168, 2048], dtypes: [bfloat16], label: "deepseek-v3-t512"}
  - {num_tokens: 2048, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [256], shared_w_gate_up_shape: [4096, 7168], shared_w_down_shape: [7168, 2048], dtypes: [bfloat16], label: "deepseek-v3-t2048"}
  - {num_tokens: 4096, num_experts: 256, top_k: 8, hidden_size: 7168, ffn_size: 2048, shared_ffn_size: 2048, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [256], shared_w_gate_up_shape: [4096, 7168], shared_w_down_shape: [7168, 2048], dtypes: [bfloat16], label: "deepseek-v3-t4096"}
    # glm-4.5: sigmoid routing with a correction bias, shared expert enabled
  - {num_tokens: 1, num_experts: 160, top_k: 8, hidden_size: 5120, ffn_size: 1536, shared_ffn_size: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [160], shared_w_gate_up_shape: [3072, 5120], shared_w_down_shape: [5120, 1536], dtypes: [bfloat16], label: "glm-4.5-t1"}
  - {num_tokens: 32, num_experts: 160, top_k: 8, hidden_size: 5120, ffn_size: 1536, shared_ffn_size: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [160], shared_w_gate_up_shape: [3072, 5120], shared_w_down_shape: [5120, 1536], dtypes: [bfloat16], label: "glm-4.5-t32"}
  - {num_tokens: 64, num_experts: 160, top_k: 8, hidden_size: 5120, ffn_size: 1536, shared_ffn_size: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [160], shared_w_gate_up_shape: [3072, 5120], shared_w_down_shape: [5120, 1536], dtypes: [bfloat16], label: "glm-4.5-t64"}
  - {num_tokens: 128, num_experts: 160, top_k: 8, hidden_size: 5120, ffn_size: 1536, shared_ffn_size: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [160], shared_w_gate_up_shape: [3072, 5120], shared_w_down_shape: [5120, 1536], dtypes: [bfloat16], label: "glm-4.5-t128"}
  - {num_tokens: 512, num_experts: 160, top_k: 8, hidden_size: 5120, ffn_size: 1536, shared_ffn_size: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [160], shared_w_gate_up_shape: [3072, 5120], shared_w_down_shape: [5120, 1536], dtypes: [bfloat16], label: "glm-4.5-t512"}
  - {num_tokens: 2048, num_experts: 160, top_k: 8, hidden_size: 5120, ffn_size: 1536, shared_ffn_size: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [160], shared_w_gate_up_shape: [3072, 5120], shared_w_down_shape: [5120, 1536], dtypes: [bfloat16], label: "glm-4.5-t2048"}
  - {num_tokens: 4096, num_experts: 160, top_k: 8, hidden_size: 5120, ffn_size: 1536, shared_ffn_size: 1536, scoring_func: sigmoid, renormalize: true, routed_scaling_factor: 2.5, correction_bias_shape: [160], shared_w_gate_up_shape: [3072, 5120], shared_w_down_shape: [5120, 1536], dtypes: [bfloat16], label: "glm-4.5-t4096"}
    # Qwen3-235B-A22B: routed only — no shared expert, no correction bias
  - {num_tokens: 512, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: softmax, renormalize: false, dtypes: [bfloat16], label: "qwen3-235b-routed-only"}

  roofline:
    func: "tileops.perf.formulas.fused_moe_shared_expert_fwd_bytes"
    composition:
    - stage: shared_expert
      formula: "F_s = shared_ffn_size / tp_size; flops 2 * num_tokens * 3 * F_s * hidden_size, bytes (3 * F_s * hidden_size + 2 * num_tokens * hidden_size) * elem_bytes -- the hidden states read and the shared_output write"
      optional: true
    - stage: routed_moe
      source: "tileops.perf.formulas.fused_moe_fwd_bytes"

  composition:
    kind: composite
    stages:
    # forward() computes the shared expert before delegating the routed half.
    - name: shared_expert
      kernel: shared_expert_mlp
      optional: true
    # Routing and the expert MLPs both: this delegates to the whole routed op.
    - name: routed_moe
      op: FusedMoeFwdOp

  source:
    kernel: tileops/kernels/moe/shared_expert_mlp.py
    op: tileops/ops/moe/fused_moe_shared_expert.py
    test: tests/ops/test_moe_fused_moe_shared_expert.py
    bench: benchmarks/ops/bench_moe_fused_moe_shared_expert.py
    bench_manifest_driven: true
    kernel_map:
      shared_expert_mlp: SharedExpertMLPKernel
