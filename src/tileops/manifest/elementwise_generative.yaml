AlibiFwdOp:
  # ALiBi position-encoding bias: out[h, i, j] = -slope_h * |i - j|, where
  # slope_h = 2^(-8 * (h + 1) / num_heads). No tensor input -- the full
  # (num_heads, seq_len, seq_len) bias is synthesized from the
  # construction-time integer parameters.
  family: elementwise
  status: implemented

  signature:
    params:
      seq_len: {type: int, kw_only: true}
      num_heads: {type: int, kw_only: true}
      out_dtype: {type: "float16 | bfloat16 | float32", default: float32, kw_only: true}
      device: {type: "torch.device | str | None", default: null, kw_only: true}
    outputs:
      output: {dtype: out_dtype, shape: "[num_heads, seq_len, seq_len]"}
    shape_rules:
    - "seq_len > 0"
    - "num_heads > 0"

  workloads:
  # Llama-style attention bias dimensions
  - {seq_len: 2048, num_heads: 32, out_dtype: float16, label: "llama-prefill-2k"}
  - {seq_len: 2048, num_heads: 32, out_dtype: bfloat16, label: "llama-prefill-2k"}
  - {seq_len: 4096, num_heads: 32, out_dtype: float16, label: "llama-prefill-4k"}
  - {seq_len: 4096, num_heads: 32, out_dtype: bfloat16, label: "llama-prefill-4k"}

  roofline:
    # FLOPs: per output element compute |i - j| (sub + abs = 2) and
    # multiply by -slope_h (1) = 3. Slope precomputation is O(H) and
    # negligible vs the H * S * S body.
    flops: "3 * num_heads * seq_len * seq_len"

SinusoidalFwdOp:
  # Sinusoidal positional encoding (Vaswani et al. 2017):
  # PE(pos, 2i)   = sin(pos / 10000^(2i / d_model))
  # PE(pos, 2i+1) = cos(pos / 10000^(2i / d_model))
  # No tensor input -- the full (seq_len, d_model) encoding is synthesized
  # from the construction-time integer parameters. d_model must be even.
  family: elementwise
  status: implemented

  signature:
    params:
      seq_len: {type: int, kw_only: true}
      d_model: {type: int, kw_only: true}
      out_dtype: {type: "float16 | bfloat16 | float32", default: float32, kw_only: true}
      device: {type: "torch.device | str | None", default: null, kw_only: true}
    outputs:
      output: {dtype: out_dtype, shape: "[seq_len, d_model]"}
    shape_rules:
    - "seq_len > 0"
    - "d_model > 0"
    - "d_model % 2 == 0"

  workloads:
  # Transformer-style positional encodings
  - {seq_len: 2048, d_model: 4096, out_dtype: float16, label: "transformer-2k-4k"}
  - {seq_len: 2048, d_model: 4096, out_dtype: bfloat16, label: "transformer-2k-4k"}
  - {seq_len: 4096, d_model: 4096, out_dtype: float16, label: "transformer-4k-4k"}
  - {seq_len: 4096, d_model: 4096, out_dtype: bfloat16, label: "transformer-4k-4k"}

  roofline:
    # FLOPs per output element, per roofline.md §1.3: dim_pair (1) +
    # 2 * dim_pair / d_model (2) + pow (1) + div (1) + sin/cos select (1) = 6.
    # Hoisting the pair-only terms out of the position loop does not change it.
    flops: "6 * seq_len * d_model"
