# elementwise_binary.yaml -- manifest entries for elementwise binary ops.
#
# Two-input single-output elementwise ops (arithmetic, comparison, logical,
# bitwise). Source of truth for op interfaces in this family. Loaded and
# merged with other family files by tileops.manifest at runtime. See
# docs/design/manifest.md for the full schema.

PreluFwdOp:
  ref_api: "torch.nn.functional.prelu"
  family: elementwise
  status: implemented

  signature:
    # PyTorch prelu: weight is either scalar or per-channel along dim 1
    # for inputs with ndim >= 2; 1-D inputs accept scalar weight only.
    forall: {S: Shape, W: Shape, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      input: {dtype: T, shape: "[*S]"}
      weight: {dtype: T, shape: "[*W]"}
    outputs:
      output: {dtype: T, shape: "[*S]"}
    shape_rules:
    - "len(W) == 0 or (len(W) == 1 and (W[0] == 1 or (len(S) >= 2 and W[0] == S[1])))"

  workloads:
  # PReLU CNN feature map (per-channel weight)
  - {S: [16, 256, 56, 56], W: [256], dtype_cases: [{T: float16}, {T: bfloat16}], label: "cnn-feat-per-channel"}
  - {S: [16, 512, 28, 28], W: [512], dtype_cases: [{T: float16}, {T: bfloat16}], label: "cnn-feat-per-channel-deep"}

  roofline:
    # FLOPs: prelu(x) = x if x>0 else weight*x. Per roofline.md §1.3,
    # compare-and-select(1) + mul(1) = 2 per elem.
    flops: "2 * prod(S)"

MaskedFillFwdOp:
  # Primary entry: PyTorch's torch.Tensor.masked_fill(mask, value: Tensor)
  # where ``value`` is a 0-dim Tensor. The out-of-place
  # ``Tensor.masked_fill`` returns a new tensor whose shape is the
  # bidirectional broadcast of ``input`` and ``mask`` — either operand
  # may be expanded (verified directly: ``torch.zeros((2,1)).masked_fill(
  # mask=torch.zeros((2,3), dtype=torch.bool), value=1.0)`` returns shape
  # ``(2, 3)``). The in-place ``masked_fill_`` is unidirectional, but
  # the manifest models only the out-of-place form. The scalar (Number)
  # value form is its own entry, MaskedFillScalarFwdOp below: a Number is
  # not a tensor, so it cannot be one entry's optional tensor input.
  ref_api: "torch.Tensor.masked_fill"
  family: elementwise
  status: implemented

  signature:
    # Out-of-place masked_fill returns the bidirectional broadcast of
    # input and mask; value is 0-dim.
    forall: {A: Shape, M: Shape, T: "DType[bool | uint8 | int8 | int16 | int32 | int64 | float16 | bfloat16 | float32]"}
    inputs:
      input: {dtype: T, shape: "[*A]"}
      mask: {dtype: bool, shape: "[*M]"}
      value: {dtype: T, shape: "[]"}
    outputs:
      output: {dtype: T, shape: "[*broadcast(A, M)]"}

  workloads:
  - {A: [4096, 4096], M: [4096, 4096], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "elementwise-16M"}
  - {A: [16384, 16384], M: [16384, 16384], dtype_cases: [{T: float16}, {T: bfloat16}], label: "elementwise-256M"}

  roofline:
    flops: "prod(broadcast(A, M))"

MaskedFillScalarFwdOp:
  # PyTorch's torch.Tensor.masked_fill(mask, value: Number). `value` is a scalar
  # param here and a 0-dim tensor input in MaskedFillFwdOp above: two signatures,
  # so two entries.
  ref_api: "torch.Tensor.masked_fill"
  family: elementwise
  status: implemented

  signature:
    # Out-of-place masked_fill returns the bidirectional broadcast of
    # input and mask; out shape follows that broadcast (verified against
    # ``torch.Tensor.masked_fill`` — input may also be expanded up).
    forall: {A: Shape, M: Shape, T: "DType[bool | uint8 | int8 | int16 | int32 | int64 | float16 | bfloat16 | float32]"}
    params:
      value: {type: Number, default: 0.0, kw_only: true}
    inputs:
      input: {dtype: T, shape: "[*A]"}
      mask: {dtype: bool, shape: "[*M]"}
    outputs:
      output: {dtype: T, shape: "[*broadcast(A, M)]"}

  workloads:
  - {A: [4096, 4096], M: [4096, 4096], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: "elementwise-16M"}
  - {A: [16384, 16384], M: [16384, 16384], dtype_cases: [{T: float16}, {T: bfloat16}], label: "elementwise-256M"}

  roofline:
    flops: "prod(broadcast(A, M))"

