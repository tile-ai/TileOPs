RopeLongRopeFwdOp:
  family: rope
  status: implemented

  signature:
    types:
      RopeX:
        params: {layout: "'1d' | '2d'", B: Dim, S: Dim, H: Dim, D: Dim}
        match: layout
        cases:
        - {when: 1d, is: "[S, D]"}
        - {when: 2d, is: "[B, S, H, D]"}
    forall: {B: Dim, S: Dim, H: Dim, D: Dim, T: "DType[float16 | bfloat16 | float32]", R: "DType[float32 | float16 | bfloat16]"}
    params:
      layout: {type: "'1d' | '2d'", default: 1d}
      base: {type: float, default: 10000.0}
      rescale_factors: {dtype: R, shape: "[D // 2]", optional: true}
      max_position_embeddings: {type: int, default: 4096}
      original_max_position_embeddings: {type: int, default: 4096}
    inputs:
      x: {dtype: T, shape: "RopeX[layout, B, S, H, D]"}
    outputs:
      output: {dtype: T, shape: "RopeX[layout, B, S, H, D]"}
    shape_rules:
    - "D > 0 and D % 2 == 0"

  workloads:
  - {layout: 1d, S: 8192, D: 128, dtype_cases: [{T: bfloat16}], label: longrope-1d-8k-d128}
  - {layout: 2d, B: 1, S: 8192, H: 32, D: 128, dtype_cases: [{T: float16}], label: longrope-2d-b1-s8k-h32-d128}
  - {layout: 1d, S: 5120, D: 128, dtype_cases: [{T: float32}], label: longrope-1d-5k-d128}
  - {layout: 1d, S: 8192, D: 128, some: [rescale_factors], dtype_cases: [{T: bfloat16, R: float32}, {T: bfloat16, R: float16}, {T: bfloat16, R: bfloat16}], label: longrope-1d-8k-d128-rescaled}

  roofline:
    flops: "4 * (B * S * H * D if layout == '2d' else S * D)"

RopeNeoxPositionIdsFwdOp:
  # Packed [tokens, heads, head_dim] input with one position per token; the first
  # `rotary_dim` columns rotate and the rest are copied.
  family: rope
  status: implemented

  signature:
    forall: {N: Dim, H: Dim, D: Dim, T: "DType[float16 | bfloat16 | float32]", P: "DType[int32 | int64]", seq_lens: "Seq[Int]"}
    params:
      max_position: {type: int}
      base: {type: float, default: 10000.0}
      rotary_dim: {type: "int | None", default: null}
    inputs:
      x: {dtype: T, shape: "[N, H, D]"}
      position_ids: {dtype: P, shape: "[N]", values: "packed_positions(seq_lens)", requires: ["in_range(0, max_position)"]}
    outputs:
      output: {dtype: T, shape: "[N, H, D]"}
    shape_rules:
    - "0 < max_position <= 2147483648"
    - "rotary_dim.value > 0 and rotary_dim.value % 2 == 0 and rotary_dim.value <= D if present(rotary_dim) else D > 0 and D % 2 == 0"

  workloads:
  - {seq_lens: [2048], H: 32, D: 128, max_position: 4096, dtype_cases: [{T: float16, P: int32}], label: position-ids-s2k-h32-d128}
  - {seq_lens: [4096], H: 32, D: 128, max_position: 8192, dtype_cases: [{T: bfloat16, P: int32}], label: position-ids-s4k-h32-d128}
  - {seq_lens: [1000, 3000, 1120], H: 32, D: 128, max_position: 4096, dtype_cases: [{T: float32, P: int64}], label: position-ids-packed3-h32-d128}

  roofline:
    flops: "4 * N * H * (rotary_dim.value if present(rotary_dim) else D)"
