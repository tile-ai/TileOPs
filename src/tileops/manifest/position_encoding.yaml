# Rotary position embedding (RoPE) operators, exported by the `rope` module.

RopeNeoxFwdOp:
  family: rope
  status: implemented

  signature:
    types:
      RopeX:
        params: {layout: "'1d' | '2d'", B: Dim, S: Dim, H: Dim, D: Dim}
        match: layout
        cases:
        - {when: 1d, is: "[S, D]"}
        - {when: 2d, is: "[B, S, H, D]"}
    forall: {B: Dim, S: Dim, H: Dim, D: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      layout: {type: "'1d' | '2d'", default: 1d}
      base: {type: float, default: 10000.0}
    inputs:
      x: {dtype: T, shape: "RopeX[layout, B, S, H, D]"}
    outputs:
      output: {dtype: T, shape: "RopeX[layout, B, S, H, D]"}
    shape_rules:
    - "D > 0 and D % 2 == 0"

  workloads:
  - {layout: 1d, S: 2048, D: 64, dtype_cases: [{T: float16}, {T: float32}], label: neox-1d-2k-d64}
  - {layout: 1d, S: 4096, D: 128, dtype_cases: [{T: bfloat16}], label: neox-1d-4k-d128}
  - {layout: 2d, B: 2, S: 2048, H: 32, D: 128, dtype_cases: [{T: float16}], label: neox-2d-b2-s2k-h32-d128}

  roofline:
    flops: "4 * (B * S * H * D if layout == '2d' else S * D)"

