# linear_attention.yaml -- manifest entries for linear-attention operators.
#
# Source of truth for linear-attention op interfaces. Spec-only entries define
# the public Op contract before the implementation conforms.

DeltaNetInferenceFwdOp:
  # One inference contract for equal-length prefill, packed varlen, and decode.
  # The five training buffers of the chunkwise forward are not public outputs.
  # A packed call (cu_seqlens) carries one state per sequence.
  family: linear_attention
  status: spec-only
  signature:
    types:
      State:
        params: {packed: Bool, B: Dim, N: Dim, H: Dim, K: Dim, V: Dim}
        match: packed
        cases:
        - {when: false, is: "[B, H, K, V]"}
        - {when: true, is: "[N, H, K, V]"}
    forall: {B: Dim, S: Dim, H: Dim, K: Dim, V: Dim, N: Dim, T: "DType[float16 | bfloat16]", seq_lens: "Seq[Int]"}
    params:
      scale: {type: "float | None", default: null}
      use_qk_l2norm_in_kernel: {type: bool, default: false}
    inputs:
      q: {dtype: T, shape: "[B, S, H, K]"}
      k: {dtype: T, shape: "[B, S, H, K]"}
      v: {dtype: T, shape: "[B, S, H, V]"}
      beta: {dtype: T, shape: "[B, S, H]"}
      initial_state: {dtype: float32, shape: "State[present(cu_seqlens), B, N, H, K, V]", optional: true}
      cu_seqlens: {dtype: int64, shape: "[N + 1]", optional: true, values: "prefix_sum(seq_lens)", requires: ["prefix_offsets(S)"]}
      cu_seqlens_cpu: {dtype: int64, shape: "[N + 1]", optional: true, device: cpu, values: "prefix_sum(seq_lens)", requires: ["prefix_offsets(S)"]}
    outputs:
      o: {dtype: T, shape: "[B, S, H, V]"}
      final_state: {dtype: float32, shape: "State[present(cu_seqlens), B, N, H, K, V]"}
    shape_rules:
    - "K > 0 and V > 0"
    - "not present(cu_seqlens_cpu) or present(cu_seqlens)"
    - "not present(cu_seqlens) or B == 1"
  workloads:
  - {B: 2, S: 2048, H: 4, K: 64, V: 64, dtype_cases: [{T: bfloat16}], label: prefill-medium}
  - {B: 2, S: 8192, H: 4, K: 64, V: 64, dtype_cases: [{T: bfloat16}], label: prefill-long}
  - {B: 2, S: 16384, H: 4, K: 64, V: 64, dtype_cases: [{T: bfloat16}], label: prefill-very-long}
  - {B: 1, S: 4096, H: 16, K: 128, V: 128, dtype_cases: [{T: bfloat16}], label: prefill-wide}
  roofline:
    flops: "B * S * H * (6 * K * V + 2 * K)"

GatedDeltaNetFwdOp:
  # Inference contract shared by equal-length, packed-varlen, prefill, and
  # single-token decode calls. Unlike the FLA reference, this contract always
  # returns final_state: serving callers need it to continue recurrence.
  # state_v_first stores the state as [.., V, K]; A_log and dt_bias are passed
  # exactly when the gate is computed in the kernel.
  family: linear_attention
  status: spec-only
  signature:
    types:
      State:
        params: {packed: Bool, vf: Bool, B: Dim, N: Dim, HV: Dim, K: Dim, V: Dim}
        match: [packed, vf]
        cases:
        - {when: [false, false], is: "[B, HV, K, V]"}
        - {when: [false, true], is: "[B, HV, V, K]"}
        - {when: [true, false], is: "[N, HV, K, V]"}
        - {when: [true, true], is: "[N, HV, V, K]"}
    forall: {B: Dim, S: Dim, H: Dim, HV: Dim, K: Dim, V: Dim, N: Dim, T: "DType[float16 | bfloat16]", seq_lens: "Seq[Int]"}
    params:
      scale: {type: "float | None", default: null}
      use_qk_l2norm_in_kernel: {type: bool, default: false}
      use_beta_sigmoid_in_kernel: {type: bool, default: false}
      allow_neg_eigval: {type: bool, default: false}
      state_v_first: {type: bool, default: false}
      use_gate_in_kernel: {type: bool, default: false}
    inputs:
      q: {dtype: T, shape: "[B, S, H, K]"}
      k: {dtype: T, shape: "[B, S, H, K]"}
      v: {dtype: T, shape: "[B, S, HV, V]"}
      g: {dtype: T, shape: "[B, S, HV]"}
      beta: {dtype: T, shape: "[B, S, HV]"}
      initial_state: {dtype: float32, shape: "State[present(cu_seqlens), state_v_first, B, N, HV, K, V]", optional: true}
      cu_seqlens: {dtype: int64, shape: "[N + 1]", optional: true, values: "prefix_sum(seq_lens)", requires: ["prefix_offsets(S)"]}
      cu_seqlens_cpu: {dtype: int64, shape: "[N + 1]", optional: true, device: cpu, values: "prefix_sum(seq_lens)", requires: ["prefix_offsets(S)"]}
      A_log: {dtype: float32, shape: "[HV]", optional: use_gate_in_kernel}
      dt_bias: {dtype: float32, shape: "[HV]", optional: use_gate_in_kernel}
    outputs:
      o: {dtype: T, shape: "[B, S, HV, V]"}
      final_state: {dtype: float32, shape: "State[present(cu_seqlens), state_v_first, B, N, HV, K, V]"}
    shape_rules:
    - "H > 0 and HV % H == 0"
    - "K > 0 and V > 0"
    - "not present(cu_seqlens_cpu) or present(cu_seqlens)"
    - "not present(cu_seqlens) or B == 1"
    - "not allow_neg_eigval or use_beta_sigmoid_in_kernel"
  workloads:
  - {B: 1, S: 4096, H: 16, HV: 16, K: 128, V: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: serving-prefill-medium}
  - {B: 1, S: 12288, H: 16, HV: 16, K: 128, V: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: serving-prefill-long-irregular}
  - {B: 1, S: 32768, H: 16, HV: 16, K: 128, V: 128, dtype_cases: [{T: float16}, {T: bfloat16}], label: serving-prefill-long}
  - {B: 1, S: 1, H: 16, HV: 16, K: 128, V: 128, some: [initial_state], dtype_cases: [{T: float16}, {T: bfloat16}], label: serving-decode-b1}
  - {B: 8, S: 1, H: 32, HV: 32, K: 128, V: 128, some: [initial_state], dtype_cases: [{T: float16}, {T: bfloat16}], label: serving-decode-b8}
  roofline:
    flops: "B * S * HV * 7 * K * V"

DeltaNetDecodeFwdOp:
  # Single-token ungated DeltaNet decode. State ownership is functional: state
  # is read and new_state is returned.
  family: linear_attention
  status: implemented
  signature:
    forall: {B: Dim, H: Dim, DK: Dim, DV: Dim, T: "DType[float16 | bfloat16 | float32]"}
    inputs:
      q: {dtype: T, shape: "[B, H, DK]"}
      k: {dtype: T, shape: "[B, H, DK]"}
      v: {dtype: T, shape: "[B, H, DV]"}
      beta: {dtype: T, shape: "[B, H]"}
      state: {dtype: T, shape: "[B, H, DK, DV]"}
    outputs:
      o: {dtype: T, shape: "[B, H, DV]"}
      new_state: {dtype: T, shape: "[B, H, DK, DV]"}
    shape_rules:
    - "B > 0 and H > 0 and DK > 0 and DV > 0"
  workloads:
  - {B: 1, H: 8, DK: 128, DV: 128, dtype_cases: [{T: bfloat16}], label: delta-decode-serving-b1-h8-d128}
  - {B: 1, H: 16, DK: 128, DV: 128, dtype_cases: [{T: bfloat16}], label: delta-decode-serving-b1-h16-d128}
  - {B: 1, H: 32, DK: 128, DV: 128, dtype_cases: [{T: bfloat16}], label: delta-decode-serving-b1-h32-d128}
  - {B: 1, H: 48, DK: 128, DV: 128, dtype_cases: [{T: bfloat16}], label: delta-decode-serving-b1-h48-d128}
  - {B: 1, H: 64, DK: 128, DV: 128, dtype_cases: [{T: bfloat16}], label: delta-decode-serving-b1-h64-d128}
  - {B: 8, H: 32, DK: 128, DV: 128, dtype_cases: [{T: bfloat16}], label: delta-decode-serving-b8-h32-d128}
  - {B: 8, H: 48, DK: 128, DV: 128, dtype_cases: [{T: bfloat16}], label: delta-decode-serving-b8-h48-d128}
  - {B: 8, H: 64, DK: 128, DV: 128, dtype_cases: [{T: bfloat16}], label: delta-decode-serving-b8-h64-d128}
  roofline:
    flops: "2 * B * H * (3 * DK * DV + DK)"

GLADecodeFwdOp:
  # Single-token GLA decode. The scale parameter is semantic and fixed at op
  # construction (non-positive means DK ** -0.5); state is returned
  # functionally as new_state.
  family: linear_attention
  status: implemented
  signature:
    forall: {B: Dim, H: Dim, DK: Dim, DV: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      scale: {type: float, default: -1.0}
    inputs:
      q: {dtype: T, shape: "[B, H, DK]"}
      k: {dtype: T, shape: "[B, H, DK]"}
      v: {dtype: T, shape: "[B, H, DV]"}
      gk: {dtype: T, shape: "[B, H, DK]"}
      state: {dtype: T, shape: "[B, H, DK, DV]"}
    outputs:
      o: {dtype: T, shape: "[B, H, DV]"}
      new_state: {dtype: T, shape: "[B, H, DK, DV]"}
    shape_rules:
    - "B > 0 and H > 0 and DK > 0 and DV > 0"
  workloads:
  - {B: 1, H: 8, DK: 128, DV: 128, scale: 0.08838834764831845, dtype_cases: [{T: bfloat16}], label: gla-decode-serving-b1-h8-d128}
  - {B: 1, H: 16, DK: 128, DV: 128, scale: 0.08838834764831845, dtype_cases: [{T: bfloat16}], label: gla-decode-serving-b1-h16-d128}
  - {B: 1, H: 32, DK: 128, DV: 128, scale: 0.08838834764831845, dtype_cases: [{T: bfloat16}], label: gla-decode-serving-b1-h32-d128}
  - {B: 1, H: 48, DK: 128, DV: 128, scale: 0.08838834764831845, dtype_cases: [{T: bfloat16}], label: gla-decode-serving-b1-h48-d128}
  - {B: 1, H: 64, DK: 128, DV: 128, scale: 0.08838834764831845, dtype_cases: [{T: bfloat16}], label: gla-decode-serving-b1-h64-d128}
  - {B: 8, H: 32, DK: 128, DV: 128, scale: 0.08838834764831845, dtype_cases: [{T: bfloat16}], label: gla-decode-serving-b8-h32-d128}
  - {B: 8, H: 48, DK: 128, DV: 128, scale: 0.08838834764831845, dtype_cases: [{T: bfloat16}], label: gla-decode-serving-b8-h48-d128}
  - {B: 8, H: 64, DK: 128, DV: 128, scale: 0.08838834764831845, dtype_cases: [{T: bfloat16}], label: gla-decode-serving-b8-h64-d128}
  roofline:
    flops: "2 * B * H * (2 * DK * DV + DK)"

DeltaNetAutogradFwdOp:
  # The autograd wrapper over DeltaNetFwdOp and DeltaNetBwdOp: one output rather
  # than the forward's six, because the chunk buffers the backward reads are
  # saved for it rather than returned. The sequence index is L because S names
  # the forward's state buffer.
  family: linear_attention
  status: implemented
  signature:
    forall: {B: Dim, H: Dim, L: Dim, DK: Dim, DV: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      chunk_size: {type: int, default: 64}
    inputs:
      q: {dtype: T, shape: "[B, H, L, DK]"}
      k: {dtype: T, shape: "[B, H, L, DK]"}
      v: {dtype: T, shape: "[B, H, L, DV]"}
      beta: {dtype: T, shape: "[B, H, L]"}
    outputs:
      o: {dtype: T, shape: "[B, H, L, DV]"}
    shape_rules:
    - "B > 0 and H > 0 and L > 0 and DK > 0 and DV > 0"
    - "chunk_size > 0 and L % chunk_size == 0"
  workloads:
  - {B: 2, H: 4, L: 2048, DK: 64, DV: 64, chunk_size: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: dn-autograd-b2-s2k-h4-d64}
  - {B: 2, H: 4, L: 8192, DK: 64, DV: 64, chunk_size: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: dn-autograd-b2-s8k-h4-d64}
  roofline:
    flops: "2 * B * H * L * DK * DV"
  composition:
    kind: composite
    stages:
    - {name: forward, op: DeltaNetFwdOp}
    - {name: backward, op: DeltaNetBwdOp}

DeltaNetFwdOp:
  # Chunked ungated DeltaNet forward. S is the fp32 state at every chunk
  # boundary; Aw, Au, w, u are the chunk buffers DeltaNetBwdOp reads, in the
  # input dtype. The sequence index is L because S names an output.
  family: linear_attention
  status: implemented
  signature:
    forall: {B: Dim, H: Dim, L: Dim, DK: Dim, DV: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      chunk_size: {type: int, default: 64}
    inputs:
      q: {dtype: T, shape: "[B, H, L, DK]"}
      k: {dtype: T, shape: "[B, H, L, DK]"}
      v: {dtype: T, shape: "[B, H, L, DV]"}
      beta: {dtype: T, shape: "[B, H, L]"}
    outputs:
      o: {dtype: T, shape: "[B, H, L, DV]"}
      S: {dtype: float32, shape: "[B, H, NC + 1, DK, DV]"}
      Aw: {dtype: T, shape: "[B, H, L, chunk_size]"}
      Au: {dtype: T, shape: "[B, H, L, chunk_size]"}
      w: {dtype: T, shape: "[B, H, L, DK]"}
      u: {dtype: T, shape: "[B, H, L, DV]"}
    let: {NC: "L // chunk_size"}
    shape_rules:
    - "B > 0 and H > 0 and L > 0 and DK > 0 and DV > 0"
    - "chunk_size > 0 and L % chunk_size == 0"
  workloads:
  - {B: 2, H: 4, L: 2048, DK: 64, DV: 64, chunk_size: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: dn-b2-s2k-h4-d64}
  - {B: 2, H: 4, L: 4096, DK: 64, DV: 64, chunk_size: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: dn-b2-s4k-h4-d64}
  - {B: 2, H: 4, L: 8192, DK: 64, DV: 64, chunk_size: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: dn-b2-s8k-h4-d64}
  - {B: 2, H: 4, L: 16384, DK: 64, DV: 64, chunk_size: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: dn-b2-s16k-h4-d64}
  roofline:
    flops: "2 * B * H * L * DK * DV"

DeltaNetBwdOp:
  # Chunked ungated DeltaNet backward over the forward's inputs and saved buffers.
  family: linear_attention
  status: implemented
  signature:
    forall: {B: Dim, H: Dim, L: Dim, DK: Dim, DV: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      chunk_size: {type: int, default: 64}
    inputs:
      do: {dtype: T, shape: "[B, H, L, DV]"}
      q: {dtype: T, shape: "[B, H, L, DK]"}
      k: {dtype: T, shape: "[B, H, L, DK]"}
      v: {dtype: T, shape: "[B, H, L, DV]"}
      beta: {dtype: T, shape: "[B, H, L]"}
      S: {dtype: float32, shape: "[B, H, NC + 1, DK, DV]"}
      Aw: {dtype: T, shape: "[B, H, L, chunk_size]"}
      Au: {dtype: T, shape: "[B, H, L, chunk_size]"}
      w: {dtype: T, shape: "[B, H, L, DK]"}
      u: {dtype: T, shape: "[B, H, L, DV]"}
    outputs:
      dq: {dtype: T, shape: "[B, H, L, DK]"}
      dk: {dtype: T, shape: "[B, H, L, DK]"}
      dv: {dtype: T, shape: "[B, H, L, DV]"}
      dbeta: {dtype: T, shape: "[B, H, L]"}
    let: {NC: "L // chunk_size"}
    shape_rules:
    - "B > 0 and H > 0 and L > 0 and DK > 0 and DV > 0"
    - "chunk_size > 0 and L % chunk_size == 0"
  workloads:
  - {B: 2, H: 4, L: 2048, DK: 64, DV: 64, chunk_size: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: dn-bwd-b2-s2k-h4-d64}
  - {B: 2, H: 4, L: 4096, DK: 64, DV: 64, chunk_size: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: dn-bwd-b2-s4k-h4-d64}
  - {B: 2, H: 4, L: 8192, DK: 64, DV: 64, chunk_size: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: dn-bwd-b2-s8k-h4-d64}
  - {B: 2, H: 4, L: 16384, DK: 64, DV: 64, chunk_size: 64, dtype_cases: [{T: float16}, {T: bfloat16}], label: dn-bwd-b2-s16k-h4-d64}
  roofline:
    flops: "4 * B * H * L * DK * DV"

GLAInferenceFwdOp:
  # One serving contract for equal-length prefill, packed varlen, and decode.
  # The in-tree kernel currently covers Hopper dense prefill only.
  family: linear_attention
  status: spec-only
  signature:
    types:
      State:
        params: {packed: Bool, B: Dim, N: Dim, H: Dim, K: Dim, V: Dim}
        match: packed
        cases:
        - {when: false, is: "[B, H, K, V]"}
        - {when: true, is: "[N, H, K, V]"}
    forall: {B: Dim, S: Dim, H: Dim, K: Dim, V: Dim, N: Dim, T: "DType[float16 | bfloat16]", seq_lens: "Seq[Int]"}
    params:
      scale: {type: "float | None", default: null}
    inputs:
      q: {dtype: T, shape: "[B, S, H, K]"}
      k: {dtype: T, shape: "[B, S, H, K]"}
      v: {dtype: T, shape: "[B, S, H, V]"}
      g: {dtype: T, shape: "[B, S, H, K]"}
      initial_state: {dtype: float32, shape: "State[present(cu_seqlens), B, N, H, K, V]", optional: true}
      cu_seqlens: {dtype: int64, shape: "[N + 1]", optional: true, values: "prefix_sum(seq_lens)", requires: ["prefix_offsets(S)"]}
      cu_seqlens_cpu: {dtype: int64, shape: "[N + 1]", optional: true, device: cpu, values: "prefix_sum(seq_lens)", requires: ["prefix_offsets(S)"]}
    outputs:
      o: {dtype: T, shape: "[B, S, H, V]"}
      final_state: {dtype: float32, shape: "State[present(cu_seqlens), B, N, H, K, V]"}
    shape_rules:
    - "K > 0 and V > 0"
    - "not present(cu_seqlens_cpu) or present(cu_seqlens)"
    - "not present(cu_seqlens) or B == 1"
  workloads:
  - {B: 2, S: 2048, H: 4, K: 64, V: 64, dtype_cases: [{T: bfloat16}], label: prefill-medium}
  - {B: 2, S: 4096, H: 4, K: 64, V: 64, some: [initial_state], dtype_cases: [{T: bfloat16}], label: prefill-seeded}
  - {B: 2, S: 8192, H: 4, K: 64, V: 64, dtype_cases: [{T: bfloat16}], label: prefill-long}
  - {B: 2, S: 16384, H: 4, K: 64, V: 64, some: [initial_state], dtype_cases: [{T: bfloat16}], label: prefill-very-long}
  roofline:
    flops: "2 * B * H * S * K * V"

GLAFwdOp:
  # Chunked GLA forward. initial_state seeds the recurrence (absent starts from
  # zeros) and has final_state's dtype, so one call's state feeds the next.
  family: linear_attention
  status: implemented
  signature:
    forall: {B: Dim, S: Dim, H: Dim, DK: Dim, DV: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      chunk_size: {type: int, default: 64}
      scale: {type: float, default: -1.0}
    inputs:
      q: {dtype: T, shape: "[B, S, H, DK]"}
      k: {dtype: T, shape: "[B, S, H, DK]"}
      v: {dtype: T, shape: "[B, S, H, DV]"}
      g: {dtype: T, shape: "[B, S, H, DK]"}
      initial_state: {dtype: float32, shape: "[B, H, DK, DV]", optional: true}
    outputs:
      o: {dtype: T, shape: "[B, S, H, DV]"}
      final_state: {dtype: float32, shape: "[B, H, DK, DV]"}
    shape_rules:
    - "B > 0 and S > 0 and H > 0 and DK > 0 and DV > 0"
    - "chunk_size > 0 and S % chunk_size == 0"
  workloads:
  - {B: 2, S: 2048, H: 4, DK: 64, DV: 64, chunk_size: 64, scale: 0.125, dtype_cases: [{T: float16}, {T: bfloat16}], label: gla-noinit-b2-s2k-h4-d64}
  - {B: 2, S: 4096, H: 4, DK: 64, DV: 64, chunk_size: 64, scale: 0.125, some: [initial_state], dtype_cases: [{T: float16}, {T: bfloat16}], label: gla-init-b2-s4k-h4-d64}
  - {B: 2, S: 8192, H: 4, DK: 64, DV: 64, chunk_size: 64, scale: 0.125, dtype_cases: [{T: float16}, {T: bfloat16}], label: gla-noinit-b2-s8k-h4-d64}
  - {B: 2, S: 16384, H: 4, DK: 64, DV: 64, chunk_size: 64, scale: 0.125, some: [initial_state], dtype_cases: [{T: float16}, {T: bfloat16}], label: gla-init-b2-s16k-h4-d64}
  roofline:
    flops: "2 * B * H * S * DK * DV"

GLABwdOp:
  # Chunked GLA backward over the forward's per-chunk states h. Gradients are
  # fp32 (accumulator dtype). has_initial_state says whether the forward this
  # backward pairs with was seeded.
  family: linear_attention
  status: implemented
  signature:
    forall: {B: Dim, S: Dim, H: Dim, DK: Dim, DV: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      chunk_size: {type: int, default: 64}
      scale: {type: float, default: -1.0}
      has_initial_state: {type: bool, default: false}
    inputs:
      q: {dtype: T, shape: "[B, S, H, DK]"}
      k: {dtype: T, shape: "[B, S, H, DK]"}
      v: {dtype: T, shape: "[B, S, H, DV]"}
      g: {dtype: T, shape: "[B, S, H, DK]"}
      h: {dtype: float32, shape: "[B, NC + 1, H, DK, DV]"}
      do: {dtype: T, shape: "[B, S, H, DV]"}
      dht: {dtype: float32, shape: "[B, H, DK, DV]"}
    outputs:
      dq: {dtype: float32, shape: "[B, S, H, DK]"}
      dk: {dtype: float32, shape: "[B, S, H, DK]"}
      dv: {dtype: float32, shape: "[B, S, H, DV]"}
      dg: {dtype: float32, shape: "[B, S, H, DK]"}
    let: {NC: "S // chunk_size"}
    shape_rules:
    - "B > 0 and S > 0 and H > 0 and DK > 0 and DV > 0"
    - "chunk_size > 0 and S % chunk_size == 0"
