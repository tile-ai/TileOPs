# linear_attention.yaml -- manifest entries for linear-attention operators.
#
# Source of truth for linear-attention op interfaces. Spec-only entries define
# the public Op contract before the implementation is wired up.

GatedDeltaNetFwdOp:
  # Inference contract shared by equal-length, packed-varlen, prefill, and
  # single-token decode calls. Unlike the FLA reference, this contract always
  # returns final_state: serving callers need it to continue recurrence.
  ref_api: "fla.ops.gated_delta_rule.chunk_gated_delta_rule"
  family: linear_attention
  status: spec-only

  signature:
    inputs:
      q: {dtype: "float16 | bfloat16", shape: "[B, T, H, K]"}
      k: {dtype: "same_as(q)", shape: "[B, T, H, K]"}
      v: {dtype: "same_as(q)", shape: "[B, T, HV, V]"}
      g: {dtype: "same_as(q)", shape: "[B, T, HV]"}
      beta: {dtype: "same_as(q)", shape: "[B, T, HV]"}
      initial_state: {dtype: "float32", optional: true}
      cu_seqlens: {dtype: "int64", optional: true}
      cu_seqlens_cpu: {dtype: "int64", optional: true}
      A_log: {dtype: "float32", shape: "[HV]", optional: true}
      dt_bias: {dtype: "float32", shape: "[HV]", optional: true}
    outputs:
      o: {dtype: "same_as(q)", shape: "[B, T, HV, V]"}
      final_state: {dtype: "float32"}
    params:
      scale: {type: "float | None", default: null}
      use_qk_l2norm_in_kernel: {type: bool, default: false}
      use_beta_sigmoid_in_kernel: {type: bool, default: false}
      allow_neg_eigval: {type: bool, default: false}
      state_v_first: {type: bool, default: false}
      use_gate_in_kernel: {type: bool, default: false}
    shape_rules:
      - "k.shape == q.shape"
      - "v.shape == (B, T, HV, V)"
      - "g.shape == (B, T, HV)"
      - "beta.shape == g.shape"
      - "HV % H == 0"
      - "cu_seqlens is None or (B == 1 and cu_seqlens.ndim == 1 and cu_seqlens.shape[0] >= 2)"
      - "cu_seqlens_cpu is None or cu_seqlens is not None"
      - "cu_seqlens_cpu is None or cu_seqlens is None or cu_seqlens_cpu.shape == cu_seqlens.shape"
      - "initial_state is None or initial_state.ndim == 4"
      - "initial_state is None or cu_seqlens is not None or initial_state.shape[0] == B"
      - "initial_state is None or cu_seqlens is None or initial_state.shape[0] + 1 == cu_seqlens.shape[0]"
      - "initial_state is None or state_v_first or initial_state.shape[1:] == (HV, K, V)"
      - "initial_state is None or not state_v_first or initial_state.shape[1:] == (HV, V, K)"
      - "(A_log is None) == (dt_bias is None)"
      - "(A_log is None) == (not use_gate_in_kernel)"
      - "A_log is None or A_log.shape == (HV,)"
      - "dt_bias is None or dt_bias.shape == (HV,)"
      - "not allow_neg_eigval or use_beta_sigmoid_in_kernel"
      - "o.shape == (B, T, HV, V)"
      - "final_state.ndim == 4"
      - "cu_seqlens is not None or final_state.shape[0] == B"
      - "cu_seqlens is None or final_state.shape[0] + 1 == cu_seqlens.shape[0]"
      - "state_v_first or final_state.shape[1:] == (HV, K, V)"
      - "not state_v_first or final_state.shape[1:] == (HV, V, K)"

  workloads: []

  roofline:
    func: "tileops.perf.formulas.gated_deltanet_fwd_roofline"

  source:
    kernel: tileops/ops/linear_attention/gated_deltanet.py
    op: tileops/ops/linear_attention/gated_deltanet.py
    test: tests/ops/test_gated_deltanet.py
    bench: null

DeltaNetDecodeFwdOp:
  # Single-token ungated DeltaNet decode. Like GDN decode, state ownership is
  # functional: state is read and new_state is returned.
  ref_api: "none"
  family: linear_attention
  status: implemented

  signature:
    inputs:
      q: {dtype: "float16 | bfloat16 | float32", shape: "[B, H, DK]"}
      k: {dtype: "same_as(q)", shape: "[B, H, DK]"}
      v: {dtype: "same_as(q)", shape: "[B, H, DV]"}
      beta: {dtype: "same_as(q)", shape: "[B, H]"}
      state: {dtype: "same_as(q)", shape: "[B, H, DK, DV]"}
    outputs:
      o: {dtype: "same_as(q)", shape: "[B, H, DV]"}
      new_state: {dtype: "same_as(q)", shape: "[B, H, DK, DV]"}
    params: {}
    shape_rules:
    - "q.shape == (B, H, DK)"
    - "k.shape == (B, H, DK)"
    - "v.shape == (B, H, DV)"
    - "beta.shape == (B, H)"
    - "state.shape == (B, H, DK, DV)"
    - "o.shape == (B, H, DV)"
    - "new_state.shape == (B, H, DK, DV)"

  workloads:
