  - {q_shape: [2, 4, 8192, 64], k_shape: [2, 4, 8192, 64], v_shape: [2, 4, 8192, 64], beta_shape: [2, 4, 8192], chunk_size: 64, dtypes: [float16, bfloat16], label: "dn-b2-s8k-h4-d64"}
  - {q_shape: [2, 4, 16384, 64], k_shape: [2, 4, 16384, 64], v_shape: [2, 4, 16384, 64], beta_shape: [2, 4, 16384], chunk_size: 64, dtypes: [float16, bfloat16], label: "dn-b2-s16k-h4-d64"}
  roofline: {func: tileops.perf.formulas.deltanet_fwd_roofline}
  source:
    kernel: tileops/kernels/linear_attention/deltanet/deltanet_fwd.py
    kernel_map:
      DeltaNetFwdKernel: DeltaNetFwdKernel
    op: tileops/ops/linear_attention/deltanet.py
    test: tests/ops/test_deltanet_fwd.py
    bench: benchmarks/ops/bench_deltanet.py
    bench_manifest_driven: true

