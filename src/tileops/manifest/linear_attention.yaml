  - {q_shape: [8, 64, 128], k_shape: [8, 64, 128], v_shape: [8, 64, 128], beta_shape: [8, 64], state_shape: [8, 64, 128, 128], dtypes: [bfloat16], label: "delta-decode-serving-b8-h64-d128"}

