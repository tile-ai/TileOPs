GLAFwdOp:
  ref_api: "none"
  family: linear_attention
  status: implemented
  signature:
    inputs:
      q: {dtype: "float16 | bfloat16 | float32", shape: "[B, S, H, DK]"}
      k: {dtype: "same_as(q)", shape: "[B, S, H, DK]"}
      v: {dtype: "same_as(q)", shape: "[B, S, H, DV]"}
      g: {dtype: "same_as(q)", shape: "[B, S, H, DK]"}
      # The state a caller may seed the recurrence with; not passing it starts
      # from zeros. Same dtype as final_state, so one call's state feeds the next.
      initial_state: {dtype: "float32", shape: "[B, H, DK, DV]", optional: true}
    outputs:
      o: {dtype: "same_as(q)", shape: "[B, S, H, DV]"}
      # The recurrence carries the state in fp32 whatever the inputs are.
      final_state: {dtype: "float32", shape: "[B, H, DK, DV]"}
    params:
      chunk_size: {type: int, default: 64}
      scale: {type: float, default: -1.0}
    shape_rules:
    - "S % chunk_size == 0"
  workloads:
  - {q_shape: [2, 2048, 4, 64], k_shape: [2, 2048, 4, 64], v_shape: [2, 2048, 4, 64], g_shape: [2, 2048, 4, 64], chunk_size: 64, scale: 0.125, dtypes: [float16, bfloat16], label: "gla-noinit-b2-s2k-h4-d64"}
