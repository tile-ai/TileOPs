DeltaNetAutogradOp:
  ref_api: "none"
  family: linear_attention
  status: implemented
  # The autograd wrapper over DeltaNetFwdOp and DeltaNetBwdOp: one output rather than the
  # forward's six, because the chunk buffers the backward reads are saved for it rather
  # than returned.
  signature:
    inputs:
      q: {dtype: "float16 | bfloat16 | float32", shape: "[B, H, S, DK]"}
      k: {dtype: "same_as(q)", shape: "[B, H, S, DK]"}
      v: {dtype: "same_as(q)", shape: "[B, H, S, DV]"}
      beta: {dtype: "same_as(q)", shape: "[B, H, S]"}
    outputs:
      o: {dtype: "same_as(q)", shape: "[B, H, S, DV]"}
    params:
      chunk_size: {type: int, default: 64}
    shape_rules:
    - "S % chunk_size == 0"
  workloads:
  - {q_shape: [2, 4, 2048, 64], k_shape: [2, 4, 2048, 64], v_shape: [2, 4, 2048, 64], beta_shape: [2, 4, 2048], chunk_size: 64, dtypes: [float16, bfloat16], label: "dn-autograd-b2-s2k-h4-d64"}
  - {q_shape: [2, 4, 8192, 64], k_shape: [2, 4, 8192, 64], v_shape: [2, 4, 8192, 64], beta_shape: [2, 4, 8192], chunk_size: 64, dtypes: [float16, bfloat16], label: "dn-autograd-b2-s8k-h4-d64"}
  roofline: {func: tileops.perf.formulas.deltanet_fwd_roofline}
  source:
    kernel: tileops/kernels/linear_attention/deltanet/deltanet_fwd.py
    kernel_map:
      DeltaNetFwdKernel: DeltaNetFwdKernel
      DeltaNetBwdKernel: DeltaNetBwdKernel
    op: tileops/ops/linear_attention/deltanet.py
    test: tests/ops/test_deltanet_autograd.py
    bench: benchmarks/ops/bench_deltanet.py
    bench_manifest_driven: true

DeltaNetFwdOp:
  ref_api: "none"
  family: linear_attention
  status: implemented
  signature:
    inputs:
      q: {dtype: "float16 | bfloat16 | float32", shape: "[B, H, S, DK]"}
      k: {dtype: "same_as(q)", shape: "[B, H, S, DK]"}
      v: {dtype: "same_as(q)", shape: "[B, H, S, DV]"}
      beta: {dtype: "same_as(q)", shape: "[B, H, S]"}
    outputs:
      o: {dtype: "same_as(q)", shape: "[B, H, S, DV]"}
      # The running state accumulates in fp32 whatever the inputs are; the chunk
      # buffers the backward reads come back in the input dtype.
      S: {dtype: "float32", shape: "[B, H, NC + 1, DK, DV]"}
      Aw: {dtype: "same_as(q)", shape: "[B, H, S, chunk_size]"}
      Au: {dtype: "same_as(q)", shape: "[B, H, S, chunk_size]"}
      w: {dtype: "same_as(q)", shape: "[B, H, S, DK]"}
      u: {dtype: "same_as(q)", shape: "[B, H, S, DV]"}
    params:
      chunk_size: {type: int, default: 64}
    shape_rules:
    - "S % chunk_size == 0"
    - "NC == S // chunk_size"
  workloads:
  - {q_shape: [2, 4, 2048, 64], k_shape: [2, 4, 2048, 64], v_shape: [2, 4, 2048, 64], beta_shape: [2, 4, 2048], chunk_size: 64, dtypes: [float16, bfloat16], label: "dn-b2-s2k-h4-d64"}
