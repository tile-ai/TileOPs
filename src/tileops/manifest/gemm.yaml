# Dense GEMM family.
GemmFwdOp:
  ref_api: "torch.matmul"
  family: gemm
  status: implemented

  signature:
    types:
      # A matrix stored as written, or transposed.
      Mat:
        params: {t: Bool, R: Dim, C: Dim}
        match: t
        cases:
        - {when: false, is: "[R, C]"}
        - {when: true, is: "[C, R]"}
    forall: {M: Dim, N: Dim, K: Dim, T: "DType[float16 | bfloat16]"}
    params:
      trans_a: {type: bool, default: false}
      trans_b: {type: bool, default: true}
    inputs:
      a: {dtype: T, shape: "Mat[trans_a, M, K]"}
      b: {dtype: T, shape: "Mat[trans_b, K, N]"}
    outputs:
      d: {dtype: T, shape: "[M, N]"}

  workloads:
  # trans_a/trans_b pick the storage layout the kernel compiles for. The NT (N, K) shapes mirror
  # DeepGEMM's normal-GEMM test set (DeepSeek-V3 MLP/attention projections), swept over decode
  # (M=128) and prefill (M=4096) token counts.
  - {M: 1024, N: 1024, K: 1024, trans_a: false, trans_b: false, dtype_cases: [{T: float16}, {T: bfloat16}], label: square-1k-nn}
  - {M: 128, N: 2112, K: 7168, trans_a: false, trans_b: true, dtype_cases: [{T: bfloat16}], label: ds-v3-decode-gate-up}
  - {M: 128, N: 7168, K: 2048, trans_a: false, trans_b: true, dtype_cases: [{T: bfloat16}], label: ds-v3-decode-down}
  - {M: 4096, N: 2112, K: 7168, trans_a: false, trans_b: true, dtype_cases: [{T: bfloat16}], label: ds-v3-prefill-gate-up}
  - {M: 4096, N: 7168, K: 2048, trans_a: false, trans_b: true, dtype_cases: [{T: bfloat16}], label: ds-v3-prefill-down}
  - {M: 4096, N: 4096, K: 7168, trans_a: false, trans_b: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: ds-v3-prefill-attn-proj}
  - {M: 4096, N: 7168, K: 16384, trans_a: false, trans_b: true, dtype_cases: [{T: bfloat16}], label: k-dominant-7168x16384}
  - {M: 4096, N: 24576, K: 1536, trans_a: false, trans_b: true, dtype_cases: [{T: bfloat16}], label: wide-n-24576}
  # Mid-M band: samples of M = 9..127, the token-count gap below the decode/prefill sweep; N/K
  # reuse the DeepSeek-V3 projection shapes above.
  - {M: 16, N: 4096, K: 7168, trans_a: false, trans_b: true, dtype_cases: [{T: bfloat16}], label: mid-m16-attn}
  - {M: 32, N: 4096, K: 7168, trans_a: false, trans_b: true, dtype_cases: [{T: bfloat16}], label: mid-m32-attn}
  - {M: 64, N: 7168, K: 2048, trans_a: false, trans_b: true, dtype_cases: [{T: bfloat16}], label: mid-m64-down}
  - {M: 96, N: 2112, K: 7168, trans_a: false, trans_b: true, dtype_cases: [{T: bfloat16}], label: mid-m96-gate-up}
  # Single- and two-token decode. These are the only workloads whose M reaches the bandwidth
  # kernel modes, one per mode, on the same projection as the decode rows above. The two-token
  # shape keeps N narrow on purpose: on a grid wide enough for the operand-swapped generic kernel
  # that one serves M = 2 instead.
  - {M: 1, N: 2112, K: 7168, trans_a: false, trans_b: true, dtype_cases: [{T: bfloat16}], label: ds-v3-decode-gate-up-b1}
  - {M: 2, N: 2112, K: 7168, trans_a: false, trans_b: true, dtype_cases: [{T: bfloat16}], label: ds-v3-decode-gate-up-b2}

  roofline:
    flops: "2 * M * N * K"

GemmFp8FwdOp:
  ref_api: "torch._scaled_mm"
  family: gemm
  status: implemented

  signature:
    # b is the [N, K] operand torch._scaled_mm receives transposed. The scales are per-tensor
    # [1, 1] for both operands, or per 1x128 block along K for both: [M, ceil(K/128)] and
    # [N, ceil(K/128)].
    forall: {M: Dim, N: Dim, K: Dim, SA: Shape, SB: Shape, T: "DType[float8_e4m3fn]"}
    params:
      out_dtype: {type: "bfloat16 | float16", default: bfloat16}
    inputs:
      a: {dtype: T, shape: "[M, K]"}
      b: {dtype: T, shape: "[N, K]"}
      scale_a: {dtype: float32, shape: "[*SA]"}
      scale_b: {dtype: float32, shape: "[*SB]"}
      bias: {dtype: out_dtype, shape: "[N]", optional: true}
    outputs:
      d: {dtype: out_dtype, shape: "[M, N]"}
    shape_rules:
    - "(SA == (1, 1) and SB == (1, 1)) or (SA == (M, ceil_div(K, 128)) and SB == (N, ceil_div(K, 128)))"

  workloads:
  - {M: 128, N: 2112, K: 7168, SA: [1, 1], SB: [1, 1], dtype_cases: [{T: float8_e4m3fn}], label: ds-v3-decode-gate-up-per-tensor}
  - {M: 128, N: 7168, K: 2048, SA: [1, 1], SB: [1, 1], dtype_cases: [{T: float8_e4m3fn}], label: ds-v3-decode-down-per-tensor}
  - {M: 4096, N: 2112, K: 7168, SA: [1, 1], SB: [1, 1], dtype_cases: [{T: float8_e4m3fn}], label: ds-v3-prefill-gate-up-per-tensor}
  - {M: 4096, N: 7168, K: 2048, SA: [1, 1], SB: [1, 1], dtype_cases: [{T: float8_e4m3fn}], label: ds-v3-prefill-down-per-tensor}
  - {M: 128, N: 2112, K: 7168, SA: [128, 56], SB: [2112, 56], dtype_cases: [{T: float8_e4m3fn}], label: ds-v3-decode-gate-up-block128}
  - {M: 128, N: 7168, K: 2048, SA: [128, 16], SB: [7168, 16], dtype_cases: [{T: float8_e4m3fn}], label: ds-v3-decode-down-block128}
  - {M: 4096, N: 2112, K: 7168, SA: [4096, 56], SB: [2112, 56], dtype_cases: [{T: float8_e4m3fn}], label: ds-v3-prefill-gate-up-block128}
  - {M: 4096, N: 7168, K: 2048, SA: [4096, 16], SB: [7168, 16], dtype_cases: [{T: float8_e4m3fn}], label: ds-v3-prefill-down-block128}
  - {M: 4096, N: 4096, K: 7168, SA: [4096, 56], SB: [4096, 56], dtype_cases: [{T: float8_e4m3fn}], label: ds-v3-prefill-attn-proj-block128}
  - {M: 4096, N: 7168, K: 16384, SA: [4096, 128], SB: [7168, 128], dtype_cases: [{T: float8_e4m3fn}], label: k-dominant-7168x16384-block128}
  - {M: 4096, N: 24576, K: 1536, SA: [4096, 12], SB: [24576, 12], dtype_cases: [{T: float8_e4m3fn}], label: wide-n-24576-block128}
  - {M: 8, N: 7168, K: 2048, SA: [1, 1], SB: [1, 1], dtype_cases: [{T: float8_e4m3fn}], label: small-batch-down-m8-per-tensor}
  - {M: 1, N: 7168, K: 2048, SA: [1, 1], SB: [1, 1], dtype_cases: [{T: float8_e4m3fn}], label: gemv-down-m1-per-tensor}
  - {M: 1, N: 7168, K: 2048, SA: [1, 16], SB: [7168, 16], dtype_cases: [{T: float8_e4m3fn}], label: gemv-down-m1-block128}
  - {M: 128, N: 2112, K: 7168, SA: [1, 1], SB: [1, 1], some: [bias], dtype_cases: [{T: float8_e4m3fn}], label: ds-v3-decode-gate-up-per-tensor-bias}
  - {M: 128, N: 2112, K: 7168, SA: [1, 1], SB: [1, 1], out_dtype: float16, dtype_cases: [{T: float8_e4m3fn}], label: ds-v3-decode-gate-up-per-tensor}
  - {M: 128, N: 2112, K: 7168, SA: [128, 56], SB: [2112, 56], out_dtype: float16, dtype_cases: [{T: float8_e4m3fn}], label: ds-v3-decode-gate-up-block128}

  roofline:
    flops: "2 * M * N * K"

GemmW4A16FwdOp:
  family: gemm
  status: implemented

  signature:
    forall: {M: Dim, N: Dim, K: Dim, T: "DType[float16]"}
    params:
      group_size: {type: int, default: 128}
    inputs:
      activation: {dtype: T, shape: "[M, K]"}
      # Two INT4 weights per byte, in the order GemmW4A16FwdOp.repack produces.
      packed_weight: {dtype: uint8, shape: "[N, K // 2]"}
      weight_scale: {dtype: T, shape: "[N, K // group_size]"}
      weight_zero: {dtype: uint8, shape: "[N, K // group_size]"}
    outputs:
      output: {dtype: T, shape: "[M, N]"}
    shape_rules:
    - "group_size > 0"
    - "K % 2 == 0 and K % group_size == 0"

  workloads:
  # Decode-oriented coverage. The small non-decode shapes are compile/smoke checks only; they are
  # not intended to claim full GEMM performance coverage.
  - {M: 64, N: 64, K: 128, dtype_cases: [{T: float16}], label: compile-smoke-square-64x64x128}
  - {M: 128, N: 256, K: 256, dtype_cases: [{T: float16}], label: compile-smoke-rect-128x256x256}
  - {M: 1, N: 8192, K: 8192, dtype_cases: [{T: float16}], label: decode-l2-resident-ish}
  - {M: 1, N: 8192, K: 16384, dtype_cases: [{T: float16}], label: decode-hbm-streaming-threshold}
  - {M: 1, N: 7168, K: 20480, dtype_cases: [{T: float16}], label: decode-non-power2-low-cta}
  - {M: 1, N: 8192, K: 81920, dtype_cases: [{T: float16}], label: decode-long-k-pressure}
  # The token axis at one shape. Server batching lands here, and the kernel picks a different
  # tile at each of these counts.
  - {M: 2, N: 8192, K: 8192, dtype_cases: [{T: float16}], label: batched-decode-two-requests}
  - {M: 8, N: 8192, K: 8192, dtype_cases: [{T: float16}], label: batched-decode-server-batch}
  - {M: 32, N: 8192, K: 8192, dtype_cases: [{T: float16}], label: batched-decode-wide-batch}
  - {M: 128, N: 8192, K: 8192, dtype_cases: [{T: float16}], label: chunked-prefill-tile}
  - {M: 512, N: 8192, K: 8192, dtype_cases: [{T: float16}], label: prefill-mlp-up-projection}
  # Hidden sizes other than 8192, where the decode rows above do not predict the result: the
  # one-token grid under-fills the machine at 4096, the prefill one at 5120, and the tile selector
  # answers each differently.
  - {M: 1, N: 4096, K: 14336, dtype_cases: [{T: float16}], label: decode-llama3-8b-mlp-down}
  - {M: 128, N: 4096, K: 14336, dtype_cases: [{T: float16}], label: prefill-llama3-8b-mlp-down}
  - {M: 128, N: 5120, K: 25600, dtype_cases: [{T: float16}], label: prefill-qwen3-32b-mlp-down}
  # A tensor-parallel shard: N is a fraction of the layer's, so the grid is far smaller than the
  # machine and the per-CTA work dominates.
  - {M: 1, N: 1024, K: 8192, dtype_cases: [{T: float16}], label: decode-tp8-attention-out}

  roofline:
    flops: "2 * M * N * K"


GroupedGemmFwdOp:
  family: gemm
  status: implemented

  signature:
    # G groups packed along M rows. Without transpose_a each group multiplies its rows of a by
    # its own b; with transpose_a the groups split the contraction and the output keeps a group
    # axis. transpose_b stores the per-group operand transposed.
    types:
      A:
        params: {ta: Bool, M: Dim, N: Dim, K: Dim}
        match: ta
        cases:
        - {when: false, is: "[M, K]"}
        - {when: true, is: "[M, N]"}
      B:
        params: {ta: Bool, tb: Bool, M: Dim, G: Dim, N: Dim, K: Dim}
        match: [ta, tb]
        cases:
        - {when: [false, false], is: "[G, K, N]"}
        - {when: [false, true], is: "[G, N, K]"}
        - {when: [true, false], is: "[M, K]"}
        - {when: [true, true], is: "[K, M]"}
      Out:
        params: {ta: Bool, M: Dim, G: Dim, N: Dim, K: Dim}
        match: ta
        cases:
        - {when: false, is: "[M, N]"}
        - {when: true, is: "[G, N, K]"}
    forall: {M: Dim, G: Dim, N: Dim, K: Dim, T: "DType[float16 | bfloat16]"}
    params:
      transpose_a: {type: bool, default: false}
      transpose_b: {type: bool, default: true}
    inputs:
      a: {dtype: T, shape: "A[transpose_a, M, N, K]"}
      b: {dtype: T, shape: "B[transpose_a, transpose_b, M, G, N, K]"}
      batch_sizes: {dtype: int32, shape: "[G]", values: "as_tensor(balanced_sizes(M, G))", requires: ["in_range(0, M + 1)", "sums_to(M)"]}
      batch_offsets: {dtype: int32, shape: "[G]", values: "exclusive_prefix_sum(balanced_sizes(M, G))", requires: ["exclusive_prefix_of(batch_sizes)"]}
      # The start of each group padded to 128 rows. No kernel reads it.
      batch_padded_offsets: {dtype: int32, shape: "[G]", values: "padded_exclusive_prefix_sum(balanced_sizes(M, G), 128)"}
    outputs:
      output: {dtype: T, shape: "Out[transpose_a, M, G, N, K]"}
    shape_rules:
    - "M > 0"
    - "G > 0"
    - "N > 0"
    - "K > 0"

  workloads:
  - {M: 4096, G: 16, N: 4096, K: 4096, transpose_a: false, transpose_b: true, dtype_cases: [{T: float16}, {T: bfloat16}], label: nt-batch16-m4096-n4096-k4096}
  - {M: 4096, G: 16, N: 4096, K: 4096, transpose_a: false, transpose_b: false, dtype_cases: [{T: float16}], label: nn-batch16-m4096-n4096-k4096}
  - {M: 4096, G: 16, N: 4096, K: 4096, transpose_a: true, transpose_b: false, dtype_cases: [{T: float16}], label: tn-batch16-m4096-n4096-k4096}

  roofline:
    flops: "2 * M * N * K"
    # batch_padded_offsets is passed and never read.
    bytes: "bytes(a) + bytes(b) + bytes(batch_sizes) + bytes(batch_offsets) + bytes(output)"
