      dH: "per_axis(dilation, 1, 3)"
      kW: "per_axis(kernel_size, 2, 3)"
      sW: "per_axis(stride, 2, 3, fallback=kW)"
      pW: "per_axis(padding, 2, 3)"
      dW: "per_axis(dilation, 2, 3)"
