# pool.yaml -- manifest entries for the 'pool' family.
#
# Source of truth for pooling op interfaces. Each entry's `status` field is the
# authority on whether it is implemented.

AvgPool1dFwdOp:
  ref_api: torch.nn.functional.avg_pool1d
  family: pool
  status: implemented

  signature:
    forall: {N: Dim, C: Dim, L_in: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      kernel_size: {type: "int | tuple[int]"}
      stride: {type: "int | tuple[int] | None", default: null}
      padding: {type: "int | tuple[int]", default: 0}
      ceil_mode: {type: bool, default: false}
      count_include_pad: {type: bool, default: true}
    inputs:
      input: {dtype: T, shape: "[N, C, L_in]"}
    outputs:
      output: {dtype: T, shape: "[N, C, L_out]"}
    let:
      kW: "per_axis(kernel_size, 0, 1)"
      sW: "per_axis(stride, 0, 1, fallback=kW)"
      pW: "per_axis(padding, 0, 1)"
      L_out: "pool.out(L_in, kW, sW, pW, 1, ceil_mode)"
    shape_rules:
    - "kW > 0 and sW > 0"
    - "0 <= pW <= kW // 2"
    - "L_in > 0 and L_out > 0"

  workloads:
  # Temporal/audio downsampling cases, expressed in PyTorch NCL layout.
  - {N: 4, C: 128, L_in: 4096, kernel_size: 3, stride: 2, padding: 1, dtype_cases: [{T: float16}, {T: float32}], label: audio-downsample}
  - {N: 2, C: 256, L_in: 32000, kernel_size: 5, stride: 4, padding: 2, dtype_cases: [{T: float16}], label: long-temporal}
  - {N: 2, C: 128, L_in: 2048, kernel_size: 4, stride: 2, padding: 1, ceil_mode: true, count_include_pad: false, dtype_cases: [{T: bfloat16}], label: ceil}

  roofline:
    flops: "N * C * L_out * kW"

AvgPool2dFwdOp:
  ref_api: torch.nn.functional.avg_pool2d
  family: pool
  status: implemented

  signature:
    forall: {N: Dim, C: Dim, H_in: Dim, W_in: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      kernel_size: {type: "int | tuple[int, int]"}
      stride: {type: "int | tuple[int, int] | None", default: null}
      padding: {type: "int | tuple[int, int]", default: 0}
      ceil_mode: {type: bool, default: false}
      count_include_pad: {type: bool, default: true}
      divisor_override: {type: "int | None", default: null}
    inputs:
      input: {dtype: T, shape: "[N, C, H_in, W_in]"}
    outputs:
      output: {dtype: T, shape: "[N, C, H_out, W_out]"}
    let:
      kH: "per_axis(kernel_size, 0, 2)"
      sH: "per_axis(stride, 0, 2, fallback=kH)"
      pH: "per_axis(padding, 0, 2)"
      kW: "per_axis(kernel_size, 1, 2)"
      sW: "per_axis(stride, 1, 2, fallback=kW)"
      pW: "per_axis(padding, 1, 2)"
      H_out: "pool.out(H_in, kH, sH, pH, 1, ceil_mode)"
      W_out: "pool.out(W_in, kW, sW, pW, 1, ceil_mode)"
    shape_rules:
    - "kH > 0 and sH > 0 and kW > 0 and sW > 0"
    - "0 <= pH <= kH // 2 and 0 <= pW <= kW // 2"
    - "not present(divisor_override) or divisor_override.value != 0"
    - "H_in > 0 and W_in > 0 and H_out > 0 and W_out > 0"

  workloads:
  # Real-model sources: ResNet-style and ConvNeXt-style vision backbones use
  # 2D average-pooling/downsampling over NCHW feature maps at early and middle
  # feature stages. The asymmetric ceil/divisor case is a stress workload for
  # PyTorch avg_pool2d semantics, not a separate model family.
  - {N: 2, C: 64, H_in: 112, W_in: 112, kernel_size: [3, 3], stride: [2, 2], padding: [1, 1], dtype_cases: [{T: float16}, {T: float32}], label: vision-3x3-s2}
  - {N: 2, C: 128, H_in: 56, W_in: 56, kernel_size: [5, 5], stride: [2, 2], padding: [2, 2], dtype_cases: [{T: float16}], label: vision-5x5-s2}
  - {N: 3, C: 96, H_in: 55, W_in: 57, kernel_size: [3, 5], stride: [2, 2], padding: [1, 2], ceil_mode: true, count_include_pad: false, divisor_override: 7, dtype_cases: [{T: bfloat16}], label: ceil-divisor}

  roofline:
    flops: "N * C * H_out * W_out * kH * kW"

AvgPool3dFwdOp:
  ref_api: torch.nn.functional.avg_pool3d
  family: pool
  status: implemented

  signature:
    forall: {N: Dim, C: Dim, D_in: Dim, H_in: Dim, W_in: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      kernel_size: {type: "int | tuple[int, int, int]"}
      stride: {type: "int | tuple[int, int, int] | None", default: null}
      padding: {type: "int | tuple[int, int, int]", default: 0}
      ceil_mode: {type: bool, default: false}
      count_include_pad: {type: bool, default: true}
      divisor_override: {type: "int | None", default: null}
    inputs:
      input: {dtype: T, shape: "[N, C, D_in, H_in, W_in]"}
    outputs:
      output: {dtype: T, shape: "[N, C, D_out, H_out, W_out]"}
    let:
      kD: "per_axis(kernel_size, 0, 3)"
      sD: "per_axis(stride, 0, 3, fallback=kD)"
      pD: "per_axis(padding, 0, 3)"
      kH: "per_axis(kernel_size, 1, 3)"
      sH: "per_axis(stride, 1, 3, fallback=kH)"
      pH: "per_axis(padding, 1, 3)"
      kW: "per_axis(kernel_size, 2, 3)"
      sW: "per_axis(stride, 2, 3, fallback=kW)"
      pW: "per_axis(padding, 2, 3)"
      D_out: "pool.out(D_in, kD, sD, pD, 1, ceil_mode)"
      H_out: "pool.out(H_in, kH, sH, pH, 1, ceil_mode)"
      W_out: "pool.out(W_in, kW, sW, pW, 1, ceil_mode)"
    shape_rules:
    - "kD > 0 and sD > 0 and kH > 0 and sH > 0 and kW > 0 and sW > 0"
    - "0 <= pD <= kD // 2 and 0 <= pH <= kH // 2 and 0 <= pW <= kW // 2"
    - "not present(divisor_override) or divisor_override.value != 0"
    - "D_in > 0 and H_in > 0 and W_in > 0 and D_out > 0 and H_out > 0 and W_out > 0"

  workloads:
  # Real-model sources: I3D/SlowFast-style video CNNs use 3D spatiotemporal
  # pooling over NCDHW activations. The ceil and divisor workloads stress
  # PyTorch avg_pool3d semantics on video-like feature volumes.
  - {N: 1, C: 32, D_in: 16, H_in: 56, W_in: 56, kernel_size: [2, 2, 2], stride: [2, 2, 2], padding: [0, 0, 0], dtype_cases: [{T: float16}, {T: float32}], label: video-2x2x2}
  - {N: 2, C: 64, D_in: 8, H_in: 28, W_in: 28, kernel_size: [2, 3, 3], stride: [2, 2, 2], padding: [1, 1, 1], ceil_mode: true, count_include_pad: false, dtype_cases: [{T: float16}], label: ceil-video}
  - {N: 2, C: 24, D_in: 10, H_in: 20, W_in: 22, kernel_size: [2, 2, 3], stride: [2, 2, 2], padding: [0, 1, 1], divisor_override: 7, dtype_cases: [{T: bfloat16}], label: divisor}

  roofline:
    flops: "N * C * D_out * H_out * W_out * kD * kH * kW"

MaxPool1dFwdOp:
  # Equivalent to torch.nn.functional.max_pool1d (return_indices=False)
  ref_api: torch.nn.functional.max_pool1d
  family: pool
  status: implemented

  signature:
    forall: {N: Dim, C: Dim, L_in: Dim, T: "DType[float16 | bfloat16 | float32]"}
    params:
      kernel_size: {type: "int | tuple[int]"}
      stride: {type: "int | tuple[int] | None", default: null}
      padding: {type: "int | tuple[int]", default: 0}
      dilation: {type: "int | tuple[int]", default: 1}
      ceil_mode: {type: bool, default: false}
    inputs:
      input: {dtype: T, shape: "[N, C, L_in]"}
    outputs:
      output: {dtype: T, shape: "[N, C, L_out]"}
    let:
      kW: "per_axis(kernel_size, 0, 1)"
      sW: "per_axis(stride, 0, 1, fallback=kW)"
      pW: "per_axis(padding, 0, 1)"
      dW: "per_axis(dilation, 0, 1)"
      L_out: "pool.out(L_in, kW, sW, pW, dW, ceil_mode)"
    shape_rules:
    - "kW > 0 and sW > 0"
    - "dW > 0"
    - "0 <= pW <= kW // 2"
    - "L_in > 0 and L_out > 0"

  workloads:
  # Real-model sources: SincNet-style speaker CNNs use local MaxPool1d
  # over waveform features; TextCNN-style classifiers use global temporal
  # max pooling over token-convolution channels; ECG CNN classifiers use
  # repeated 1D max-pooling downsampling on long signals.
  - {N: 32, C: 80, L_in: 4096, kernel_size: 3, stride: 3, padding: 0, dtype_cases: [{T: float16}, {T: float32}], label: sincnet-speaker-local}
  - {N: 64, C: 256, L_in: 128, kernel_size: 128, stride: 1, padding: 0, dtype_cases: [{T: float16}], label: textcnn-global}
  - {N: 16, C: 128, L_in: 2048, kernel_size: 5, stride: 2, padding: 2, dilation: 2, ceil_mode: true, dtype_cases: [{T: bfloat16}], label: ecg-cnn-dilated}

  roofline:
    flops: "N * C * L_out * kW"

MaxPool1dIndicesFwdOp:
  # Equivalent to torch.nn.functional.max_pool1d (return_indices=True)
  ref_api: torch.nn.functional.max_pool1d
  family: pool
  status: implemented

  signature:
    forall: {N: Dim, C: Dim, L_in: Dim, T: "DType[float16 | bfloat16 | float32]"}
