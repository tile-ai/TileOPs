    outputs:
      output: {dtype: T, shape: "[N, C, H_out, W_out]"}
    let:
      kH: "per_axis(kernel_size, 0, 2)"
      sH: "per_axis(stride, 0, 2, fallback=kH)"
      pH: "per_axis(padding, 0, 2)"
      dH: "per_axis(dilation, 0, 2)"
      kW: "per_axis(kernel_size, 1, 2)"
      sW: "per_axis(stride, 1, 2, fallback=kW)"
      pW: "per_axis(padding, 1, 2)"
      dW: "per_axis(dilation, 1, 2)"
      H_out: "pool.out(H_in, kH, sH, pH, dH, ceil_mode)"
      W_out: "pool.out(W_in, kW, sW, pW, dW, ceil_mode)"
    shape_rules:
    - "kH > 0 and sH > 0 and kW > 0 and sW > 0"
    - "dH > 0 and dW > 0"
    - "0 <= pH <= kH // 2 and 0 <= pW <= kW // 2"
    - "H_in > 0 and W_in > 0 and H_out > 0 and W_out > 0"

  workloads:
  # Real-model sources: ResNet stem uses 3x3 stride-2 max pooling on
  # 64-channel 112x112 features; VGG blocks use 2x2 stride-2 max pooling;
  # AlexNet-style CNNs use 3x3 stride-2 pooling on early 55x55 features.
  - {N: 32, C: 64, H_in: 112, W_in: 112, kernel_size: [3, 3], stride: [2, 2], padding: [1, 1], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: resnet-stem}
  - {N: 16, C: 128, H_in: 56, W_in: 56, kernel_size: [2, 2], stride: [2, 2], padding: [0, 0], dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: vgg-block}
  - {N: 32, C: 64, H_in: 55, W_in: 55, kernel_size: [3, 3], stride: [2, 2], padding: [0, 0], ceil_mode: true, dtype_cases: [{T: float16}, {T: bfloat16}, {T: float32}], label: alexnet-ceil}

  roofline:
    flops: "N * C * H_out * W_out * kH * kW"

